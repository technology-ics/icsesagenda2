 School of Medicine MBBS Examinations. In addition, he holds the role of Site Chief for the SingHealth-Duke Sports & Exercise Medicine Centre in SKH.Dr Cheow\u2019s subspecialty interests include sports injuries of the shoulder, elbow, and knee, arthroscopic (minimally-invasive) surgery, and shoulder arthroplasty. He has published in various peer-reviewed journals, presented at international, regional, and local scientific meetings, and co-authored book chapters in arthroscopic shoulder surgery.\"\n90fb03c4-958b-4be2-9245-717066a24a5d,Marta,Navarro,\n9111a92f-6769-467d-899f-a41fbfb3786d,Julien,Berhouet,\n9170d533-b4fe-4f51-9f1b-3b3e35fe4146,HARI,ANKEM,\"Assistant Prof Orthopedic Surgery, Associate Orthopedic Residency Program Director, University of Louisville School of Medicine, Louisville, KY\"\n91a8b83d-db63-4cb9-af03-4ddb691ba7da,Frantzeska,Zampeli,\n92032b85-4a54-48eb-b648-b1ad103275cb,Jong Pil,Yoon,\n92067cbd-c888-41b4-8e5c-e4d4b10d7d62,Carolyn,Henein,\"Carolyn Henein, MS, is a medical student at the University of Texas Medical Branch John Sealy School of Medicine. She previously earned a master\u2019s degree in Materials Chemistry from UC Santa Barbara and a bachelor\u2019s degree in Chemistry Honors from the University of Texas. Her current research focuses on hand and upper-extremity surgery, orthopaedic outcomes, and peripheral nerve pathology.\"\n9209a59b-f350-4671-9c4e-aa94f55ef7c6,Paolo,Paladini,\n9267279e-f8c9-433f-9689-8ab626da9822,Garrett,Berger,\n9273db57-6392-470c-8a9e-654b4f992a02,Klaus,Burkhart,\n9297f5a6-5a81-4361-91e0-39d9a44c0f0a,Mario Henrique,Lobao Goncalves,\n93578c4e-9b0c-4db3-80a4-2cd31d29e5ac,Angelo,De Crescenzo,\n936561b1-027e-49bf-8a70-c8afa6012cfb,J. Ryan,Hill,\"J. Ryan Hill, M.D. is a shoulder and elbow surgeon at the University of Arkansas for Medical Sciences, the only tertiary care center for the state of Arkansas and surrounding regions. His research interests center on improving outcomes of shoulder arthroplasty, implementation of technology in shoulder surgery, and improving the management of bone health disorders.\"\n9375b9e8-ee6a-4a6c-8c5f-404a3bcb2956,Juan Arturo,Hurtado,\n9398ed1c-9754-490a-b891-ddfa70e3bc39,Ryan,Lohre,\n9460c460-adf0-4de3-8f99-87e16dd19eec,Todd,Moen,\n948abc02-3ebe-464e-bcae-2906959b046b,Mike,Mulder,\"Shoulder & Elbow Surgeon in Private Practice, Cape Town, South Africa\"\n94918103-ac3b-46ec-8592-2688d496bb18,Hio Teng,Leong,\n953a45e1-1b16-4481-a824-356ae39936d0,Kjersti,Jenssen,\"Past president of the Norwegian Society of shoulder and elbow surgeryConsultant in shoulder. Head of orthopedic research, Lovisenberg Diaconal Hospital in Oslo, Norway\"\n9560ae7f-6f85-45bd-8188-791c695c00d6,Michael,Mastroianni,\n95767848-c450-42ea-9730-a7cf108ae5f6,Eduardo,Malavolta,Associate Professor - University of S\u00e3o PauloHead of Shoulder and Elbow Group - University of S\u00e3o Paulo\n95cfcbd3-3ebb-4939-a913-d6c0f9581d91,Florian,Freislederer,\n9686cecb-1464-441e-a60e-171b3df3be04,Armin,Badre,\"Dr. Armin Badre is an Associate Clinical Professor in the Division of Orthopaedic Surgery at the University of Alberta and an orthopaedic surgeon at the Western Hand and Upper Limb Facility (WULF), Edmonton, Alberta, Canada. His clinical and research focus is exclusively in elbow, hand and wrist surgery, with particular interest in trauma, post-traumatic conditions and reconstruction. He completed fellowship training at the Roth-McFarlane Hand and Upper Limb Centre, and holds an MSc in elbow biomechanics. Dr. Badre is a Board Member and Founding Member of GEN, an executive member of WECAN and CSES, and active in ASES and ASSH.\"\n9697f916-6052-4710-9394-b42f92c17bcc,Amr,Elmaraghy,\"Dr. Elmaraghy graduated from the University of Toronto, Faculty of Medicine in 1994, and completed his Orthopaedic Surgery residency there in 2000. After a Clinical Fellowship in Upper Extremity, Hand and Trauma Surgery, he began practice in 2001. He is currently an Associate Professor in the Division of Orthopaedic Surgery. Dr. Elmaraghy has established a subspecialty practice in Upper Extremity Arthroscopy and Reconstructive Surgery and has been published in a number of peer-reviewed Orthopaedic journals on topics related to upper extremity pathology and surgical technique. During medical school and his Orthopaedic residency, Dr. Elmaraghy played three years for the Varsity Blue\u2019s Men\u2019s Basketball team, and has continued his interest in sports medicine by acting as a consultant to a number of sports teams, including Canada Basketball\u2019s Men\u2019s National Team. Dr. Elmaraghy has also established a dedication and experience in treating injured workers. For over 15 years he was a Consultant for WSIB Hand & Wrist Specialty clinic at the Toronto Western Hospital, and a consultant for the WSIB Shoulder and Elbow Specialty Clinic at the Sunnybrook Holland Orthopaedic and Arthritic Centre. Dr. Elmaraghy is affiliated with and operates at St. Joseph\u2019s Health Centre, now part of UnityHealth Toronto, where he has served in leadership roles as both the Head of the Division of Orthopaedic Surgery and the Chief of Surgery.\"\n96a6640e-e822-44fd-8fb4-3faa7cbd9414,Juan,Pomes,\n96b35096-e68c-4c2e-8fc9-f2ba9b3afbea,Frank,Cordasco,Past President ASESChair Board of Trustees JSES\n96fff6a4-4060-436f-9ad2-e6d4138fc515,Gia,Rodriguez,\n9778da62-a071-448d-8c49-6f8dfed8dc5f,Moehito,Sakaida,\n9793ad4c-4e7e-41ca-a6d7-d99158f39f48,Mauricio,Largacha,\n97eeb895-6047-4517-8159-f8eea294a3f7,Melissa,Wright,\"Dr. Melissa A. Wright is a shoulder and elbow surgeon at Atrium Health Wake Forest Baptist Hospital and an Associate Professor of orthopedic surgery at Wake Forest University School of Medicine. She obtained her medical degree from Washington University in St. Louis and then also completed her orthopedic surgery residency at Washington University in St. Louis. Following residency, she completed a fellowship in shoulder and elbow surgery at MedStar Union Memorial Hospital in Baltimore, Maryland. Dr. Wright is an associate member of the American Shoulder and Elbow Surgeons and serves as an associate editor for the Journal of Shoulder and Elbow Surgery.\"\n980497ff-9cdb-4b3c-94fe-65b3c7b16b6b,Michael,Freehill,\n982b2069-2fb4-46dc-958c-18b76f9a4f47,Pududu,Rachuene,\"Orthopaedics Shoulder and Elbow Surgeon, Adjunct Professor, Head of Orthopaedic Department, PhD Candidate\"\n984ea1b0-7a51-4c49-8119-5a86f14e1575,Maud,Reynier,\"Maud Reynier is a Clinical Research Manager with over 13 years of experience in clinical research, including 10 years in the medical device industry. She holds a Doctorate in Pharmacy and a Master\u2019s degree in Clinical Research. She specializes in the design and management of clinical studies, with a focus on orthopedic devices, particularly shoulder arthroplasty. Her expertise includes regulatory strategies, real-world evidence generation, and international multicenter study coordination. She is dedicated to advancing safe and effective medical technologies through robust clinical evidence.\"\n98b20c35-7f6a-4f62-a18e-75916ae800c7,Neil Patrick,Buac,\n98b68f5f-5567-46af-8a54-e9c98f962a66,Cathy,Winter,\"Cathy Winter is the Founder and Principal of Winter Leadership LLC, an executive coaching and leadership advisory practice. She brings over 30 years of experience in executive coaching, assessment, and leadership/team development.\"\n99de6cfe-82ff-4f01-aa94-8877a8f2f176,Stephen,Weber,Orthopedist specializing in complex shoulder surgery with 4 years experience as FDA Medical Officer\n9a0be687-89f5-47a4-b311-f6a30b55d876,Robert,Hotchkiss,\n9a48f2a2-9856-4ea5-b4ac-8f4694f1edaf,Bassem,Elhassan,\n9a6271c2-e4df-45e3-a413-38065f89e368,Nallamilli Rajyalakshmi,Reddy,\"Dr Reddy is currently a Senior Clinical Fellow in Trauma and Orthopaedics in Cardiff, UK. She was awarded her medical degree (MBBS) in Nepal and completed her MS in Trauma and Orthopaedics in India. Following her move to the UK, she worked as a Trauma and Orthopaedic Registrar in North Wales, during which time she completed an MCh in Trauma and Orthopaedics at Edge Hill University. She subsequently worked as a Shoulder Research Fellow at Wrightington Hospital, UK, where she further developed her interest in upper limb.Alongside her clinical training, she completed a Postgraduate Certificate in Medical Education at Cardiff University and has a keen interest in teaching and research. She has presented her work at national and international meetings and has authored peer-reviewed publications in orthopaedics. Her clinical interests include upper limb surgery, trauma, and arthroplasty, with ongoing involvement in orthopaedic research and education.\"\n9a9b3274-b47f-4103-8508-3677a75db2c8,Lawrence,Gulotta,\n9ae25430-6077-4dd5-98b4-bb8475e46b06,Yiyang,Zhang,\n9b1b9e19-33cf-4dc4-b261-5c96321b66d3,Sabri,Dlimi,\n9b628474-5368-463a-a15e-742c71a01718,Masahiro,Maruyama,\n9badb336-9496-4564-bbd6-66bba4652502,Carolyn,Hettrich,\n9cb4c789-80ea-41ec-8606-3a111aedc485,Alexandre,L\u00e4dermann,\"Dr. Alexandre L\u00e4dermann is a Privat Docent at the University of Geneva and a leading specialist in shoulder and elbow surgery. Since 2011, he has headed the shoulder and elbow surgery division at H\u00f4pital de La Tour, where he focuses on clinical development and teaching.Recognized as a \"\"World Expert\"\" by Expertscape for being the top scholar in shoulder surgery over the past decade, he also ranks in the top 0.2% of orthopedic scientists globally according to Stanford University. He is the founder of BeeMed and Med4Cast, president of the FORE foundation, and an editor for several medical journals, with over 350 publications to his name.Dr. L\u00e4dermann holds prominent roles in the international medical community, including membership in the Central Committee of the French Arthroscopic Society (SFA) and past presidencies of the Swiss Shoulder Society and the SECEC/ESSSE Membership Committee. He regularly chairs major international congresses, including the Val d\u2019Is\u00e8re Advanced Shoulder Course.\"\n9ceda8f3-fed8-4290-b77a-2cf6c9bc88ac,Richard,Friedman,\"DR FRIEDMAN is Vice Chairman of Research and Professor of Orthopedics and Physical Medicine & Rehabilitation at the Medical University of South Carolina in Charleston, and Adjunct Professor of Bioengineering at Clemson University in Clemson, SC. After receiving his medical degree from the University of Toronto Faculty of Medicine in Canada, he completed residencies in Surgery at Johns Hopkins University and Massachusetts General Hospital, and in Orthopedic Surgery at the Harvard Combined Orthopedic Residency Program in Boston. He is a fellow of the American Academy of Orthopaedic Surgeons, American Orthopaedic Association, American College of Surgeons, and Royal College of Physicians and Surgeons of Canada, as well as a member of various professional associations in his field such as the American Shoulder and Elbow Surgeons and European Society for Surgery of the Shoulder and the Elbow. Dr Friedman serves as a reviewer for the Journal of Bone and Joint Surgery, Clinical Orthopaedics and Related Surgery, the Journal of Shoulder and Elbow Surgery, and the Journal of Orthopaedic Research and has published extensively. He has also authored or coauthored numerous book chapters, and been an invited speaker at many national and international medical conferences. Dr Friedman\u2019s special areas of interest are shoulder and elbow disorders, shoulder arthroplasty and arthroscopy of the shoulder.\"\n9d06939c-dab2-4972-a490-d06aee998f83,David,Gill,\"Orthopaedic Shoulder SurgeonAssistant Deputy Clinical Director, AOANJRRDeputy Clinical Director, Clinical Trials and Analytics Unit, AOABoard Director, AOA\"\n9d2305f6-f21c-4eb9-b016-e47ef8de53bb,Sumit,Raniga,\"Associate Professor Sumit Raniga is an award winning, internationally recognised subspecialist orthopaedic shoulder and elbow surgeon. Director of the Macquarie University Translational Orthopaedic Research Lab. Fellow of the Royal Australasian College of Surgeons (FRACS) and a subspecialist orthopaedic shoulder and elbow surgeon with three years of dedicated clinical and research fellowships in world renowned centres of excellence. Mentored by preeminent Professors\u2019 Matthias Zumstein (Bern, Switzerland), George Athwal (Ontario, Canada), Graham King (Ontario, Canada), and Des Bokor (Sydney, Australia). Author of numerous peer reviewed research publications and textbook chapters. The first and only Fellow of the Royal Australian College of Surgeons to be awarded the prestigious Charles S. Neer Award for research in the field of shoulder surgery by the American Shoulder and Elbow Society (ASES) in 2016. Inaugural recipient of the prestigious Shoulder and Elbow Society of Australia's (SESA) North American Travelling Fellowship Award for 2024. An outstanding communicator who is trained to provide the highest standard of evidence-based management and surgical treatment of simple and complex shoulder and elbow problems with compassion and empathy.\"\n9d739c3c-d60a-4c41-be82-24b572013fe6,Bryan,Soth,\"Bryan T. Soth is a medical student at Ohio University Heritage College of Medicine and an Orthopaedic Surgery Clinical Research Fellow at Hospital for Special Surgery. His academic work focuses on sports medicine, shoulder and elbow surgery, arthroplasty, and orthopaedic outcomes research. He is a former Division I collegiate baseball scholarship athlete and team captain.\"\n9edc86af-bcf7-4de4-baf7-1f4e3066baf1,Hyung Jun,Koo,\n9f5996f6-388f-43ad-9fc6-47808f821873,BURAK,DUYMAZ,\"Burak Duymaz, MD, is an Orthopaedic and Traumatology Surgeon at Pasinler Ibrahim Hakki State Hospital, Erzurum, Turkey. He received his medical degree from Hacettepe University Faculty of Medicine and completed his residency training in Orthopaedics and Traumatology at Dokuz Eylul University.He completed a Shoulder and Elbow Fellowship at Charit\u00e9 \u2013 Universit\u00e4tsmedizin Berlin, Germany. His clinical and research interests include shoulder and elbow surgery, shoulder arthroplasty, sports traumatology, shoulder instability, rotator cuff disorders, and musculoskeletal ultrasound elastography.\"\n9f65bd8f-2d74-47e6-86f1-c425c3f1536b,Ankit,Choudhury,\"Ankit Choudhury is a medical student at the Medical College of Wisconsin, currently between his third and fourth years, and is serving as a Clinical Research Associate in the Department of Orthopaedics at Cedars-Sinai Medical Center in Los Angeles. He earned his Bachelor's Degree in Neuroscience from Washington University in St. Louis. His research centers on perioperative outcomes in upper-extremity and shoulder and elbow surgery, with a particular focus on the safety of GLP-1 receptor agonists and other antihyperglycemic agents across procedures.\"\n9fda9f2c-aea6-4320-a32b-98e33eb29ed8,Frances,Whiting,\"I completed my Orthopaedic training in Aotearoa New Zealand, followed by two Fellowships in Upper Limb surgery in Melbourne and Geelong, Australia. I am now working as a Consultant Orthopaedic Surgeon at Hutt Hospital in New Zealand.\"\na0316c4d-49d4-44c3-90bb-485629dcc9e6,Catherine,Fedorka,Dr. Fedorka is an associate professor of orthopedic surgery at Cooper Medical School of Rowan University. She is the associate program director for the orthopedic surgery residency at Cooper University Hospital and the Director of Quality for the Cooper Bone and Joint Institute.\na06201db-2668-4d10-8219-fe5842cb0b13,Philipp,Moroder,\na13227af-58d8-42d5-9835-7bb540e84cac,Ashish,Babhulkar,\"Head of Shoulder & Sports Inj, Deenanath Mangeshkar Hospital, Pune India, Founder president of Shoulder & Elbow Society India\"\na14cba49-afb3-4a95-ae56-d13a06118e4d,Howard,Harris,\"Dr. Harris is board certified, fellowship trained orthopedic surgeon in private practice in Dallas-Fort Worth, Texas. His practice focus is conservative and surgical management of shoulder pathology, including open and arthroscopic procedures of the shoudler.\"\na1594a0a-8dd2-407e-adbc-7ebd016775b5,Charles,Getz,\"Doctor Getz is a Professor of Orthopedic Surgery at the Sidney Kimmel Medical School, Jefferson University in Philadelphia of the Unites States. He serves as the division chief for shoulder and elbow surgery and is on the Board of Directors for Rothman Orthopedics. Additionally, he has a fulltime clinical practice, treating all aspects of adult shoulder and elbow disorders.Doctor Getz is the immediate past secretary treasurer of the American Shoulder and Elbow Society, The ASES Foundation and the Journal of Shoulder and Elbow Surgery. He is the prior Chief Quality Officer for Rothman Orthopedics and for musculoskeletal services within the Jefferson Health System. He has published research on a wide range of shoulder and elbow disorders and is frequent lecturer at national and international conferences.\"\na1765441-4488-4a9b-93bb-25d40f547a5b,Ata Can,Atalar,\"Ata Can Atalar, MD is a Professor of Orthopaedics and Traumatology specializing in shoulder and elbow surgery. He graduated from Istanbul University, Istanbul Faculty of Medicine in 1995 and completed his orthopaedic residency there in 2001, followed by a SECEC/ESSSE fellowship in 2003. After working as a specialist at JFK Hospital and VKV American Hospital, he joined the Istanbul University faculty in 2004, becoming Associate Professor in 2010 and Professor in 2016. He is currently affiliated with the Acibadem Health Group and serves as the SECEC/ESSSE T\u00fcrkiye Delegate.\"\na1e5d978-b6f6-4dcb-9d46-4dc4b98e9bf7,Cholwaish,Chanlalit,\na235e5ef-d0c8-4060-b3a2-cdbee846ee0a,Harry,Beale,\na27e49a0-0272-48b8-b9be-0b066113c4c0,Philipp,Streubel,\na2a57d6a-b9d2-488e-a6a6-593cadaa211b,Lindsey,Droz,\"Lindsey G. Droz, DO, MBA, is an orthopaedic surgery resident at Duke University Medical Center. Her academic interests include shoulder and elbow surgery, sports medicine, and clinical outcomes research. She is actively involved in orthopaedic research and education and plans to pursue fellowship training following residency with subsequent U.S. Navy service.\"\na3141165-1aac-404b-9d75-b7b52ea2347c,Sam,Arnold,\na353ba4f-cc18-4faa-b28b-8341ffab4d06,Christian,Spross,Dedicated Teacher and Shoulder/Elbow Surgeon\na40c6370-3142-48f2-9e01-2fd704393430,Uma,Srikumaran,\na47a3d1c-523f-4319-8ffa-06442e9e4501,Olivia,O'Malley,Ms O'Malley is a Trauma & Orthopaedic Specialist Registrar and is currently completing her PhD at Imperial College London focusing on the clinical and patient outcomes associated with the increasing use of Reverse Shoulder Arthroplasty.\na5a247b8-7ce6-4db4-a57e-4894f4518630,Guillaume,HERZBERG,\na5b29131-19c3-42b7-812a-8ca64b55c6b9,Jong-Ho,Kim,\na6544dca-164b-4527-8f0d-361abf840ddf,Guido,Fierro,\"Guido Fierro, MD is an orthopedic and trauma surgeon specializing in shoulder and elbow surgery. He is the Head of the Shoulder and Elbow Section at Fundaci\u00f3n Santa Fe de Bogot\u00e1. Dr. Fierro is a Past President of the Latin American Shoulder and Elbow Society and a Past President of the Colombian Shoulder and Elbow Society.\"\na6bd9000-227a-4005-b8d2-d7abba052dd0,Giuseppe,Porcellini,\"Associate Professor, Director of the Orthopedic Residency Program - University of Modena and Reggio EmiliaDirector of Orthopedics and Traumatology - Sassuolo Hospital\"\na75dd2af-546f-4bab-b3af-134a965f3295,Yacine,Ameziane,\na7cc5448-a91d-4fed-a1e8-d80f378a3a94,Aseel,Dib,\"PGY-5 orthopedic surgery resident at Atrium Health/OrthoCarolina in Charlotte, North Carolina, with a planned fellowship focus in shoulder and elbow surgery at Columbia.\"\na7ce132d-38b1-46ae-9064-eb5f43a95b5c,Joaquin,Sanchez Sotelo,\"Dr. Sanchez-Sotelo practices as Consultant in the Department of Orthopedic Surgery at Mayo Clinic. He is also appointed as Professor at Mayo College of Medicine. He serves as Division Chair of Shoulder and Elbow Surgery, and Medical Director for both Communications and Marketing as well as Artificial Intelligence for the Department of Orthopedic Surgery. He has been presented the Mayo Clinic Teacher of the Year Award on two separate occasions and has received other awards in the past, including the Mark B. Coventry, Melvin Post, MidAmerica Orthopedic Association, Knee Society, ISOLS 2019, ICSES 2019, AAOS Achievement\u2019s Awards, Course Director for Best Mayo Clinic Course (2017 and 2021), Digital Educator of the Year at Mayo Clinic 2021, ASES Morrey Award in 2024 and 2025, and the Pauwels Medal in 2024. Dr. Joaquin Sanchez-Sotelo MD PhD was born in Madrid, Spain. He graduated as Medical Doctor from Universidad Autonoma de Madrid, and obtained the #1 position in the Spanish National Exam for Medical Graduates. Dr. Sanchez-Sotelo completed his Residency in Orthopedic Surgery at Hospital Universitario La Paz and his PhD Program at Universidad Autonoma de Madrid. He was then selected for a fellowship position at Mayo Clinic and completed a two-year program in adult reconstruction.Dr. Sanchez-Sotelo has published over 500 articles in the peer-reviewed literature in addition to over 50 book chapters. He is co-editor of the most widely read textbook on elbow surgery, \u201cThe Elbow and Its Disorders\u201d. Dr. Sanchez-Sotelo has also published Mayo Clinic Principles of Shoulder Surgery. He is actively involved in the design of implants for joint replacement, shoulder sports medicine, and fracture fixation. Dr. Sanchez-Sotelo serves as course co-director for the Mayo Clinic Annual Elbow Course \u201cTeach the teachers\u201d, the AO of NorthAmerica Sports Course on Shoulder Tendon Transfers and Complex Rotator Cuff Tears, and the International Advanced Course on Elbow Surgery (IACES). He has presented his research in numerous occasions at national and international meetings.Dr. Sanchez-Sotelo is member of multiple professional societies. In the past, Dr. Sanchez-Sotelo served as Board Member at large for the American Shoulder and Elbow Surgeons (ASES), and he was also selected as the 41st ASES President. Dr. Sanchez-Sotelo also serves as Associate Editor for the Journal of Shoulder and Elbow Surgery (JSES), and Deputy Editor for the Journal of Bone and Joint Surgery Am; he has served as associated editor for the Journal of Orthopedic Trauma (JOT). He was selected as Presidential Guest Speaker for the European Society of Shoulder and Elbow Surgery (SECEC), and Rockwood Lecturer for the 2023 International Congress of Shoulder and Elbow Surgery. Dr. Sanchez-Sotelo will also serve as Co-Chair for the 2026 International Congress of Shoulder and Elbow Surgery (ICSES).Dr. Sanchez-Sotelo has developed a special interest in complex reconstructive surgery of the shoulder and elbow joints, as well as in basic science research related to the genetic and molecular basis of orthopedic conditions, particularly joint stiffness, as well as the biomechanics of shoulder and elbow injuries and implants and the application of artificial intelligence to shoulder and elbow surgery. Other interest outside orthopedic surgery include music, cooking, ballroom dancing, travelling and reading.\"\na84940cd-667c-423c-8da1-007f884ede2c,Qihuang,Qin,\"Dr. Qihuang Qin is an orthopedic surgeon specializing in shoulder surgery and sports medicine at Beijing Jishuitan Hospital, China. His academic work focuses on clinical and basic research, with particular interests in shoulder instability, rotator cuff disorders, and osteochondral lesions.\"\na8913502-1c56-4a46-a696-31580ed8b298,Jonathan,Ng,\na8c42996-809d-409c-9341-6ca1e8f361cc,Leonardo,Cavalcanti,\na8df6db2-e4b0-406d-a944-7d6a5564d98c,Randall,Arroyo,\"Randall Arroyo is a medical student at University of California, Riverside School of Medicine and completed a one year research fellowship at the University of Utah.\"\na9220a40-9882-4699-aaa4-e47a9e9fae79,Grant,Garrigues,\"Dr. Garrigues is shoulder and elbow specialist in the sports medicine division of orthopaedic surgery, Midwest Orthopaedics at Rush in Chicago, Illinois, USA. He received his undergraduate and medical degrees from Harvard, a research degree from MIT, completed his orthopaedic residency at Duke University, and a shoulder and elbow fellowship at The Rothman Institute. He was the Head of Shoulder Reconstruction and Co-Director of the Sports Medicine and Shoulder Surgery Fellowship at Duke for a decade before being recruited to Rush. Currently, he is co-team physician for the Chicago White Sox (Major League Baseball) and formerly also of the Chicago Bulls (National Basketball Association). Dr. Garrigues has been honored with multiple awards, including the 2017 ASES European traveling fellowship, a prestigious 2018 OREF grant, an ASES research grant, an NIH R01 grant, and the 2025 Charles S. Neer Award for outstanding clinical science in shoulder surgery. He has authored over 300 publications, multiple textbooks, and was the Co-Chair of the International Consensus on Periprosthetic Joint Infection Shoulder Task-force. Additionally, he has been involved in the design of multiple, successful, FDA-approved shoulder replacement systems.\"\na9238baf-645d-4e0c-bfdd-bb1ff67894ce,Bettina,Hochreiter,\na9e5a84d-4335-48ba-9a69-8ce3634aa9bb,Alessandra,Colozza,\na9f4aed5-4520-4808-9830-37c8d78a60ee,Mar\u00eda,Brotat Rodr\u00edguez,\naa1dd286-d3bc-4e53-854c-74c8271314b2,Xavier,Duralde,\"Dr. Duralde is a native of Atlanta, Georgia. He received his undergraduate education at Harvard University and then went to Columbia University in New York City where he completed medical school, orthopedic residency. He served in the United States Air Force during which time he was stationed in Europe and participated in Operation Desert Storm. While there, he served as the Chairman of the Department of Surgery and the Assistant Chief of Hospital Services of the 20th Tactical Fighter Wing Hospital. He returned to Columbia University for a Shoulder Fellowship under Dr. Louis Bigliani. He joined Peachtree Orthopedic Clinic in Atlanta in 1993 where he practiced until 2023. He served as Chairman of the Department of Orthopedic Surgery at Piedmont Atlanta Hospital as well as Chair of the Orthopedic Clinical Governance Council of Piedmont Healthcare, a 23-hospital system in Georgia. He served as the Lead Orthopedist for the Atlanta Braves for 19 years and also served as the Shoulder consultant for the Atlanta United Soccer team. He is a past president of the American Shoulder and Elbow Surgeons, the Association of Bone and Joint Surgeons, the Georgia Shoulder and Elbow Society and the Georgia Orthopaedic Society. He is currently the Chairman of the Board of Trustees of the medical journal Clinical Orthopedics and Related Research.\"\naa28a3cb-c469-464a-91ed-4e009da9dbfc,Adam,Kwapisz,\"POSITIONUniversity Professor, Clinic of Orthopedics and Pediatric Orthopedics, Clinical and Didactic Center of Medical University of L\u00f3dz, PolandHead Team Physician, Polish Beach Volleyball National Team, Polish National Volleyball Associa-tionEDUCATION2007 Doctor of Medicine, Graduated with Honors, Medical University of L\u00f3dz, Poland2012 Degree of Doctor of Philosophy, Medical University of L\u00f3dz, 2016-2017 International Research Fellowship, Steadman Hawkins Clinic of the Carolinas, The Haw-kins Foundation, Greenville S.C., USA (Program director Dr. John M. Tokish MD, Supervisor Dr Richard J Hawkins)2017-2018 Upper Extremity and Orthopedic Sports Medicine Fellowship, PanAm Clinic, University of Manitoba, Winnipeg MB, Canada (Program director Dr. Peter MacDonald MD, FRCS (C))2024 Doctor of Science, Medical University of L\u00f3dz, PolandMEMBERSHIPSPolish Arthroscopic Society (PTArtro) \u2013 Board Member 2019-2023, Education Committee Chair 2019-2023Polish Shoulder and Elbow Society \u2013 Board Member 2023 \u2013 current The Hawkins Society \u2013 Dr Richar J. Hawkins Fellows SocietyESSKA (European Society of Sports Traumatology, Knee Surgery and Arthroscopy)ESA (European Shoulder Associates)ISAKOS (International Society of Arthroscopy, Knee Surgery and Orthopaedics Sports Medicine)AANA (Arthroscopy Association of North America) \u2013 International Committee Member 2021-2025ASES (American Should and Elbow Surgeons) (2nd Polish surgeon to be invited)SECCEC- ESSSE (European Society for Surgery of Shoulder and Elbow)AAC (Arthroscopy Association of Canada) \u2013 International Liasson REVIEWER ACTIVITY Arthroscopy. The Journal of Arthroscopy and Related Research \u2013 Editorial Board VJSM \u2013 Editorial Board AJSM \u2013 Editorial Board JSES, JSES Int, EOR EFORT \u2013 Reviewer\"\naa31019e-bb11-478f-873c-d46b1de33a78,Pierre,Mansat,\naaee1f72-c59a-42cb-b9ee-2eefb97423d3,Rodrigo,de Marinis,\"Dr. Rodrigo de Marinis is an orthopedic surgeon from Santiago, Chile, specializing in shoulder and elbow surgery. He serves as Clinical Assistant Professor at Pontificia Universidad Cat\u00f3lica de Chile and works at both the UC\u2013CHRISTUS Health Network and Hospital Dr. S\u00f3tero del R\u00edo.Dr. de Marinis completed a Shoulder and Elbow Fellowship at Cl\u00ednica Alemana de Santiago and a Research Fellowship at the Mayo Clinic in Rochester, Minnesota, under the mentorship of Dr. John W. Sperling and Dr. Joaqu\u00edn Sanchez-Sotelo. His clinical and research interests focus on shoulder arthroplasty, complex trauma and reconstruction, shoulder instability, and the integration of artificial intelligence into orthopedic practice.\"\nab4bb53c-c303-404d-8f3d-a4317f7bed61,Scott,Rodeo,\nad57befe-5c24-40ef-a0a5-1d58320d5481,Harvinder,Singh,\"Prof Harvinder Pal Singh is a Consultant Orthopaedic surgeon at University Hospitals of Leicester NHS Trust with a special interest in Shoulder & Elbow Surgery. He holds a Honorary Associate Professor position at University of Leicester and has a PhD in Health Sciences. He serves as a Communications and Digital Officer in BESS council. He is also a Surgeon member of the BESS Journal Steering committee for Shoulder & Elbow journal. He is the Chief Investigator for NIHR funded DIDACT Distal Clavicle trial and is a Shoulder Panel member for the ODEP Orthopaedic Data Evaluation panel. He was part of the UK contingent which was part of The International Consensus Meeting on Infection (ICMI) 2025 Istanbul and helped formulate the International Guidelines for prevention, diagnosis, and treatment of prosthetic joint infections and other orthopaedic-related infections.As a Trustee, he will support the BOA\u2019s work in enhancing clinical research infrastructure across trauma and orthopaedics, promoting diversity, inclusion, and sustainability within the workforce, strengthening our role in implant safety and regulatory policy and encouraging early career engagement and equitable opportunities in training.\"\nadb500c6-b86d-4bd8-b587-3d9f2692f6d1,Kozo,Shimada,\"1985 Osaka University Hospital (Residency)1988 Kagawa Medical University, Dept. of Orthopaedic Surgery(1988-89 Exchanging Fellowship, Humboldt University, Berlin, Germany)(1989 Clinical Fellowship, La Clinique de Longeraie, Lausanne, Switzerland)1991 Osaka Kosei-nenkin Hospital, Dept. of Orthopaedic Surgery1997 Osaka University, Dept. of Orthopaedic Surgery, Assistant Professor2001 Rinku General Medical Center, Director of Dept. of Orthopaedic Surgery2007 Osaka Kosei-nenkin Hospital (Organization restructuring to JCHO Osaka Hospital in 2012), Chief of Upper Extremity Division2012 JCHO Osaka Hospital, Director of Dept. of Emergency / Sports Medicine2020 JCHO Osaka Hospital, Director of Dept. of Orthopaedic Surgery2022 JCHO Osaka Hospital, Vice President\"\nae3dd055-90f9-407d-91fd-79b53241fbba,Basim Fleega,Fleega,Orthopedic Board Germany 1984\nae8fe759-57ca-45f7-9a16-6bc797f4be75,Salim,Parbtani,\"Salim Parbtani, DO is a PGY-4 Orthopaedic Surgery Resident at St. Joseph's Medical Center in Stockton, California. Originally from South Florida, Dr. Parbtani completed his medical education at Touro University Nevada and has developed a strong interest in shoulder and elbow surgery. His academic and clinical interests include shoulder arthroplasty, rotator cuff surgery, and upper extremity nerve entrapment syndromes. He is actively involved in orthopaedic research and looks forward to pursuing fellowship training in shoulder and elbow surgery.\"\naf130039-477d-46aa-82b5-dbd62effc450,Ben,Hughes,\"Ben graduated from the University of Brighton, UK in 2005. After gaining experience as a general musculoskeletal physiotherapist, he joined the Royal National Orthopaedic Hospital in 2013 and developed a specialist interest in the upper limb working in the Shoulder, Elbow and Peripheral Nerve Injury Unit.Ben is currently an Advanced Physiotherapy Practitioner at Wrightington, Wigan & Leigh NHS Foundation Trust where he continues to provide assessment and rehabilitation for complex upper limb conditions, working alongside his orthopaedic colleagues. Ben has lectured nationally on upper limb rehabilitation and is currently undertaking a pre-doctoral research fellowship with the NIHR alongside his clinical work.\"\naf3fe7c0-9f89-4e51-9b30-8480bf60919b,Ricardo,Mendes,\"Shoulder and Elbow Surgeon, trained at the NAEON Shoulder and Elbow Group in S\u00e3o Paulo, Brazil.Currently serves as Director and Fellowship Program Coordinator of the NAEON Shoulder and Elbow Fellowship.Member of the Arthroscopy Association of North America (AANA) and the International Society of Arthroscopy, Knee Surgery and Orthopaedic Sports Medicine (ISAKOS), actively participating in international academic and surgical initiatives.\"\naf73bfa1-4fad-48b7-a4c2-364552a78b27,Francesco,Franceschi,\"Francesco Franceschi is the Director of the Department of Orthopedic Surgery and Traumatology and Professor of Orthopedics at the San Pietro hospitalFatebenefratelli of Rome Link Campus University.He is also the director of the Orthopaedic specialization and shoulder Felloship Program.After terminating his residency, he completed a fellowship program in 1996 in Kerlan Jobe clinic in Los Angeles and was a visiting professor in many usa andFrance shoulder surgery centers.Since 1997, he was in charge of the Shoulder and Elbow Reconstructive Surgery Unit of Campus Biomedico University in Rome and since the 2014 was the chiefof the joint surgery unit. During his tenure, new and innovated techniques have been introduced, like complex prosthetic procedures and arthroscopic Latarjetor arthroscopic treatment of massive rotator cuff. In addition, a number of research projects in shoulder surgery have been initiated and developed.The main topics his research is focused to are shoulder instability, rotator cuff tear repair and reconstruction of complex revision shoulder arthroplasty cases.Numerous communications to national and international meetings have been presented, and more than 100 publications in peer-reviewed journals have beenpublished.He was Associate Editor of the ESSKA journal. He has also been part of the faculty of prestigious shoulder meetings in Europe and America and organizer ofcutting edge international meetings.Francesco Franceschi is also an active member of national and international scientific societies, like the European Society for Surgery of the Shoulder and Elbow(ESSSE), the European Society for Sports, Knee and Arthroscopy (ESSKA), and the International Society of Arthroscopy, Knee Surgery and Orthopaedic SportsMedicine (ISAKOS).He has now member by appointment of the Shoulder Committee of the International Society of Arthroscopy, Knee Surgery and Orthopaedic Sports Medicine(ISAKOS). He is the President of the arthroscopic committee of the SIAGASCOT.\"\nb10d47a7-502a-4b5f-9fa6-ab619bbdb419,Stephen,Roche,\nb1b39e98-a409-4e4d-a4a0-6d37558afb4b,Ralph,Hertel,\nb237be66-9eeb-4cea-bcb3-6d640af247c7,Bruce,Miller,\"Dr. Miller is a Professor of Orthopaedic Surgery at the University of Michigan and specializes in sports medicine and surgery of the shoulder and knee. He also has an active practice in shoulder replacement surgery. Dr. Miller is a Team Physician for the University of Michigan Athletic Department and Football Team. He also serves as the Medical Director of MedSport, the University of Michigan\u2019s Sports Medicine Clinic.Dr. Miller graduated from Harvard Medical School and was an All-American athlete as a Harvard undergraduate. He continued at Harvard University to complete his residency training in orthopedic surgery as well as a Fellowship in Orthopedic Trauma Surgery. In addition, Dr. Miller has completed Fellowship training in Shoulder and Elbow Surgery in Sydney, Australia, followed by a Fellowship in Sports Medicine, Knee and Shoulder Reconstructive Surgery at the Steadman Hawkins Clinic in Vail, Colorado.Dr. Miller specializes in all disorders of the shoulder, including shoulder replacement surgery, rotator cuff surgery, instability surgery, and fractures. His practice also includes all sports injuries of the knee and shoulder (ACL and meniscus tears of the knee, cartilage injuries of the knee, and shoulder instability).Dr. Miller has an active clinical research program focusing on shoulder replacement surgery and rotator cuff disorders. His research in these areas has been recognized with many honors and awards. He has authored numerous articles, chapters, and peer-reviewed publications on shoulder and knee injuries.\"\nb2bcb2ba-1127-42c6-95f0-ac0845df8dd2,Biagio,Abate,\nb31bccf0-7eb4-4421-8556-aad83b4f6c8f,Emmanouil,Brilakis,\"Dr Emmanouil (aka Manos) Brilakis, MD, MSc, PhD, was born in January 1976 in Athens, Greece. He lives and works in Athens. He is an Orthopaedic Surgeon specialising in Shoulder, Knee, and Sports Orthopaedics. He is married and has two children. He received his degree from the Medical School of the National and Kapodistrian University of Athens in 2003. Subsequently, he completed a residency training programme in Trauma and Orthopaedics at the 2nd Orthopaedic Department of the same university. He then undertook a shoulder fellowship programme at the Centre for Shoulder Arthroscopy and Open Surgery in Athens, which is an ESSKA and ISAKOS-accredited teaching centre. Additionally, he obtained an MSc in Metabolic Bone Diseases in 2010 and completed his PhD thesis in Finite Element Analysis in 2018. The 3rd Orthopaedic Department of Hygeia Hospital (an ESSKA and ISAKOS-accredited teaching centre) appointed him to a consultant position in 2017. In 2020, he was nominated as Associate Director of this department. He is also available for private consultations at his office (Brilakis Orthopaedics) in Palaio Faliro, Greece. In the past, he was appointed Head Team Doctor for several Greek teams, distinguishing the female Basketball teams of Olympiakos Piraeus and Panionios GS. He is currently an attending physician for many high-level athletes in track and field, gymnastics, basketball, martial arts, etc, and he is also consulting for Basketball Teams and Track & Field Athletes. He is actively involved in research, having published articles and book chapters in national & international publications. He regularly teaches in post-graduate training programs at Athens Medical School. He is an active member of many National (Athens Medical Association, Hellenic Association of Orthopaedic Surgery and Traumatology, Hellenic Arthroscopic Association, Hellenic Osteoporosis Foundation) and International (ESSKA, ESA-ESSKA, ISAKOS, AAOS, AANA, SECEC/ESSSE) Scientific Societies. He is a member of the Editorial Board of the Journal of ISAKOS. He was elected to the Board of the Hellenic Association of Orthopaedic Surgery and Traumatology (HAOST) for the periods 2017 (Member), 2020-2021 & 2022-2023 & 2023-2025 (Treasurer). He was a Board member of ESA (a Section of ESSKA) for 2022-2024 and is currently Vice-President of the same organisation for 2024-2026, followed by the position of President for 2026-2028. He is also the Chair of the Communications Committee of ISAKOS (2023-2025).The areas of his scientific and research interest are the following: shoulder arthroscopy, instability, irreparable RC tears, shoulder arthroplasty, knee arthroscopy, and sports orthopaedics.\"\nb32caf6b-dc7e-4749-ad56-038aa6c2e043,Daniel,You,\nb3327b05-1b84-45ab-8f43-d38a0115538f,Jonathan,Levy,\"Dr. Levy joined the Paley Orthopedic and Spine Institute after spending 16 years at Holy Cross Orthopedic Institute with a subspecialty interest in shoulder and elbow disorders where he was Chief of Orthopedics for over 12 years and Director of the ASES-Sponsored Holy Cross Shoulder and Elbow Fellowship since 2012. As an internationally recognized thought leader in shoulder and elbow surgery, he utilizes state-of-the art surgical techniques and the latest technologies to treat the entire spectrum of shoulder and elbow injuries and problems. Each year, he performs close to 400 shoulder replacements, over 150 arthroscopic rotator cuff surgeriesDr. Levy attended Northwestern University for both undergraduate studies and medical school, as part of the accelerated 7-year medical program \u2014 the Honors Program in Medical Education. As an undergraduate, he graduated cum laude with honors, and in medical school, was invited into the prestigious Alpha Omega Alpha honor society. Dr. Levy completed his residency training at Jackson Memorial Hospital \u2014 University of Miami. After residency he completed a shoulder and elbow fellowship with Mark Frankle in Tampa and was a visiting clinician with the Mayo Clinic elbow service in Rochester, Minnesota.With a concentrated emphasis on academics, Dr. Levy has authored over 175 peer reviewed publications on various topics in shoulder and elbow disorders. He is a recognized national and international speaker on shoulder and elbow disorders and has been on the cutting-edge of development and surgeon training of the newest shoulder replacement devices. His is a member of the Neer Society, and Active member of the ASES, and former president of ACESS.\"\nb354668d-8999-4db2-b69d-6cce1950f54e,Grace,Tan,\nb37a3b01-9c4e-4dad-8f53-069c6f29c4d1,Ryan,Bicknell,\"Dr. Bicknell is an Associate Professor of Surgery and Mechanical and Materials Engineering at Queen\u2019s University with a clinical interest in shoulder and elbow reconstruction, arthroplasty, arthroscopy and sports injuries. He is also the Paul B. Helliwell Chair in Orthopaedic Research. His research interests include arthroplasty design, biomechanics, computer-assisted surgery and clinical outcome studies. Dr. Bicknell completed subspecialty training in shoulder and elbow surgery in Sydney, Australia, Nice and Lyon, France, and Seattle, Washington. He is currently a member of the American Shoulder and Elbow Surgeons (ASES), the European Society for Surgery of the Shoulder and Elbow (SECEC) and the Canadian Shoulder and Elbow Society (CSES).\"\nb3afd21d-d339-4917-863f-eca1f77d37cf,Kohei,Uekama,\"Kohei Uekama, MD, is an orthopedic surgery resident and PhD candidate at Kagoshima University Graduate School of Medical and Dental Sciences, Japan. His research focuses on shoulder biomechanics, cuff tear arthropathy, and translational animal models investigating joint degeneration.\"\nb451eb05-35a1-49d9-b7c7-2bd18c279843,Necati,Eravsar,\nb47d4b90-f6a2-434e-be43-ab709f5ad595,Eiko,Hashimoto,\nb4d4f15d-b901-4af9-9277-4ee5e880860c,Jonah,Davies,\nb516d321-f2c7-44f0-8d63-bc56eec36df0,Yash,Agrawal,\nb53f5f4a-749a-4836-b5cc-2dab19843f81,Taku,Hatta,\nb553ecb4-2f61-44ad-8f09-e81fb59787c8,Kristine,Italia,\"Kristine Italia is an Orthopaedic Surgeon sub-specialising in shoulder surgery. She currently practises at the St. Luke\u2019s Medical Center in Manila, Philippines. Dr Italia has been highly involved with research projects with the Queensland Unit for Advanced Shoulder Research (QUASR) and Shoulder Surgery Queensland Research Institute (SSQRI) in Brisbane, Australia.\"\nb594a190-087a-4656-bb94-c66a95f4d2fb,Paulo,Belangero,\nb5deffba-fd51-4ad3-a237-7f3004e8334e,Sanjay,Desai,\"Consultant Shoulder & Knee Surgeon, Mumbai, India\"\nb65f1078-f6d5-474b-bba4-fbf0d7aa9fb9,Oke,Anakwenze,\nb66b625c-fdc7-44a9-996f-068119336205,Raahil,Patel,\nb691cc2a-5ec9-48b9-a768-da9a5de2b0e9,Mohammad,Sobhi,\nb6c2cfb0-6e58-4eb8-8d97-12a2389d0c2e,Suguru,Mori,\nb6f865d3-81aa-464e-8c52-38c1bf92186d,Maxime,ANTONI,\nb70761b7-2675-4466-8f53-eb0d71ba52a4,Luis,Pires,\"Sholuder and Elbow Surgeon since 2009Orthopedic consultant for the Generali/Tranquilidade Insurance company since 2009Orthopedic surgeon at the Shoulder and Elbow Unit of Hospital da Luz since 2009Director of the Orthopedics Unit at Hospital de Marinha from 2009 to 2012Director of the Shoulder Unit at Hospital Beatriz \u00c2ngelo since 2024Director of the Central Workplace Accident Unit at Torres Lisboa of Generali/Tranquilidade since 2025300 Shoulder and Elbow surgerys per year ( Trauma, Arthroplasty and Artroscopic )\"\nb711a4fb-cd4e-4d79-a3f5-f49849185a48,Samy,Bouaicha,\nb716be7e-67e9-425b-bea6-59375fbb8537,Erin,Lee,I am a CIHR Postdoctoral Fellow at the University of Waterloo. My research investigates how variation in bony morphology alters joint biomechanics and propensity for injury.\nb75dfabe-367e-4d4f-9460-c3e35447b031,Larry,Field,\"Larry Field M.D. has practiced shoulder and elbow surgery at Mississippi Sports Medicine and Orthopedic Center in Jackson, Mississippi for over 30 years. His research pursuits focus on clinical shoulder and elbow investigation. Dr. Field serves as director of his organization\u2019s Sports Medicine Fellowship program.\"\nb7f17dda-fc1d-4d25-ae4d-e0c81b4357d9,Winston,Jin,\nb7f2473b-77ee-42a9-a410-a2da8ad6e4cd,Caroline,Park,\nb8103249-1edd-49eb-beb8-800c5ad7e516,Andrew,Ni,\nb860218c-f3a8-4d5c-9244-a64a22bf0c50,Benjamin,Zmistowski,\nb8f2d990-efd5-4fb4-9230-188f4b7e9950,Giorgio,Ippolit,\nb93b5bde-0721-450f-9c5b-77a2fd1b6790,Jakub,Kaszynski,\"Dr. Jakub Kaszynski graduated with a Master\u2019s degree from Poznan University of Medical Sciences in 2018 and received his PhD in April 2023. His doctoral dissertation focused on the prospective functional assessment of treatment outcomes in knee osteoarthritis using autologous fragmented adipose tissue and platelet-rich plasma, comparing the effectiveness of both therapeutic methods.He began his professional practice during his studies at Rehasport Clinic, where he continues to work today. He has also collaborated with the Greater Poland Football Association and the Polish National Beach Handball Team.Dr. Kaszynski is a certified manual therapist according to the Kaltenborn-Evjenth concept. In his clinical practice, he places strong emphasis on movement-based therapy, exercise, and patient education. His main areas of expertise include conservative treatment, postoperative rehabilitation, and later-stage return-to-sport rehabilitation following shoulder, elbow, and knee injuries.Since 2020, he has also been involved in academic teaching. He currently serves as an Assistant at the Department of Paediatric Orthopaedics and Spinal Disorders at Poznan University of Medical Sciences. He is Secretary of the Board of the Physiotherapy Section of the Polish Arthroscopy Society and a member of the Polish Shoulder and Elbow Society.\"\nb942f7ff-246a-4eb7-98d1-ff8f32f5ec0e,Kun-Hui,CHEN,\nb94627b1-3089-493a-9f88-c77e187adf5a,Mustafa,Rashid,\nba245a22-c818-445f-9091-8a3c8a306da3,Jennifer,Traverse,\nba45e6ca-f07f-431a-8fdc-d5542fbbca4d,Steve,Gwilym,\"Steve Gwilym is Professor in Orthopaedics at the University of Oxford and a Consultant Orthopaedic and Trauma Surgeon exclusively managing shoulder problems. His practice and research focus on shoulder surgery, shoulder trauma and evidence-based surgical care. He has led numerous NIHR-funded trials in upper limb trauma and shoulder conditions. He has held many national roles including Chair of the British Elbow and Shoulder Society Research Committee, and is on the Board of the UK's National Joint Registry. His work combines clinical expertise with rigorous research methods to improve clinical decision-making and outcomes for patients with shoulder pain and upper limb injuries.\"\nba492160-6f83-49ec-855d-c96613ab8230,Wei,Zhang,\nba6182e5-66ea-4718-946d-ef0bd2ecafb5,James,Gregory,\nba819f96-cc01-47ce-87cf-07cfe79ee134,Ryosuke,Ozawa,\"I am a radiologic technologist in Japan with a particular focus on the shoulder. My research interests include CT- and MRI-based assessment of the rotator cuff and deltoid muscle, as well as imaging evaluation of outcomes after reverse shoulder arthroplasty.\"\nbbf1299b-0a5a-4c78-9244-fecc6b7bb83d,Julie,Bishop,\"Dr. Bishop is currently a full professor and chief of the division of shoulder surgery in the department of orthopaedics, at The Ohio State University Wexner Medical Center. She is the academic vice chair of the department of orthopaedics as well as the vice chair for finance and compensation. She is also the director of Clinical Operations at the Jameson Crane Sports Medicine Institute. Dr Bishop attended Cornell University for undergraduate training and then Cornell University Medical College, graduating with her medical degree and honors in research. She completed her internship and residency at George Washington University. Dr. Bishop went on to do fellowships at both Mount Sinai Medical Center (shoulder surgery) and the University of Pittsburgh (visiting sports medicine fellowship). She is a member of the MOON shoulder consortium and active in many multicenter research trials as well. She is an active member of AOSSM, AOA, AAOS, and is the 2nd VP of MAOA and currently serves on the executive committee of ASES as the secretary/treasurer.\"\nbc388c15-977f-49d4-8340-ea89619563f4,Taechang,Hong,\nbc6170f3-7348-4f42-a6f4-c15bee719067,GIOVANNI,DI GIACOMO,\"Giovanni Di Giacomo is the Head of the Orthopedics and Traumatology department at Concordia Hospital in Rome, Italy (ISAKOS Teaching Center). Since 1995, he is the Chief Sports Physician for the ATP (Professional Tennis Players Association) for the WTA (Women\u2019s Tennis Association) during the Italian Open at Rome\u2019s Foro Italico, and the NITTO ATP Finals starting in 2021 at PALA ALPITOUR, Turin (Italy).European Chairman of STMS (Society for Tennis Medicine and Science) since 2016.From March 2022 to March 2023 President of the \u201cItalian Society for Arthroscopy, Knee, Upper Limb, Sports, Cartilage, and Orthopaedic Technology\u201d (SIAGASCOT).Since April 2023 Past President of the SIAGASCOT.Lecturer on the Master\u2019s Degree course in Physiotherapy Applied to Sports and Artistic Activities at Siena University (1st level Master)Scientific Director of the \u201cShoulder Academy\u201d High-level Training Course (Rome).Di Giacomo is a member of many prestigious scientific societies: SIOT (Italian Society of Orthopedic and Traumatology) and SICSeG (Italian Society of Shoulder and Elbow Surgery).Co-Chair of the ISAKOS Shoulder Committee for the 2025-2027 term. International Member of AAOS (American Academy of Orthopedic Surgeons).Corresponding Member ASES (American Shoulder and Elbow Surgeons), ESSKA Member (European Society of Sports Traumatology, Knee Surgery, and Arthroscopy), and AANA (The Arthroscopy Association of North America). Consultant Physician for FIDIA Pharmaceutical InternationalStryker TrainerInventor of the \u201cWedged Profile Mini Plate\u201d produced by Arthrex Inc. for use during the \u201cLaterjet Procedure\u201dDr. Di Giacomo\u2019s research papers have been published in internationally acclaimed journals, such as Arthroscopy, The Journal of Arthroscopy and Related Surgery, The Journal of Bone & Joint Surgery (JBJS), Sports Medicine, the American Journal of Sports Medicine etc. Together with E. Itoi and S.S. Burkhart, Dr. Di Giacomo co-authored the most downloaded article in the history of the journal \u201cArthroscopy\u201d: Evolving concept of bipolar bone loss and the Hill-Sachs lesion: from \u201cengaging/non-engaging\u201d lesion to \u201con-track/off-track\u201d lesion. He is the author of numerous books published by Springer.\"\nbc75b7a2-0640-4ae7-b67f-8cf91e6161fb,Adam,Lencer,\nbc904054-47ef-491a-8a98-6e02dda3d985,Jin-Young,PARK,\"Jin-Young Park, M.D.,Ph.D. (drpark@naver.com) Director of NEON Orthopaedic Clinic, Global Center for Shoulder, Elbow & Sports Medicine, Seoul, Republic of KoreaCP: +82 10 4922-5009 Jin-Young Park is director of NEON orthopedic clinic. Before starting the clinic, he was a director of orthopedic department in Konkuk university medicine school and deputy president of Konkuk university hospital Seoul, KOREA/Dr. Park completed his orthopedic surgery residency training at Seoul National University Hospital in 1994. In 1998, he completed fellowship in Columbia-Presbyterian Medical Center to Louis U. Bigliani, M.D (1st Asian fellow of prof. Bigliani). He published 180 papers and 9 books. Dr. Park is member of medical committee of Korea Baseball Organization (KBO) & Korea Handball Federation (KHF). He was president in Korean Shoulder & Elbow Society (KSES, 2010), Korean Orthopedic Ultrasound society (KOUS, 2017), Korean Society of Sports Medicine (KSSM, 2021) & Korean Orthopedic Pain Society (2022).He was an editor in Asia, Journal of Shoulder and Elbow Surgery (JSES) from 2003 to 2009 and he is an assistant editor of JSES & associate editor of Seminar in Arthroplasty of JSES. now. He was a chairman of international congress of shoulder & elbow surgery (ICSES, Jeju, 2010), secretary of International Board of Shoulder & Elbow Surgery from 2019 to 2023 and member of Korean Olympic Committee from 2002 to 2017.Home page: www.neon.or.krBlog: https://m.blog.naver.com/neonshoulder\"\nbcf4787f-f59f-4e0d-9056-d312d59fc56d,Andrew,Rees,\"Andrew Rees, MD is a chief resident at OrthoCarolina & Carolinas Medical Center who will be pursuing Shoulder & Elbow fellowship at the Cleveland Clinic after completion of residency.\"\nbd828365-3abe-49c6-80d9-c858cd48e1ed,Jae-Chul,Yoo,\nbdace81c-a645-4a61-a81a-489ecd579507,Ryunosuke,Abe,\"Ryunosuke Abe, MD, PhD, is a board-certified orthopedic surgeon at Hyakutake Orthopedic and Sports Clinic in Japan. He graduated from Fukuoka University School of Medicine in 2015 and completed his initial residency at Fukuoka Tokushukai Hospital. In 2017, he joined the Department of Orthopaedic Surgery at Kurume University, where he trained at multiple affiliated institutions, including Kurume University Hospital, St. Mary's Hospital, and Kurume University Medical Center. He obtained board certification in orthopedic surgery in 2022 and was awarded his PhD from Kurume University in 2023. His clinical and research interests are focused on disorders of the shoulder and elbow and sports medicine, with a particular emphasis on the management of osteochondral lesions of the capitellum. His current research investigates the clinical outcomes of osteochondral autograft transfer based on lesion location.\"\nbdf8c04a-cb19-4b58-b24b-c498559f8c60,Sadiq,Alaqaili,\nbe92c666-72e6-445e-821d-5c1943599afb,Martin,Bouliane,\"Assistant Professor University of Alberta, Edmonton, Alberta. Shoulder Lead for Edmonton Zone. Dr. Bouliane specializes in all aspects of shoulder surgery including complex reconstruction, arthroplasty, arthroscopy, and traumatic conditions.\"\nbf063733-5e67-45c1-ae33-d5a689d8d714,Samuel,Staub,\nc0c0330f-1404-465d-95e5-9f0b14543cfb,Henry,Fox,\nc13348ab-b62d-46b3-b661-56c9054b80b6,Adam,Khan,\nc18629ce-6fbd-4c4c-8133-d70faa0007e9,Duane,Anderson,\"MD University of Minnesota, Orthopaedic residency University of Minnesota 1988, USA private practice 1988-2005, Mission hospital practice in Soddo Ethiopia, 2005- 2023 full time, 2023-present, part time.\"\nc20d86b4-d6dd-49d5-b4f5-1b768b79b768,Kazuki,Yoshida,\nc26182c2-88aa-4dbd-9c05-8ee2d13e8e64,J. Michael,Wiater,\"J. Michael Wiater, MD is an orthopaedic surgeon whose practice is limited to arthroscopic and reconstructive shoulder and elbow surgery. Dr. Wiater received his BA degree from the University of Notre Dame in 1989. A graduate of the University of Michigan Medical School in Ann Arbor, Dr. Wiater completed an orthopaedic surgery residency at the University of Michigan Medical Center, followed by a fellowship in shoulder and elbow surgery at Columbia University Medical Center in New York City in 1999. He is a Diplomate of the American Board of Orthopaedic Surgery and holds a Subspecialty Certificate in Orthopaedic Sports Medicine. Dr. Wiater has published many peer-reviewed scientific articles and book chapters and has lectured extensively at regional, national, and international meetings about numerous topics in shoulder and elbow surgery. In 1999, Dr. Wiater joined the faculty of the Department of Orthopaedic Surgery, Corewell Health William Beaumont University Hospital, Royal Oak, MI, USA, where he is the Chief of Shoulder Surgery. Dr. Wiater is a Professor of Orthopaedic Surgery at the Oakland University William Beaumont School of Medicine. He currently trains orthopaedic surgery residents and fellows and conducts original scientific research. He is the Program Director for the ACGME-accredited Fellowship in Adult Reconstruction-Shoulder and Elbow Surgery. In 2012, the orthopaedic surgery residents honored Dr. Wiater with the Teacher of the Year Award. He holds active memberships in the American Shoulder and Elbow Surgeons, ASES - Neer Circle, American Orthopaedic Association, and the American Academy of Orthopaedic Surgeons. Dr. Wiater is a founding Editor-in-Chief for Journal of Shoulder and Elbow Arthroplasty. In addition, Dr. Wiater has served as an Oral Examiner for the American Board of Orthopaedic Surgery and is a reviewer and editor for multiple peer-reviewed orthopaedic publications. His primary clinical and investigative interests include the outcomes and design of anatomic and reverse total shoulder arthroplasties. He has a busy private practice in Beverly Hills, MI, USA and has been selected by his peers as an Hour Detroit Magazine Top Doc.\"\nc3394a0d-6574-4087-87f5-b963b0d564e8,Alyssa,Basdavanos,\nc3614712-d74f-4558-82ba-b12ca15f7844,Leslie,Barnes,\"Leslie Barnes, MD, is Professor of Orthopaedic Surgery at the Lewis Katz School of Medicine at Temple University in Philadelphia, Pennsylvania, USA. Dr. Barnes is an internationally recognized shoulder and elbow surgeon, educator, and researcher. She currently serves as Chair of the American Shoulder and Elbow Surgeons (ASES) Foundation Committee on Patient-Centered Initiatives, and Co-Chair of the American Academy of Orthopaedic Surgeons (AAOS) Clinical Practice Guideline on the Management of Shoulder Instability. She also serves on the AAOS Shoulder and Elbow Instructional Course Lecture Committee and the Arthroscopy Association of North America Research Committee.At Temple University Hospital, Dr. Barnes is Medical Director of the Inpatient Orthopedic Unit and has been a dedicated mentor to residents and medical students. She has authored numerous peer-reviewed publications and book chapters, and is widely recognized for her contributions to advancing shoulder and elbow surgery.\"\nc3f26c54-82f9-46fc-a727-5b488853db47,Jennifer,Kurowicki,\nc4103300-776b-4301-a3b9-777d1b6a8b11,pierre,mansat,\nc432f3c3-5888-4e29-a7fd-29caffb0d65e,Joseph,Abboud,\"Dr. Abboud is a Board Certified Orthopaedic Surgeon and specializes in the treatment of patientswith shoulder and elbow disorders. He is an internationally recognized authority on the treatmentof shoulder and elbow disorders. He is a Professor of Orthopaedic Surgery at the Sidney KimmelMedical College of Thomas Jefferson University and a core member of the teaching faculty forRothman Orthopaedics Dr. Abboud received his medical degree with honors from Georgetown University School ofMedicine and went on to complete his residency in Orthopaedic surgery at the Hospital of theUniversity of Pennsylvania where he served as the administrative chief resident and received theaward . He subsequently completed two (one-year) fellowships at the University of Pennsylvaniain Shoulder and Elbow surgery and Orthopaedic Biomechanics. Dr. Abboud has published over250 peer reviewed publications, given over 600 invited lectures nationally and internationally,and published several textbooks and numerous book chapters. He has received the prestigiousNeer award and Burkhardt award for excellence in research. Dr. Abboud performs a wide variety of simple and complex surgical procedures on the shoulderand elbow including arthroscopic surgery (e.g. rotator cuff repairs, instability surgery)comprehensive fracture care, as well as shoulder and elbow replacement(arthroplasty)procedures. Dr. Abboud is most proud of the fact that he has been caring for patients throughoutthe Philadelphia region and the Northeast region of the United States. Patients seek out his carefrom all regions of the United States and overseas. His goal is to always provide each patientwith exceptional personalized care.\"\nc490bfc6-527f-4db5-8662-e2a523e8e09f,Saeed,Althani,\nc4ceb0df-6a04-48a5-be48-fd21ffc1da65,Dan,McMahon,\nc5aee096-57e2-43e4-bc90-20429e40f9f8,Maria Antonia,Pena,\"Dr. Maria Antonia Pe\u00f1a, DPBO is a subspecialist orthopaedic shoulder and elbow surgeon. After completing her orthopaedic surgical training at the University of the Philippines - Philippine General Hospital (UP-PGH), she undertook two years of dedicated clinical and research fellowships under world-renowned experts and mentors in Sydney and Brisbane, Australia. She is committed to advancing evidence-based care through clinical practice, research, and international collaboration in shoulder and elbow surgery. She specializes in both open and arthroscopic (keyhole) reconstruction and joint replacement surgeries.\"\nc5e205e6-00ac-4543-8ee8-2577cc9c0def,Michael,Moverman,\nc63237f0-356d-4419-940e-de078a7031ae,Stephen,Daniels,\nc64fe2d8-e214-4d00-931c-328c5f9d46e2,Sang-Jin,Shin,\nc6962cfb-09d8-492e-9d5b-ce0398cf8a0a,Gustavo,Pinto,\nc740d73f-1e06-4cec-bc38-818869cf454d,Myung-Sun,KIM,\nc7f489a1-5fd6-4c97-be20-c308660044ed,Mark,Cohen,\"Dr. Mark Cohen is an orthopedic surgeon specializing in hand, upper extremity, and microvascular surgery. He is a Professor of Orthopaedic Surgery and the Director of Hand and Elbow Surgery at Rush University Medical Center.\"\nc867b8ed-d460-48b9-a01b-ecc314b3c880,Maria,Valencia Mora,Actual position: Shoulder and Elbow Surgery Unit in H. U. Fundaci\u00f3n Jim\u00e9nez D\u00edaz Madrid (Spain) Chair of the Research and Development Committee of SECEC ( European Society of Shoulder and Elbow Surgery)Chair of the Education Committee of SECHC ( Spanish Society of Shoulder and Elbow Surgery)Associate Editor for JSES International\nc8ddf9e2-63c3-468c-b05b-f5871055822b,Frederick,Matsen III,\"Frederick MatsenProfessor, Orthopaedics and Sports Medicine, University of Washington02/05/1944INSTITUTION /CITY/STATEDEGREE(S)YEAR(S)FIELD(S) OF STUDYUniversity of Texas, Austin, TexasBA1964ChemistryBaylor University College of Medicine, Houston TexasMD1968MedicineJohns Hopkins, Baltimore, MarylandInternship1969SurgeryUniversity of Washington, Seattle, WashingtonResidency1974OrthopaedicsI have been on faculty here at the University of Washington Department of Orthopaedics since 1974. I started the Shoulder and Elbow Service and the Shoulder and Elbow Fellowship, both of which are thriving today. I was a founding member and past president of the American Shoulder and Elbow Surgeons. I am the holder of the Douglas T. Harryman Endowed chair for shoulder research. My particular interest has been and remains shoulder arthroplasty. My 25 most recent publications are listed belowChecketts, J. X., et al. (2026). \"\"Does postoperative glenoid component retroversion following anatomic total shoulder arthroplasty affect clinical outcomes? A systematic review and meta-analysis.\"\" J Shoulder Elbow Surg 35(4): 1103-1116.Collins, A., et al. (2025). \"\"Are high cutibacterium bacterial loads at the time of revision shoulder arthroplasty associated with more severe clinical signs or symptoms or increased risk of recurr
