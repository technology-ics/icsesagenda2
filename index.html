Sheth, M. M., et al. (2025). \"\"Can computer vision / artificial intelligence locate key reference points and make clinically relevant measurements on axillary radiographs?\"\" Int Orthop 49(1): 135-141.Sheth, M. M., et al. (2025). \"\"Anatomic total shoulder arthroplasty for posteriorly eccentric and concentric osteoarthritis: a comparison at a minimum 5-year follow-up.\"\" J Shoulder Elbow Surg 34(2): 473-483.Sheth, M. M., et al. (2025). \"\"Baseplate version in reverse shoulder arthroplasty: does excessive retroversion or anteversion affect functional activities of daily living?\"\" Int Orthop 49(5): 1119-1125.\"\nc91476d2-0495-42b7-a16f-7d370c57bb73,Vitor,La Banca,\nc94e852a-0915-4535-82eb-c2debb89d5ff,Cameron,Anley,\nc96b40a5-8191-4111-9a09-384f42217e61,Yang-Soo,Kim,\nc996be6d-e71e-43b6-9af0-d1af035b3a4c,Hanna,Bjornsson Hallgren,\"Hanna Bj\u00f6rnsson Hallgren, Swedish upper extremity surgeon and Assistent Professor at the University Hospital of Link\u00f6ping, Sweden. Educated and trained in Link\u00f6ping since 2005. PhD in 2012 on subacromial pain and rotator cuff injuries since then special scientific interest in the importance of soft tissue lesions in both the shoulder and elbow. Member of SECEC since 2012 and founding member of Global Elbow Network, GEN. Board member of the Swedish shoulder and elbow society since 2016 and the President of the Swedish society since 2025. Supervisor of nine ongoing PhD projects in the field of shoulder and elbow reserach including pain, dysfunction and trauma related injuries. More than 40 peer- reviewed articles and reviewer for several international Journals. Part of several international scientific steering committees and the country manager of a Nordic scientific collaborativee network performing randomized multicentre trials. Member of the European PJI research group with development of a European register for infected shoulder arthroplasties. Presenter at national and international meetings since 2008. 2013 she received the Best national society paper price at the SECEC meeting in Istanbul, Turkey for the work on specific exercises for subacromial pain. Instructor at several international courses on shoulder and elbow surgeries\"\nc9d72bb1-41ec-4272-9754-f3ebcea937b7,Mustafa,Saffi,\"I am a New Zealand Trained Orthopaedic Surgeon. I qualified in 2024. I have completed fellowships in Shoulder and Elbow Surgery in London Ontario at the Roth Mcfarlane Hand and Upper Limb Centre as well as at the Sydney Shoulder Research Institute. I currently practise in Auckland, New Zealand.\"\nc9ecc7f9-7656-4749-a8f3-cbab83738ef7,HYUNGSUK,KIM,\nc9efe132-fabe-4200-af3f-8ba7ab533652,Richard,Appleyard,\nca656005-ece3-466b-9832-bb768dc4d177,Beatrice,Caressa,\nca9df873-b0b4-44bc-9d12-45f73f4d2684,Lizzie,Bond,\"Lizzie Bond is a New Zealand-trained orthopaedic surgeon with a subspecialty interest in sports knee, shoulder and elbow surgery. She completed fellowship training at Duke University in the USA and the University of Cambridge in the UK. She is now based in Dunedin, New Zealand with a busy surgical practice and regular involvement in both teaching and research with the University of Otago.\"\ncac77783-6211-4f99-9124-0effdb268c8e,Niloofar,Dehghan,Orthopaedic trauma and shoulder/elbow surgeon with dual fellowship training\ncb2c2f7c-3de0-45d1-ba5c-e99ce731e81a,Gregory,Bain,\"Foundation Secretary of Global Elbow Network (2024 -26)President of Shoulder and Elbow Society of Australia (2004 -06)Inarguable Chair of Elbow, wrist and Hand COmmitee, ISAKOS (2015 - 19)\"\ncbc6d51d-50bd-4ca8-947d-a26f655e6011,Juan,Lopez-Ovenza,Member of the Argentine Association of Traumatology and OrthopedicsMember of the Argentine Association of Hand and Upper Limb Surgery\ncbfb63b1-6972-4ceb-ae41-320b215c6fba,Jeong Hun,Choe,\ncbffd4ce-2e12-4a18-9d4a-98070e4536cd,Karl,Wieser,\"Prof. Dr. med. Karl Wieser is Head of the Division of Shoulder and Elbow Surgery at Balgrist University Hospital and a board-certified orthopedic surgeon and sports medicine specialist. His clinical and academic work focuses on advanced shoulder and elbow surgery, joint-preserving procedures, and the treatment of complex disorders of the upper extremity. In addition to his surgical expertise, he is active in basic science and translational research, with a particular interest in biomechanics, implant development, and the transfer of innovative technologies into clinical practice. He also holds an Executive MBA, reflecting his broad interest in healthcare management, strategy, and the further development of modern orthopedic care.\"\ncc3e6f85-eca2-4bab-bc43-9ace5ddefc09,Ignacio,Correa,\ncc6b0920-5f3a-4c1c-b646-e37139f49ea0,Joseph,King,\ncd118a75-bd5f-4787-9c7c-55938ada6a4d,Brendan,Shi,\"I recently completed a shoulder & elbow fellowship at the Rothman Institute in Philadelphia, PA. Prior to this, I completed undergraduate studies at Yale, obtained my medical degree at Johns Hopkins, and underwent orthopaedic residency training at UCLA. I am now returning to UCLA to begin my career as as shoulder & elbow specialist within the department of Orthopaedic Surgery. My research interests include RTSA personalization and optimizing management of periarticular upper extremity trauma.\"\ncd17996f-8182-4347-b5b7-f429be86ab04,Michael,Deegan,\nce7e156e-e147-4976-a747-420fc2ae81fa,Sungjoon,Lim,\"Sungjoon Lim, MD, is an Assistant Professor of Orthopaedic Surgery at CHA University School of Medicine and a shoulder and elbow surgeon at CHA Bundang Medical Center in South Korea. His clinical and research interests include rotator cuff repair, shoulder instability, joint-preserving surgery for irreparable rotator cuff tears, and shoulder arthroplasty. He is also involved in resident education and clinical research, with a particular interest in surgical techniques and biologic augmentation for challenging shoulder conditions.\"\ncf137dc0-16de-4c99-9b1a-80ea35147e55,Thomas,Duquin,\ncfa54bae-e995-4448-ae8a-9b0c7b35af35,Yijie,Luo,\"MS2 attending the University of California, Irvine, School of Medicine. Interested in orthopaedic surgery, particularly shoulder/elbow! Excited to be here.\"\ncfda9000-2890-4b9f-b8cc-af1326f04365,Nick,Aloi,\"Orthopaedic Surgery Resident Physician (PGY-3) at UPMC Hamot Medical Center (Erie, PA)Medical Degree from University of Pittsburgh School of Medicine Class of 2024 (Pittsburgh, PA)Bachelor of Science in Molecular and Cellular Biology from Johns Hopkins University Class of 2020 (Baltimore, MD)\"\ncfe72e2e-3892-411a-90ed-6e675c7f0c47,Shannon,Carpenter,\"Dr. Shannon Carpenter is a fellowship-trained orthopedic shoulder and elbow surgeon and founder of The Bone Health Clinic in Lenexa, Kansas. She serves as Clinical Associate Professor at the University of Kansas Medical Center.Dr. Carpenter is a full Member of the American Shoulder and Elbow Surgeons (ASES) and a Neer's Circle Fellow. In 2026, she received the Robert F. Gagel Award from the Bone Health and Osteoporosis Foundation.Her clinical and academic interests center on rotator cuff disease, shoulder arthroplasty, and the intersection of musculoskeletal and bone health, with a particular focus on bonespan care for patients. She is a frequent speaker on shoulder pathology, bone health, and preventive musculoskeletal medicine.\"\ncff5d106-d3ed-4793-9fb8-c557d8420d42,Sophie,Grosclaude,\nd0a8f7ac-923f-47ab-b23f-643bcd7435d1,Shoaib,Javaid,\nd16b34e6-2d0a-4a2d-aa93-2bce3ff7e6ff,Patrick,Denard,\nd18418fc-c71b-4f82-85d6-a325408b03f8,Sung Min,Rhee,\"Sung-Min (Luke) Rhee, MD, PhD, is an Associate Professor of Orthopaedic Surgery and shoulder specialist at Kyung Hee University College of Medicine, Seoul, Korea. A 2026 ASES Neer Award (Basic Science) recipient, he has published over 100 peer-reviewed papers on rotator cuff healing, shoulder arthroplasty, and AI-based digital healthcare.\"\nd1a81333-ea6b-4a31-a626-99c84ed8edc5,Rui,Claro,\nd224dcae-4883-4462-9f89-937015129797,Jie,Yao,\"I am a shoulder and elbow surgeon at NYU Langone Health. I specialize in managing a wide range of shoulder and elbow conditions, from simple sprains to complex revision surgeries. My research interests include the application of artificial intelligence to clinical care, the mechanics and biological underpinnings of cartilage and tendon healing, as well as the host-implant interface between metal ingrowth surfaces and bone. I am a member of the teaching faculty here at NYU Langone Health and am actively involved in medical student, resident, and fellow education.\"\nd23e48c7-44d1-42d8-ab2b-9cd91d5f99c8,Sherif,Elgamry,\nd2770de8-312b-4c03-bbed-d28294750e2c,Mustafa,Rashid,\nd2b2c2bd-5f75-4cc2-b716-d63fcc91de25,Tjarco,ALTA,\nd2bc2728-4d46-4bd1-9ab8-fd578c326d69,Evan,O'Donnell,\nd2bc7b33-d72d-4423-8e92-d915f3c45087,Emilie,Cheung,\nd2d278e7-3714-43a2-bc61-95eec76abf96,Chris,Schmidt,\"Director Of Shoulder and Elbow Fellowship, Department of Orthopaedic Surgery, University of Pittsburgh Medical Center, USA\"\nd34c43cb-912c-40cf-a9e7-19f798f811aa,Aakash,Chauhan,\nd37b8c05-2506-4474-9a14-abd9a5af0c8f,Ken,Faber,\nd47dd04c-5ec6-4c24-b693-965b7f9bb079,Minsu,Lim,Catholic university of Korea. Resident\nd4a3733b-70ac-42d5-bbee-4247bfab16fc,Katsumasa,Nakazawa,\nd4d7088f-fb8a-4b75-a192-497c5cb38037,Ryosuke,Iio,\nd4fcf02f-bb6a-401a-a27a-95f192b859d2,Anthony,Romeo,\"Dr. Anthony A. Romeo has spent his career in pursuit of excellence in the field of shoulder,elbow, and sports medicine surgery by pioneering new approaches and developing advancedorthopaedic implants and surgical procedures.Dr. Romeo completed his Bachelor of Science degree at the University of Notre Dame. Heearned his Medical Degree from the St. Louis University School of Medicine beforecompleting his orthopaedic surgery internship and residency at the Cleveland ClinicFoundation. Next, he pursued an Advanced Clinical Experience as a shoulder and elbowsurgery fellow at the University of Washington Medical Center in Seattle, guided by Dr.Frederick A Matsen III.With over 450 peer-reviewed publications to his name, Dr. Romeo actively contributes to thethought leadership, education, and innovation behind incredible treatment advances seenover the past three decades. Dr. Romeo serves as the Chief Medical Editor of OrthopedicsToday and the Director of Romeo Orthopaedics.\"\nd61bb738-8b3a-4a87-9756-9f6d342605f9,Michael,Sch\u00e4r,\nd69d5720-ccda-43c1-b063-4769eb78308e,Logan,Kolakowski,\nd73dfff1-aa92-48d0-be5b-006b09b17114,Jason,Hsu,\nd7946127-75ef-4d82-a73d-98f18cc8ab1c,Liam,Kane,\nd7f5057c-ab16-414b-a1b5-a5b679254247,Malte,Holschen,\nd80c67f0-1da1-4c40-a1b8-23012d52a0bb,Ian,Penvose,Orthopedic Chief (PGY-5) Resident at Brown University\nd8323e1c-57b1-4179-b247-d536e740dfdd,Teru,Mihata,\nd8467875-54d0-463c-9610-a7edc0c8bfd0,Luke,Austin,\nd862d2c3-f0ec-4a5e-9402-6ba70b6f5677,Ilija,Ban,\nd8baaba7-879f-463e-a0f1-b01e58b59028,Katelyn,Koschmeder,\nd93cd207-936b-4e00-b879-18f2c82cd209,Mark,A Mighell,\"Dr. Mighell is board certified by the American Board of Orthopaedic Surgery, and he serves his profession as a national board examiner. He specializes in the treatment of injuries and disorders of the shoulder and elbow, and, having been trained in an American Shoulder and Elbow Surgeons fellowship, he now trains three fellows each year. Additionally, Dr. Mighell treats patients using advanced surgical techniques including elbow arthroscopy, reverse total shoulder replacement, SWAT technique for shoulder arthroplasty, and shoulder reconstruction as well as robotically assisted arthroplasty.Prior to joining Florida Orthopaedic Institute in 2001, Dr. Mighell served on active duty in the Department of Orthopaedic Surgery at Portsmouth Naval Medical Center for seven years, and as Medical Director for the United States Navy during the previous four years receiving a Navy Commendation for duties performed. He is an active member of the American Orthopaedic Association, American Arthroscopy Association of North America, and the American Shoulder and Elbow Surgeons.Multi-lingual in English, Spanish, French, Russian, and German. Dr. Mighell has authored dozens of publications and has delivered numerous poster and oral presentations relating to his medical expertise.In his spare time, Dr. Mighell enjoys the outdoors, including boating, kayaking, and skiing with his family.\"\nd94b2023-d9d5-4656-a86b-71fbcb22f6d4,Kristin,Yu,Orthopedic surgery resident at the Mayo Clinic. Future shoulder & elbow fellow at Washington University in St. Louis (2027-2028).\nd98ff28a-a5c4-4424-b7c1-fbcb2366d22c,Hyun Gon,Kim,\nd9a26b04-2aa8-4ad9-b02a-4246d9ffd718,Andrew,Green,Dr Andrew Green is a Professor of Orthopaedic Surgery and Chief of the Division of Shoulder and Elbow Surgery in the Department of Orthopaedic Surgery at the Alpert Medical School of Brown University\ndae08449-30e2-472e-b111-e1a3d691ecae,Maurits,Olthof,\ndb1aef9d-cbea-49cc-9109-9befa23ae80c,Deborah,Higgs,\ndb3d8b5c-dffa-4906-90dc-1c5b5da2ff27,Sameer,Nagda,\"Dr. Sameer Nagda is a Shoulder and Elbow Surgeon at the Anderson Orthopaedic Clinic in Arlington, Virginia. He is the Chief of Shoulder and Elbow Surgery for the Inova Health System and a two-time recipient of the prestigious Charles Neer Award. In addition to his clinical practice, he is a former team physician for the United States Women\u2019s National Soccer Team and was part of the FIFA Women\u2019s World Cup Champion Team in 2019. He was also selected as a physician for Team USA for the Rio 2016 Summer Olympics and the Tokyo 2020 Summer Olympics. He also served as a physician for the Washington Nationals Baseball Club for 9 years. He is a founding member of the Mid-Atlantic Shoulder and Elbow Society and past president of the Indian American Shoulder and Elbow Surgeons.\"\ndb7b73fc-a78d-4e61-aa63-ae433794ac91,yoshihiro,hirakawa,\ndbebccd7-65f4-4de0-9d46-2331da3a72f6,Berte,B\u00f8e,\"Berte B\u00f8e, MD, PhD, is a Consultant Orthopaedic Surgeon with a special interest in complex shoulder and knee surgery. She is Head of the Arthroscopy Section at Oslo University Hospital. Dr. B\u00f8e earned her PhD in orthopaedics from the University of Oslo in 2012 and has since authored numerous scientific papers in clinical research, as well as several book chapters.She is a sought-after speaker and has been invited to present at both national and international meetings, contributing as a faculty member on topics related to both shoulder and knee surgery.Dr. B\u00f8e currently serves as the 1st Vice President of ESSKA and is the Past President of the Norwegian Society for Surgery of the Shoulder and the Elbow. She is an Associate Editor of JISAKOS and serves on the Editorial Boards of AJSM, KSSTA, the AJSM Electronic Media Board, The HIVE and the Video Journal of Sports Medicine. Additionally, she is an active member of three ISAKOS Committees and a committee member of SECEC.\"\ndd2e0fda-30c0-47a5-b5e0-276f85be79a1,Alessandro,Castagna,\"Full Professor Emeritus of Orthopaedics and Senior Consultant, Humanitas University and Research Hospital, Milan ItalyPast President SECEC (European Shoulder and Elbow Society)\"\ndd506475-23a5-4f35-bca5-602663c5b5f9,Lars,Frich,\"Lars Henrik Frich is a certified shoulder and elbow surgeon with 30 years of experience in shoulder and rotator cuff reconstruction. He leads a research group on shoulder reconstruction, established 10 years ago. He collaborates with strong biomedical teams, significantly enhancing his academic profile, and several important papers on rotator cuff regeneration and muscle recovery have been published or are currently in preparation\"\nddb9521c-4654-46ba-b53f-619793826f0b,Madeline,Wethington,\"Madeline Wethington is a second-year medical student at the University of Minnesota Medical School. Her work focuses on shoulder and elbow care, medical education, virtual reality simulation, and 3D visualization technologies for surgical and procedural training. She is actively involved in orthopedic research and serves as the Ruth Jackson Orthopaedic Society Representative for the University of Minnesota Orthopaedic Surgery Interest Group. Prior to medical school, she earned bachelor's and master's degrees from the University of Minnesota while competing as a Division I ice hockey player.\"\nddeb767e-7f90-4da4-858d-2a5820270728,Rick,Papandrea,\"Dr. Papandrea graduated from UW-Madison Medical School in 1992. His residency was completed at Mt. Sinai in Cleveland. He then went to Boston for a one year adult and pediatric hand/upper extremity fellowship at Harvard. Adult shoulder and elbow fellowship training followed at the Mayo Clinic. He is board certified in Orthopaedics, Hand Surgery, and Sports Medicine.He joined Orthopaedic Associates of WI in 1999. His elective practice has always been limited to the upper extremity, and now is only shoulder and elbow. He has remained passionate and invested in complex elbow intervention.Dr. Papandrea has been traveling to Ethiopia, to help the staff of Soddo Christian Hospital educate their residents since 2020.\"\nde2f34ca-6072-443c-b780-d307745ea710,Nicholas,Maassen,\nde3d9e3f-6ccf-4bfa-95fc-e3e425fbe329,Sujit,Jos,\"Dr. Sujit Jos is an Orthopaedic Surgeon specializing in complex primary and revision arthroscopic procedures of the shoulder and knee, as well as joint replacement surgery. He leads the postgraduate MS (Orthopaedics) training program and serves as Course Director for a one-year Fellowship in Arthroscopy and Sports Medicine, accredited by ISAKOS and the European Journal of Orthopaedic Surgery & Traumatology.He has authored multiple peer-reviewed publications and serves as a reviewer for several indexed journals, including the Journal of Clinical Orthopaedics and Traumatology, Indian Journal of Orthopaedics, and Knee Surgery Sports Traumatology Arthroscopy. He has presented extensively at both national and international conferences.Dr. Sujit delivered the prestigious KG Gopalakrishnan Memorial Oration at the Kerala Orthopaedic Association Annual Conference 2025 and is an AO (Switzerland) accredited trainer in orthopaedic trauma and sports surgery.He is recognized for several pioneering contributions:Among the first surgeons in India (4th overall) to perform arthroscopic Latarjet, and the first in South IndiaDeveloped and promoted a metal-free Latarjet techniqueFirst in Kerala to perform Regeneten collagen patch augmentation for rotator cuff repairFirst in Kerala to perform Direct Anterior Approach (DAA) total hip replacementIntroduced the arthroscopic subacromial balloon (InSpace) procedure in KeralaHis work focuses on advancing minimally invasive, biologic, and bone-preserving techniques, particularly in shoulder surgery.He is the Editor-in-Chief of the Coastland International Orthopaedic Journal, the official publication of the Cochin Orthopaedic Society.Professional LeadershipExecutive Committee Member, Shoulder and Elbow Society of India (2024\u201325)Vice President, Association of Arthroscopic Surgeons of Kerala (2025\u201326)Vice President, Shoulder and Elbow Society of Kerala (2024\u201325)Secretary, Association of Arthroscopic Surgeons of Kerala (2022\u201324)IT Secretary, Kerala Orthopaedic AssociationSecretary, Cochin Orthopaedic Society (2021\u201323)Treasurer, Cochin Orthopaedic Society (2019\u201321)President of Rotary Club of Cochin Global, which is one of the largest rotary clubs in the city of Kochi for the year 2024-25.\"\ndf05de2b-e66d-4b9b-83e3-496fd28074db,Leesa,Galatz,\"Dr. Galatz is the Mount Sinai Professor and Chair of the Leni and Peter May Department of Orthopedic Surgery at the Icahn School of Medicine and the Mount Sinai Hospital System in New York. She specializes in Shoulder and Elbow Surgery, with an interest in shoulder instability, rotator cuff disease, and shoulder arthroplasty. Her primary research interest throughout her career has been the basic science of rotator cuff disease and tendon healing as it pertains to cuff repair. She has been a Co-Primary Investigator on projects funded by the National Institute of Health which focus on rotator cuff degeneration and repair, and tissue engineering strategies for tendon repair. Her research is complemented with clinical projects with her colleagues on Shoulder and Elbow service and with the Department of Population Health and Epidemiology at Mount Sinai. She has served as a faculty member in numerous courses on a national and international level, lecturing on a variety of clinical topics pertaining to Shoulder and Elbow pathology. She was the recipient of the Neer award for Basic Science Research at the American Shoulder and Elbow Surgeons Open Meeting in 2009. She received the 2014 Kappa Delta Ann Doner Award along with her colleagues for research on the natural history of rotator cuff disease. In 2007, she was a European Shoulder and Elbow Traveling Fellow, sponsored by American Shoulder and Elbow Surgeons. She was an American British Canadian Traveling Fellow in 2009. She served on the Boards of the American Academy of Orthopedic Surgery, American Shoulder and Elbow Surgeons, American Orthopedic Association, Journal of Bone and Joint Surgery, and Orthopedic Research and Education Foundation.\"\ndf2c7c32-c49b-409d-82f6-0ad88eee9549,Kenta,Takatsuji,\ndf5737ed-646a-46ea-9c48-139892fd3e85,Nadhaporn,Saengpetch,Sports medicine surgeon and Thailand team physician\ndf9a6c94-4fc1-4d4d-9798-8666767971d7,Lindsay,Schuster,\"Lindsay Schuster is an orthopedic research assistant at Hospital for Special Surgery working in the Shoulder Service under Lawrence V. Gulotta. She completed her post-baccalaureate premedical studies at Johns Hopkins and plans to pursue a career in medicine with a strong interest in orthopedic surgery. As a former Division I athlete, her experiences in athletics and sports-related injury recovery helped spark her interest in orthopedics and musculoskeletal research.\"\ndfec8153-9902-4fa8-b7a6-8d6ad721805f,Noemi,Zaffaroni,\"Noemi Zaffaroni is an orthopedic surgeon with a strong focus on shoulder arthroscopy and arthroplasty. She earned her medical degree from the University of Milan in 2018 and subsequently pursued orthopaedic training at the University of Trieste, Italy. Driven to refine her expertise in shoulder pathology and surgery, she undertook a fellowship in 2025 under the mentorship of Prof. Kenneth Cutbush and Prof. Ashish Gupta in 2025, followed by a second fellowship with Prof. Gupta, with a particular emphasis on innovation and the treatment of complex shoulder cases.\"\ne02715ec-b0e3-4e06-abee-ebef27130bd4,Jay,Levin,\ne07e5130-8034-48bc-adc8-a4f6628c922b,Cristina,Delgado,\ne0c4205e-deca-436d-9dce-19ec1804e763,Howard,Routman,\"Director, Palm Beach Shoulder Service at Atlantis Orthopedics - Palm Beach County, FLAssociate Professor, Orthopedic Surgery. Nova-Southeastern UniversityProgram Director, HCA/JFK University of Miami Consortium Orthopedic Surgery ResidencyDivision Chairman, Orthopedic Surgery HCA/JFK and HCA/JFK North Hospitals\"\ne0e6b806-d550-4ada-aa40-7f05a0075ac7,Moritz,Klarer,\"Moritz Klarer is a medical doctor, pursuing a clinical PhD at the Paracelsus Medical University Salzburg in Austria. Part of his research on bone and soft tissue properties in cuff tear arthropathy has been carried out during two research stays at and in collaborations with Roth|McFarlane Hand and Upper Limb Centre (HULC), University of Western Ontario as well as the Orthopaedic Technologies & Biomechanics Lab at the University of Victoria.\"\ne1ca63b6-0acb-4c77-a5e5-b17e42e9a4ed,Jason,Corban,\"Dr. Jason Corban is an orthopaedic surgeon specializing in upper extremity pathology and orthopaedic sports medicine who holds an academic appointment as Assistant Professor at McGill University. He completed his bachelor\u2019s degree at the University of Toronto before going on to McGill University for medical school and residency training in orthopaedic surgery. Following residency, he went on to complete two fellowships, one in orthopaedic sports medicine at the University of Southern California and the second in shoulder and elbow surgery at the New England Baptist Hospital in Boston. Dr Corban has a variety clinical and research interests that span from the use of novel technologies for injury prevention to the applications of biologics in soft tissue healing. His research is focussed primarily on the application of automated kinematic assessment for injury prediction and for assessing post-operative outcomes. He also currently serves as a team orthopaedic surgeon for the Montreal Alouettes CFL team.\"\ne1d8c050-1301-4e7b-bcbc-8d29499028a6,Carmen,Castroviejo,\"Orthopaedic surgeon and researcher based in Switzerland, currently specializing in paediatric orthopaedics at the University Children's Hospital Zurich. My academic work focuses on clinical and biomechanical research, with particular interests in musculoskeletal modelling, gait analysis, and improving outcomes in orthopaedic surgery. Alongside my clinical and scientific activities, I am passionate about climbing, sailing, and mountain sports.\"\ne22210b0-d582-4e33-862b-fc01ecacf65c,Stephen,Bale,\ne3249b3a-410d-4a4f-a245-26d74822758c,Ivan,Wong,\"Dr. Ivan Wong, MD, FRCSC, MAcM, Dip. Sport Medicine, FAANA, is a Professor of Orthopaedic Surgery at Dalhousie University, where he also Co-Directs the The Joint Preservation, Sports Medicine and Arthroscopy Fellowship Program. Originally from Prince Edward Island, Canada, he earned his medical degree from Dalhousie University He completed his Orthopaedic Surgery residency at McMaster University, followed by fellowship training in Sports Medicine and Trauma at the Southern California Orthopaedic Institute in Los Angeles. He also holds a Master\u2019s degree in Academic Medicine from the University of Southern California.Dr. Wong is a past President of the Arthroscopy Association of Canada (AAC) and currently serves on the Editorial Boards of the American Journal of Sports Medicine (AJSM) and Arthroscopy, the Journal of Arthroscopic and Related Surgery. He is a Professor of Orthopaedic Surgery, Biomedical Engineering, Continuing Professional Development and Medical Education, and Health and Human Performance at Dalhousie University, where he also Co-Directs the Joint Preservation, Sports Medicine, and Arthroscopic Reconstruction Fellowship Program. In addition, he serves as an Associate Editor for the Orthopaedic Journal of Sports Medicine (OJSM).Dr. Wong specializes in hip and shoulder arthroscopy, with expertise in advanced arthroscopic reconstructions for large rotator cuff tears and arthroscopic anatomic glenoid reconstruction (AAGR) techniques. His clinical and academic focus is centered on innovation, developing less invasive procedures that reduce pain, minimize incisions, and shorten recovery times. Dedicated to advancing his field, Dr. Wong has helped to train many medical students, residents, and fellows in sports medicine, as well as orthopaedic surgeons in sports medicine and arthroscopic procedures around the world.Dr. Wong has published over 200 peer-reviewed papers and has presented hisresearch outcomes and surgical techniques at over 350 conferences, webinars andcourses around the world during the past decade.\"\ne393f758-3a13-4335-a252-565dd2354a21,Hirohisa,Uehara,\ne61a8428-169e-48a2-b46f-3b9eabb015c3,William,Levine,Dr. Levine is the Frank E. Stinchfield Professor and Chair of Orthopedic Surgery at NYP/Columbia University Medical Center\ne63bc7f3-643e-4ae2-9e03-e4b3ed43078f,DANIEL,DE TOLEDO,\u2022 Master of Science from the University of S\u00e3o Paulo (USP)\u2022 Shoulder and Elbow Surgery: Orthopedic Hospital of Belo Horizonte\u2022 Orthopedics and Traumatology: Base Hospital of the Federal District\u2022 Medicine: Higher School of Health Sciences of the Federal District\ne6611be3-32df-4be4-aa69-a7d8eede15cc,Jun-Hyuk,LIM,\ne700fb8b-8016-4e11-8f53-dd3617525e6a,Aman,Chopra,\ne83c4437-7826-430d-a8cb-2d67f46045aa,Ryan,Lohre,\ne88307d6-2966-4cc0-835a-009fcb031d2e,Jason,Ho,\"Staff Shoulder & Elbow Surgeon - Cleveland Clinic, Assistant Professor of Orthopedic Surgery - Cleveland Clinic Lerner College of Medicine of Case Western Reserve University, specializing in primary and revision shoulder and elbow surgery\"\ne8a29cdc-63a1-4423-95b3-c6d7c3b529ab,Aofei,Gao,\ne8ab700b-d013-4a1d-a7be-4810521f2889,Stefan,Greiner,Head of Shoulder and Elbow Sporthopaedicum Regenburg\ne8ecf76c-a41d-4ebf-a913-936d3524ff0a,Jeffery,HUGHES,35 years in elbow and shoulder reconstruction / arthroplasty / arthroscopy. Co-designer Elbow Arthroplasty. Member of GEN. Past President of Shoulder and Elbow Society of Australia\ne9155901-8cc5-4a23-991d-13906e0bb8a0,Jake,Checketts,Shoulder and Elbow Surgeon and Faculty at Oklahoma State University\ne965ead0-5035-4d8f-9cac-40a939ca6e43,Robert,Chan,\"Associate Clinical Professor, University of Alberta. MD, MSc, FRCSC from University of Calgary. Fellowship at HULC, University of Western Ontario. Clinical and Academic interest - Elbow to hand. Educational interest - past Clerkship Director, Residency Program Director, current Competence Committee Chair U of A Orthopaedic Residency Program.\"\ne9c0ffdc-ff1b-4f43-8967-a7cb331b67fc,Dominique,Rouleau,\"Dr. Dominique Rouleau is an orthopedic surgeon specializing in upper limb surgery. A graduate of the \u00c9douard-Samson program at the Universit\u00e9 de Montr\u00e9al in 2006, she also holds a master\u2019s degree in biomedical sciences (biostatistics). She completed two clinical fellowships and two visiting fellowships in Europe. Dr. Rouleau is a member of both the American and European Shoulder and Elbow Societies and serves as Chairman of the Canadian Shoulder and Elbow society (CSES). A recipient of several research grants, her most recent randomized study was awarded the prestigious Robin Richards Canadian Research Award.Since late 2024, Chairholder of the Research Chair in Orthopedics of Universit\u00e9 de Montr\u00e9al. Focusing on chronic post-fracture pain and the underlying mechanisms of fracture non-union. Associate Professor in the Department of Surgery and a Researcher at the H\u00f4pital du Sacr\u00e9-C\u0153ur de Montr\u00e9al.\"\ne9d522fa-116f-4ca7-ba76-b4a33573ea5a,Przemys\u0142aw,Lubiatowski,\ne9fe7587-71ed-4752-9526-4b7e5764ddc9,Sambit,Sahoo,\nea298fb3-7e7a-4971-a759-66c7d3c08fc8,Evan,Lederman,\"Evan S Lederman, MD is the Chief of Sports Medicine for Banner Health and Clinical Professor of Orthopedic Surgery at the University of Arizona College of Medicine-Phoenix (UACOMP). He is the program director UACOMP Orthopedic Sports Medicine Fellowship and faculty of the Orthopedic Residency. Dr Lederman is the Head Team Physician for the Phoenix Suns and Arizona based physician for the Milwaukee Brewers.\"\nea6bd849-2a48-4633-a4fe-88b106922579,Maciej,Simon,\neadf212c-ccf5-41e2-93a2-90aa981861e6,Alan,Reynolds,\"Alan Reynolds is a shoulder, elbow and sports medicine surgeon in Greensboro, NC; and an assistant professor at the Wake Forest University School of Medicine.\"\neaf3a05e-5fdd-405c-8c9b-b0f15a37d9a4,Olivier,Bozon,\"Olivier Bozon, MD, MSc, is a French orthopedic surgeon specialized in upper limb surgery, with a particular focus on shoulder and elbow disorders. He previously worked at the University Hospital of Montpellier, France, and is currently a clinical fellow in upper extremity surgery at the CIUSSS du Nord-de-l\u2019\u00cele-de-Montr\u00e9al, working in the service of Dr. Dominique Rouleau. His clinical and research interests include traumatic and degenerative conditions of the shoulder and elbow, arthroscopic techniques, and reconstructive surgery, with active involvement in clinical research and scientific publications.\"\neb51b879-e366-43f7-aba4-dec13eea8587,Andrew,McBride,\nebd4860f-cc33-4c24-b02c-abd16ec38862,Carmen,Brauer,\nec4b0d38-12d6-441c-83be-f7fb90e98558,Sarav,Shah,\"Dr. Shah is a double board-certified Orthopaedic Surgeon who has led in many capacities at New England Baptist Hospital in Boston, MA USA. He currently serves as chief of the division of Sports Medicine and Program director of the NEBH Sports Medicine Fellowship. He has helped strengthen its position as a premier fellowship in the field. Additionally, he assisted in forming the ASES accredited Shoulder/Elbow fellowship for which he also serves as co-fellowship director. In his time at NEBH, he has helped the service to make advancements in multidisciplinary clinical care, research and innovation, education, and medical staff development.Dr. Shah graduated from Drexel University College of Medicine in Philadelphia, PA USA. He completed his orthopedic surgery residency at Hofstra Northwell School of Medicine in New Hyde Park, NY USA. He completed his orthopedic sports medicine fellowship at New England Baptist Hospital, and a second fellowship in shoulder/elbow arthroscopic and reconstructive surgery at Hospital for Special Surgery in New York, NY USA.A recipient of multiple national honors for excellence in research and teaching, Dr. Shah has authored more than 50 scientific peer-reviewed publications, chapters, review articles and books and has received numerous research and educational grants. He also serves on the editorial board for one of the top sports medicine journals while holding leadership roles at the national sports medicine society level. Dr. Shah\u2019s goals include researching novel surgical techniques, exploring racial disparities and how they relate to surgical outcomes, and levering relationships with professional and college athletes to build a sports program that can impact entire communities.\"\ned037f3a-d06e-424a-8054-70232722cfca,Seung Min,Bang,\ned88631b-70dd-45fc-aa41-a8655c985005,Felix,Savoie,\"Dr. Felix \u201cBuddy\u201d Savoie III is the Ray J. Haddad Professor and Chair of the Department of Orthopaedics at Tulane University School of Medicine. He earned his Doctor of Medicine from Louisiana State University before completing his residency at the University of Mississippi Medical Center. Further refining his expertise, Dr. Savoie pursued an AO Fellowship in Basel, Switzerland, followed by a Hand and Microvascular Fellowship at the Medical College of Wisconsin and the Mayo Clinic in Rochester and an Arthroscopy Fellowship with Orthopaedic Research of Virginia with Drs. Casper, Whipple and Meyer. Dr. Savoie also completed a shoulder fellowship with Dr. Richard Hawkins in London, Ontario. His research focuses on cartilage restoration, shoulder and elbow reconstructive biology and Arthroscopy.An internationally recognized leader in shoulder and elbow surgery as well as sports medicine, Dr. Savoie has made significant contributions to the field through his clinical expertise, research, and leadership. Over the years, he has held numerous leadership roles, serving as President of the American Academy of Orthopaedic Surgeons (2023), the Arthroscopy Association of North America (2010), the American Shoulder and Elbow Surgeons (2016), and the Louisiana Orthopaedic Association (2016).\"\nee04ce32-2e33-45b1-ae07-0c4b0596e309,Alexandra,Ross,\"Lexie Ross is currently a resident surgeon in the Department of Orthopaedic Surgery at Stanford University. Having played varsity water polo at Stanford as an undergraduate student, Lexie developed a keen interest in orthopaedic sports medicine and shoulder surgery early on in her education. She completed her medical education at the University of Colorado School of Medicine, and is grateful to have continual opportunities to learn from the experts in the sports and S&E fields.\"\neee059bf-72df-4245-83c0-c5275414c57a,Anna,Thomson,\"I am a specialist shoulder physiotherapist at Queensland Orthopaedic Clinic, working closely with Professor Ashish Gupta.I am currently undertaking a PhD in shoulder biomechanics at Queensland University of Technology (QUT), with a research focus on pre- and post-operative shoulder kinematics and muscle function in patients undergoing reverse shoulder arthroplasty.I also collaborate with the Queensland Unit of Advanced Shoulder Research (QUASR) at QUT.\"\neefe2f07-a4bd-4328-aca0-2aec75d2948c,Tej,Joshi,\nef3b85a3-e186-4bef-aa9d-4e4b2360836c,Zaamin,Hussain,Zaamin Hussain is a shoulder and elbow surgeon at the University of Florida. He specializes in the treatment of complex shoulder pathology. His research interests are materials and biomechanics of shoulder arthroplasty.\nefe85a05-0bcf-4756-abf1-960ffb2f0f77,Eun-Ji,Yoon,\nf06a1b67-2435-466d-88c1-e53d3e4520f1,Jakob,Schanda,\"Jakob E. Schanda, MD PhD is an orthopedic and trauma surgeon, mainly focussing on shoulder surgery. His primary field of research consists in rotator cuff repair and biological augmentation techniques.\"\nf0b7c402-34ad-48e8-b08c-1b89014f4eb3,Mark,Ross,\"Immediate Past President of the Australian Hand Surgery Society and Immediate Past President of the Shoulder and Elbow Society of Australia, Mark Ross is a Professor of Orthopaedic Surgery at the University of Queensland. Currently he is the Chair of the Scientific Committee of the International Wrist Arthroscopy Society ( IWAS). He is the Director of the Upper Limb Fellowship Programme at Princess Alexandra Hospital, and a founder and co-director of the Brisbane Hand and Upper Limb Research Institute. He has a special interest in distal radius fractures, carpal instability, complex reconstructive and revision surgery, and is actively involved in the development of new surgical techniques and new joint replacement technologies, and advocating for specialist staff in the public hospital.Professor Ross graduated from The University of Queensland with MBBS in 1987. He completed his FRACS in Orthopaedic Surgery in 1996 and undertook a fellowship in Hand and Upper Limb Surgery at the Princess Alexandra Hospital in 1997, before travelling to the USA to undertake a 12-month Fellowship at the Kleinert Institute for Hand and Microsurgery in Louisville, Kentucky.\"\nf19abd1f-ef80-4726-a857-dcfe99917a36,Margo,Dirckx,\"I originally trained as an orthopaedic surgeon in Antwerp, Belgium. I've completed fellowships in London and Brighton, and in 2019 permanently moved to the UK.I am currently a consultant in Barnsley Hospital since 2022.I have a special interest in complex elbow trauma, next to a busy shoulder & elbow practice.\"\nf30b24ef-d4d1-43c7-b4bf-99b8efeb342b,Thomas,Ibounig,\"Dr. Thomas Ibounig was born in Austria on June 9, 1979, and completed his medical degree at the Medical University of Graz. During his studies, he pursued international clinical fellowships in Tampere (Finland), Vancouver (Canada), Porto Alegre (Brazil), and New Orleans (USA), while also working as a certified tennis teacher and ski instructor.After graduating in 2005, Dr. Ibounig moved to Finland, where he specialized in Orthopaedics and Traumatology at Helsinki University Hospital (HUS). He went on to join the hospital's Shoulder and Elbow Surgery division. His PhD research, carried out as a researcher at the Finnish Centre for Evidence-Based Orthopaedics (FICEBO), focuses on shoulder imaging abnormalities and their association with symptoms.Dr. Ibounig serves as the Secretary of the Finnish Society for Shoulder and Elbow Surgery (since 2019) and works as a team physician for the Finnish National Ice Hockey Teams (U16\u2013U18).\"\nf319f436-b68d-4a81-89c5-81864e7feeb0,Cristobal,Maccioni,\nf339e6c4-b6c0-4f63-83f4-3580cbbbb2ce,Paul,Roache,\"Arthroscopic Shoulder Surgeon specializing in ARCR and Mihata SCR with Fascia Lata autograft. Founding Board member and executive director of the non-profit for the International SCR Association ( ISCRA) , Director ISCRA USA Regional Program.\"\nf35847b0-ed33-47ff-ac0c-369edc871bb1,Deana,Mercer,\nf361ed8d-bcf9-4141-9309-734f03255d35,Kathleen,Leinweber,\"Kathleen Ann Leinweber, MD, MA, is an Assistant Professor of Orthopaedic Surgery at Geisinger Commonwealth School of Medicine and faculty at the Geisinger Musculoskeletal Institute specializing in orthopaedic reconstructive shoulder and elbow surgery, including shoulder arthroplasty, revision shoulder arthroplasty, shoulder fractures and sports injuries, rotator cuff and tendon injuries, elbow injuries, fractures and arthritis. Dr. Kathleen Leinweber attended Northwestern University, where she studied molecular biology, genetics and global health. She earned a Master of Biomedical Sciences from Loyola University Chicago and her medical degree from the Geisel School of Medicine at Dartmouth. She completed her orthopaedic surgery residency at Dartmouth-Hitchcock Medical Center in New Hampshire and has specialized fellowship training in Shoulder and Elbow Surgery from New England Baptist Hospital in Boston, Mass.Dr. Leinweber has a strong commitment and interest in clinical research, resident education, leadership, innovation and advocacy, with specific interests in complex shoulder arthroplasty, revision arthroplasty, upper extremity trauma and reconstruction.\"\nf3a99ed6-bd81-42dd-8f6b-fb48c0a4b250,M\u00e1rcio,Schiefer,Adjunct Professor of Orthopedics at Federal University of Rio de Janeiro. Shoulder Surgeon at Brazilian National Institute of Trauma and Orthopedics.\nf46808dc-113b-4436-a1fe-445ee1e3939d,Hiroko,Ueki,\nf4a65d4b-794f-4994-95ff-626bcd1a101c,Kyle,Snethen,\nf53adaa4-e2a6-458c-9691-212ee0b645e0,Patric,Raiss,\nf551495f-2414-49a9-85bd-042c740bd5d3,Lu\u00eds,Gomez-Vieira,\nf570fbcf-710d-4885-ad3f-897c74bdf417,Charles,Jobin,\nf57ed162-6da2-4eb4-9714-1caa37aa632e,Changmin,Song,\nf5ce8245-3796-467f-8ab9-354624f7f69b,Giuseppe,Bardellini,\nf5da8c99-c731-4eb6-88d3-57e64a702224,Filip,Cosic,\"Conference BioDr Filip Cosic is a fellowship-trained upper limb surgeon, having completed his fellowship at the Institut de la Main et de l'\u00c9paule (Paris Hand and Shoulder Institute).He holds a public position at the Austin Hospital in Melbourne where he has a role as an AOA21 Training Supervisor. He has a PhD in Surgery from Monash University, with research focused on the operative and non-operative management of proximal humerus fractures. He is an Adjunct Senior Research Fellow with the School of Public Health and Preventive Medicine at Monash University and a Chief Investigator with the Victorian Orthopaedic Trauma Outcome Registry.\"\nf5e70d80-ede0-414a-b86e-69b3db48a833,Trevor,Simcox,\"Trevor Simcox, MD, is an orthopedic surgeon specializing in shoulder and elbow surgery at Stony Brook University Hospital on Long Island, New York.He completed his residency training at the NYU Long Island School of Medicine, followed by a shoulder and elbow fellowship at the University of Florida. After practicing in Houston, Texas for two years, he returned to Long Island to join the faculty at Stony Brook.\"\nf5f6efe2-2c19-4eec-9642-849d60d2f751,Naser,AlNusif,\nf6ff3790-36af-4e64-810c-706d6146b89e,Olivier,Verborgt,Prof. Olivier Verborgt is a shoulder surgeon at the Orthopedic Center Antwerp (Orthoca) in AZ Monica in Antwerp. He is a consultant at the department of Orthopaedic Surgery and Traumatology of the University Hospital Antwerp and visiting professor at the faculty of Medicine and Health Sciences of the University of Antwerp. He is the former president of the Belgian Association for Orthopedics and Traumatology (BVOT) and current president of the Belgian Shoulder and Elow Surgery Society. He is a board member of the executive committee of the European Society of Shoulder and Elbow Surgery (SECEC) and a member of the American Shoulder and Elbow Society (ASES) and is active in clinical and basic research on shoulder pathology and actively involved in the treatment of shoulder pathology of elite athletes.More information and contact details via www.orthoca.be\nf712780c-f0ec-4362-bf27-33e0e8f312b1,Shota,Hoshika,\nf718111a-1ce1-40ab-a6bc-855074f04633,Antonio,Arenas-Miquelez,\nf78612ed-e0ab-457b-9e72-55d78e8dd987,Anand,Murthi,\nf7a3f0bb-b170-4f31-8048-b909a8e1e73c,Kazuhiko,Kikugawa,\nf83dd84c-2233-4570-8b2b-9938cba64a65,Eric Changbean,Kang,\"Eric Changbean Kang is a medical student and software developer with a strong background in Python, C++, and applied artificial intelligence. He has worked with Google on TensorFlow and has experience developing machine learning tools for medical research and clinical innovation.His interests focus on applying AI and software engineering to orthopaedic research, particularly in medical imaging, surgical planning, and outcome prediction in shoulder and elbow surgery.\"\nf892e3b9-dab1-42f4-815a-50c377190538,Kotaro,Yamakado,\"1994-1995: Residency at Kanazawa university hospital, Japan.1998-1999: Research at Kanazawa University Hospital, Japan as a post-graduate studentTeaching assistant at School of Medicine, Kanazawa University2002-2003: International clinical fellow, Joint Replacement Center, Advanced Medical Centers, Richmond, VA, USA2005: Consultant Orthopaedic surgeon, Fukui General Hospital2012: Chief Consultant Orthopaedic surgeon (orthopedics/sports medicine), Fukui General HospitalPosition in academic activities.Board of director of the Japanese Shoulder Society (2024-)Former Chairman of the RSA Operations Committee (The Japanese Shoulder Society)AwardsJapanese sports med assoc: Excellent paper award (2002)Japan-Korea shoulder elbow society exchange traveling fellow (Japanese Shoulder Society) (2015)Aoe Award (Aoe society for the shoulder, Okayama, Japan) (2016)United States of America traveling fellow (Japanese Shoulder Society) (2016)Richard J. O\u2019Connor Research award (AANA: Arthroscopy Association of North America) (2018)WEB encouraging award (MIOS, Minimally Invasive Orthopaedic Surgery Society)(2020)Japan-SECEC exchange traveling fellow (2024)M.D., 1994: School of Medicine, Kanazawa University, Kanazawa, Japan.Ph.D., 2002: School of Medicine, Kanazawa University, Kanazawa, Japan.\"\nf8a23bd9-a6ad-42ee-85f7-db14d59f35f3,Valeria,Vismara,\"Orthopedic Surgeon, graduated at University of Milan. Currently Shoulder and Elbow fellow at HULC, Canada.\"\nf8d96b59-0dd1-4f65-b3ed-6c83550c5367,Mandeep,Virk,\nf985c1d5-2fde-444b-b414-bcf6b7127a3d,Peter,Chalmers,\nf98fff53-a903-4727-8ceb-85eb141c9740,Philippe,Valenti,Shoulder surgeon Orthopedist President Institut Hand and Shoulder Member ASES SECEC post President AOT SOFECMicrosurgeon (Nerves around shoulder)\nf9b2d5c2-8ce7-4c01-b61f-f867f4894fa3,Yoshiyasu,Uchiyama,\nf9c9a1ea-d327-4e86-ba49-4bc195ac9a33,Nicolas,Bonnevialle,\nfa5f4ac1-7940-406c-b0c5-7055cdc820cb,Christopher,Schmidt,\nfaa843be-4b72-4627-88a6-20491d5bd165,SEOW HUI,TEO,\nfbc9ecb2-0d5e-4b38-b999-665b3e892c25,Jia,Guo,\nfbd7dd74-d89a-43b0-ae38-73a48d99cca6,Max,Ekdahl,\"Program Director for Orthopedics and Traumatology Residency Program at Universidad de los Andes, Dr. Ekdahl is a leading shoulder and elbow surgeon in Latin America. With advanced training in sports medicine and shoulder and elbow surgery, he specializes in complex elbow reconstruction, ligament repair, and fracture management. A former President of the Chilean Society of Sports Medicine and active member of ASES, SCHOT and SLARD, his research in biomechanics and joint preservation is published in top-tier journals worldwide. He is also co-founder of the Global Elbow Network (GEN)\"\nfd4f2256-0231-40c6-8948-02a42296e7be,Patrick,Carroll,\nfd5c51e7-d9ff-47fc-9b90-1db2f3ddd019,Kenta,Sato,\nfdbc294b-95b6-4008-aa18-88b92bd9754a,Raffy,Mirzayan,\"Dr. Raffy Mirzayan is a double board-certified orthopedic sports medicine surgeon with over 25 years of experience specializing in shoulder, elbow, and knee surgery. He practices at DOCS Health in Los Angeles and serves as a Clinical Professor of Orthopedic Surgery at the Keck School of Medicine of USC. Dr. Mirzayan completed his sports medicine fellowship at the prestigious Kerlan-Jobe Orthopaedic Clinic. He is internationally recognized as an innovator in shoulder surgery and joint preservation, best known as the inventor of Biologic Tuberoplasty\u2122 for massive, irreparable rotator cuff tears. He is co-founder of Shoulder360\u2122, one of the largest shoulder courses in the United States, and a dedicated educator who has trained over 100 orthopedic residents. Dr. Mirzayan is the editor of three orthopedic textbooks and has authored more than 150 publications and book chapters, delivering over 200 lectures and presentations worldwide as an international lecturer.\"\nfdd291e7-e0d2-4eaa-8a08-fc100cf656e0,Mara,Warnhoff,\nfdda4d1e-0617-47a8-b50c-907b17c589e3,Craig,Ball,\"Dr. Craig Ball is an Orthopaedic Shoulder and Elbow Surgeon with 25 years of post-fellowship experience in all aspects of arthroscopic and joint reconstructive surgery of the shoulder and elbow. Having completed his Orthopaedic training in New Zealand, he then undertook subspecialty shoulder and elbow fellowship training in Australia and the USA. He was the pioneer of arthroscopic shoulder rotator cuff and instability repair techniques in New Zealand and has continued to be at the forefront of new techniques in the management of these conditions. He was one of the first surgeons to undertake reverse TSA in New Zealand over 20 years ago and has a particular interest in the role of enabling technology in TSA. He is continually involved in research and education both at a national and international level. He is a Past-President of the NZ Shoulder and Elbow Society and is the current Australasian representative on the International Board of Shoulder and Elbow Surgery. He is also a Board member of the Asean Shoulder and Elbow Association. His current practice is based at Auckland Bone and Joint Surgery at Allevia Ascot Hospital in Auckland, New Zealand.\"\nfe02db4e-4995-4b17-8205-7a92d1d8d166,Jung-Taek,Hwang,\"I am a specialist in shoulder and elbow surgery, and arthroscopy. Also, I am interested in biomechanical study and regenerative medicine.\"\nfe2d3c31-34d1-486d-bac7-3b3ff0400493,Kenneth,Cutbush,\"I am an accomplished orthopaedic shoulder surgeon based in Brisbane, Australia, known for my extensive expertise in shoulder joint replacement, instability, and rotator cuff surgery. I am a past Scientific Secretary of the Australian Orthopaedic Association, and current Chairman of the AOA Fellowships Committee. I am the Chief Supervisor of the Brisbane Shoulder Fellowship with 3 AOA accredited shoulder fellowship positions, allowing me to further my passion for mentoring the next generation of shoulder surgeons. I am an Associate Professor at the University of Queensland and Adjunct Professor at the Queensland University of Technology. My commitment to advancing shoulder surgery is further demonstrated through my research involvement, including in the ARC Industrial Transformation Training Centre for Joint Biomechanics, I collaborate on innovative research to improve treatments for osteoarthritis and other joint-related disorders.\"\nfeaf0aac-4768-4562-aa39-f5dcc92d4e84,JUN HYUK,LIM,\nfeb18f02-38f2-48aa-9c5a-c93e42b06646,Minoo,Patel,\"Orthopaedic Surgeon, Epworth and Cabrini Health, Melbourne; Adj Prof RMIT University; Sr Lecturer Monash University; Hon Research Fellow University of Melbourne; Secretary & President-Elect, AOTS, Australian Orthopaedic Trauma Society; past Chair, AOA (Aust Orthop Assoc) Research Foundation, Member SESA Shoulder and Elbow Society of Australia; past Chair Cabrini Dept of Orthopaedics; past Assistant Editor, Indian Journal of Orthopaedics; past Associate Editor, Journal of Limb Lengthening and Reconstruction.\"\nfec42d68-80ec-4773-a1e4-2d772c9b43e7,Andreas,Kontaxis,\nfecbf062-bb54-492a-9638-4ccaf6d8c27d,Felipe,Reinares,\"Shoulder and Elbow SurgeonOrthopedic and Trauma SurgeonSecond Vice President, Latin American Shoulder and Elbow Society (SLAHOC)Founding Member, Global Elbow Network (GEN)Past President, Chilean Shoulder and Elbow SocietyHead of the Shoulder and Elbow Unit, Mutual de Seguridad CChC, Santiago, ChileStaff Surgeon, Shoulder and Elbow Unit, Cl\u00ednica Alemana de Santiago, Chile\"\nff97d38f-e7b0-4fbf-b2f0-dd63cdaad20e,Ryan,McNassor,\nffdcb6af-0 /* RFC 4180 CSV parser: quoted commas, escaped quotes, multiline fields, Unicode. */
(function (global) {
  function parseCSV(text) {
    if (text == null) return [];
    if (text.charCodeAt(0) === 0xfeff) text = text.slice(1);

    const rows = [];
    let row = [];
    let field = "";
    let i = 0;
    let inQuotes = false;

    while (i < text.length) {
      const c = text[i];
      if (inQuotes) {
        if (c === '"') {
          if (text[i + 1] === '"') {
            field += '"';
            i += 2;
            continue;
          }
          inQuotes = false;
          i += 1;
          continue;
        }
        field += c;
        i += 1;
        continue;
      }

      if (c === '"') {
        inQuotes = true;
        i += 1;
        continue;
      }
      if (c === ",") {
        row.push(field);
        field = "";
        i += 1;
        continue;
      }
      if (c === "\n" || c === "\r") {
        if (c === "\r" && text[i + 1] === "\n") i += 1;
        row.push(field);
        rows.push(row);
        row = [];
        field = "";
        i += 1;
        continue;
      }
      field += c;
      i += 1;
    }

    if (field.length || row.length) {
      row.push(field);
      rows.push(row);
    }

    if (!rows.length) return [];

    const headers = rows[0].map(function (h) {
      return String(h || "").trim();
    });
    global.ICSESCsv.lastHeaders = headers.slice();

    const objects = [];
    for (let r = 1; r < rows.length; r += 1) {
      const cells = rows[r];
      if (!cells.some(function (cell) { return String(cell || "").trim(); })) continue;
      const obj = {};
      for (let c = 0; c < headers.length; c += 1) {
        if (!headers[c]) continue;
        obj[headers[c]] = cells[c] != null ? cells[c] : "";
      }
      objects.push(obj);
    }
    return objects;
  }

  global.ICSESCsv = { parse: parseCSV, lastHeaders: [] };
})(window);

  function esc(value) {
    return String(value == null ? "" : value).replace(/[&<>"']/g, function (ch) {

  function highlight(value, query) {

    if (!query) return esc(text);
    var terms = query.trim().split(/\s+/).filter(function (t) { return t.length > 1; });
    if (!terms.length) return esc(text);
    var re = new RegExp("(" + terms.map(escapeRe).join("|") + ")", "gi");
    var out = "";
    var last = 0;
    var match;
    while ((match = re.exec(text))) {
      out += esc(text.slice(last, match.index));
      out += '<mark class="mark">' + esc(match[0]) + "</mark>";
      last = match.index + match[0].length;
      if (match.index === re.lastIndex) re.lastIndex += 1;
    }
    out += esc(text.slice(last));
    return out;

    if (ap === "AM") {

    return {

    var leftover = [];
    unnumbered.forEach(function (group) {
      var title = normalizeTitle(group.title);
      var match = null;
      var best = 9999;
      numbered.forEach(function (candidate) {
        if (normalizeTitle(candidate.title) !== title) return;
        var distance = Math.abs((candidate.startMinutes || 0) - (group.startMinutes || 0));
        if (!match || distance < best) {
          match = candidate;
          best = distance;
        }

      if (match && best <= 30) mergeGroups(match, group);
      else leftover.push(group);
    });

  function copyClean(node) {
    if (node.nodeType === Node.TEXT_NODE) return document.createTextNode(node.nodeValue);
    if (node.nodeType !== Node.ELEMENT_NODE) return null;
    if (!ALLOWED_TAGS[node.tagName]) {
      var fragment = document.createDocumentFragment();
      Array.prototype.forEach.call(node.childNodes, function (child) {
        var cleaned = copyClean(child);
        if (cleaned) fragment.appendChild(cleaned);
      });
      return fragment;
    }

    var el = document.createElement(node.tagName.toLowerCase());
    if (node.tagName === "IMG") {
      var src = node.getAttribute("src") || "";
      if (!isSafeImgSrc(src)) return null;
      el.setAttribute("src", src);
      el.setAttribute("alt", node.getAttribute("alt") || "Abstract figure");
      el.setAttribute("loading", "lazy");
      var caption = node.getAttribute("title") || node.getAttribute("data-caption");
      if (caption) el.setAttribute("title", caption);
    } else if (node.tagName === "A") {
      var href = node.getAttribute("href") || "";
      if (/^https?:/i.test(href)) {
        el.setAttribute("href", href);
        el.setAttribute("rel", "noopener noreferrer");
        el.setAttribute("target", "_blank");
      }
    } else if (node.tagName === "TD" || node.tagName === "TH") {
      var colspan = node.getAttribute("colspan");
      var rowspan = node.getAttribute("rowspan");
      if (colspan) el.setAttribute("colspan", colspan);
      if (rowspan) el.setAttribute("rowspan", rowspan);
    }

    Array.prototype.forEach.call(node.childNodes, function (child) {
      var cleaned = copyClean(child);
      if (cleaned) el.appendChild(cleaned);
    });
    return el;
  }

  function sanitizeHtml(html) {
    var template = document.createElement("template");
    template.innerHTML = redactPrivate(html || "");
    var output = document.createElement("div");
    Array.prototype.forEach.call(template.content.childNodes, function (child) {
      var cleaned = copyClean(child);
      if (cleaned) output.appendChild(cleaned);
    });
    output.querySelectorAll("table").forEach(function (table) {
      var wrap = document.createElement("div");
      wrap.className = "table-wrap";
      table.parentNode.insertBefore(wrap, table);
      wrap.appendChild(table);
    });
    return output.innerHTML;
  }
