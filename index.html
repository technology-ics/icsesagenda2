who specializes in complex arthroscopic and open surgeries of the upper extremity.Dr. Lynch was born and raised in Sewell, NJ. After attending high school at St. Joseph\u2019s Prep in Philadelphia, PA, he completed his undergraduate studies in Biology at The Johns Hopkins University where he played four years of NCAA baseball serving as team captain. Upon graduation, he attended the Rowan University School of Osteopathic Medicine in Stratford, NJ.Dr. Lynch completed his residency in orthopaedic surgery at the Jefferson Health New Jersey Division, where he received training in all aspects of orthopaedic surgery including arthroplasty, arthroscopy, fracture care surgery as well as the non-operative management of many orthopaedic conditions. While in residency, Dr. Lynch served as the research chief resident overseeing one of the most productive research residencies nationwide.Following residency, Dr. Lynch completed a fellowship in shoulder and elbow surgery at The Cleveland Clinic Foundation in Cleveland, OH, training under world experts in the treatment of all conditions related to the shoulder and elbow. In Cleveland, Dr. Lynch gained an extensive knowledge in routine and complex shoulder replacement procedures, rotator cuff and labral repair, and muscle tendon transfers as well as elbow arthroscopy, arthroplasty and ligamentous procedures such as biceps repairs and Tommy John Surgery. Dr. Lynch has a particular interest in revision shoulder replacement and periprosthetic fracture management.Dr. Lynch is active in education and producing research to move the field of orthopaedics forward. Throughout his training, he has authored more than a dozen peer-reviewed journal articles and presented his research at local, regional and national orthopaedic and sub-specialty conferences, receiving numerous awards for his work. He is a candidate member of the American Shoulder and Elbow Society (ASES), a member of the Mid-Atlantic Shoulder and Elbow Society (MASES) and the prestigious Phoenix Society.In his free time, Dr. Lynch enjoys cooking, distance running, golf, watching and attending Philadelphia sporting events, and spending time with his wife, Stephanie, and their growing family.\"\n37d038b2-6c82-4ec7-81b3-92c0a9026857,Stephanie,Muh,\n381dcefe-a5f0-4006-b94c-8cefc4096410,STEPHANE,JABRE,Orthopedic Resident\n38668615-6e73-49f0-8c9b-37ca702d8f39,Sara,Morais,\"Sara Mor\u00e1is is an elbow surgeon at Hospital Universitario de \u00c1lava-Txagorritxu, in the North of Spain. Her main interest is everything elbow related\"\n3884b2b1-b522-4867-80d2-13eb3daf7534,Michael,Sandow,\n388d890d-c768-46b7-a371-925b5bc73f96,Amin,Abukar,\"I completed my orthopaedic residency training in London, UK, on the University College London Hospitals rotation under the leadership of Professor Fares Haddad, who served as Training Programme Director. I am currently completing an Upper Extremity Fellowship at the University of Toronto at Sunnybrook Health Sciences Centre under the supervision of Professor Diane Nam. My clinical and academic interests focus on upper extremity arthroplasty, trauma, and sports-related injuries, with active involvement in the Sunnybrook Orthopaedics Upper Limb Research Group and ongoing research in upper extremity clinical outcomes and arthroplasty. I have a particular interest in advancing evidence-based approaches to shoulder and elbow care.\"\n388f0e65-41ff-4697-924d-b43e7faee3bd,David,Clark,\"I am a consultant upper limb surgeon at the Derby Shoulder Unit in the UK for the past 26 years. My research interests are quality improvement in upper limb surgery, long term outcomes of shoulder and elbow arthroplasty, epidemiology of upper limb conditions. I served on the British Elbow and shoulder council for 8 years as secretary and treasurer.\"\n396749fc-8bea-491a-baa9-a0368100ed80,Natascha,Kraus-Spieckermann,\n399523a6-28e5-4c05-a5b3-df4e0f0268cd,Andreas,Voss,\"Professor Andreas Voss is a German orthopaedic surgeon specialising in shoulder and elbow surgery with a strong emphasis on sports-related pathology, arthroscopy, and regenerative joint therapy. He trained in orthopaedic sports medicine at the Technical University of Munich and completed further training in trauma surgery at the University Hospital of Regensburg, with an additional Sports Medicine Research Fellowship at the University of Connecticut (USA) focused on shoulder research and surgery. He serves as a Professor and senior surgeon with the sporthopaedicum group (Regensburg & Straubing) and the University Hospital of Regensburg, combining clinical practice, research, and education. Prof. Voss holds memberships and active roles in key professional societies including ISAKOS, ESSKA, AGA (Arthroscopy & Joint Surgery), and the German Association for Shoulder and Elbow Surgery (DVSE), and is often invited as faculty at international orthopaedic conferences. His work includes advanced arthroscopic and reconstructive techniques for shoulder and elbow conditions, as well as glenohumeral instability, rotator cuff repair, and cartilage-preserving approaches, alongside involvement in teaching and student orthopaedic education programmes. He has received several research awards and grants, reflecting his active contribution to shoulder\u2013elbow clinical science and training.\"\n3a3334c6-1b04-431e-8db0-3be8b1148f7d,Ji-Hoon,Choi,\n3a66fcff-a3e1-451e-b6d2-a2e567ff66d8,Adam,Watts,\"Adam Watts is Professor of Orthopaedics at Edge Hill University Medical School and Honorary Consultant Orthopaedic Elbow surgeon at Wrightington Hospital. He trained on fellowship in Adelaide, Australia and Wrightington, UK. Adam has over 200 publications in upper limb surgery, has contributed to national guidelines on wrist fractures, lateral epicondylosis, elbow arthroplasty and infection and is a designer of surgical techniques and implants. He is a Specialty Editor for the Bone and Joint Journal and Shoulder and Elbow Journal, and sits on the Editorial Board for the National Joint Registry, and is Honorary Secretary of the British Elbow and Shoulder Society. Adam is an NIHR Grant award holder as Chief Investigator of the SOFFT trial and co-investigator on the NIHR funded RAPSODI trial and FOREST trial and works with a number of commercial partners on delivery of local and international research studies.\"\n3aced1bb-3a59-4e26-a2d7-064b407fae48,Christopher,Bayne,\n3b27dcb5-c981-4b64-acad-136942cad443,Mark,Morrey,\n3b9a810f-b9f4-4bbc-89d0-6f2c9f4bf1eb,Daniel,Paccot,\n3bb52d3a-250a-430b-b7cb-bf486bd293cf,Ofer,Levy,\"Professor Ofer Levy is an internationally recognized orthopaedic surgeon, specializing in shoulder and elbow surgery. Director of the Reading Shoulder Unit at Berkshire Independent Hospital UK, Director of the Israeli Shoulder Institute and Professor of Orthopaedics at Barzilai Medical Centre, Ashkelon, and the Faculty of Health Sciences, Ben-Gurion University of the Negev, Beer Sheva, Israel. The President of the Israeli Shoulder and Elbow Society. Prof. Levy graduated from the Hebrew University & Hadassah School of Medicine in Jerusalem in 1982, receiving the 1st Prize in Surgery. Following his military service, completed his training at Kaplan Medical Centre and Sheba Medical Centre, Tel Hashomer. In 1992, became Instructor of Orthopaedic Surgery at Tel Aviv University, contributing to clinical and basic science research. In 1995, appointed Chief of Shoulder Surgery at Soroka Medical Centre and Lecturer at Ben-Gurion University. During a sabbatical in 1997 he joined Stephen Copeland at the Royal Berkshire Hospital and co-founded the Reading Shoulder Unit. In August 2020 he retired from the NHS hospital but continued to lead the Reading Shoulder Unit privately at Berkshire Independent Hospital. Prof. Levy is an award-winning clinician, recognized with the National Bronze Clinical Excellence Award (since 2006). From 2008 to 2016, he founded and chaired the Orthopaedic Research and Learning Centre at Brunel University, London, where he was Associate Professor at the Centre for Sports Medicine and Human Performance. A prolific inventor, he developed multiple arthroscopic and open surgical devices and pioneered several minimally invasive shoulder techniques, and pioneered the use of Ultrasound scan during consultation. He designed the Verso stemless reverse total shoulder replacement, now used globally.Prof. Levy pioneered the use of Ultrasound scanner as part of the consultation. He has contributed extensively to academic scholarship with over 400 scientific publications and presentations and authored book chapters in leading orthopaedic texts. His reputation has led to over 130 invited lectures worldwide, including speaking engagements for major orthopaedic and shoulder societies across Europe, the Americas, Asia, and Africa. Holds honorary memberships in numerous national & international orthopaedic societies. Assistant Editor for the Journal of Shoulder & Elbow Surgery and Associate Editor for Clinics in Shoulder & Elbow and the Journal of Shoulder & Elbow Arthroplasty. He regularly reviews manuscripts for many leading journals. Prof. Levy is External Examiner at several National and international Universities and Royal College of Surgeons. He has organized over 40 international shoulder surgery courses and founded the International Shoulder Safari Conference in Israel in 2018. Research and teaching interests encompass biomechanics, joint replacement, and novel surgical technologies. Under his leadership, his teams have earned multiple prestigious research awards, including the SECEC Best Paper (1999), BESS Best Poster (2008), BESS Best Technique (2011), and the Kessel Prize in 2010 and 2017.Beyond medicine, Prof. Levy holds a Private Pilot License for Gyrocopters and is a co-holder of the Guinness World Record (2022). Combining innovation, leadership, and education, he continues to shape the global field of shoulder and elbow surgery through pioneering research, teaching, and clinical excellence.\"\n3bd1c568-c2da-4772-a14b-6b6f189d5380,Marissa,Dearden,\n3bff029f-2b50-4ac5-b092-49e6b3a90cc9,Keith,Baumgarten,\"Keith M. Baumgarten MD, FAAOS, FAOA is fellowship-trained in sports medicine, knee and shoulder surgery and has been practicing in South Dakota for over 20 years. He has authored over 150 publications and has been presented with the Charles S. Neer Award in 2011 and 2013, the O\u2019Donoghue Award in 2014, and the Kappa Delta award in 2024 for his research collaborations. He was recognized by Avant-garde Health as both a 2024 and 2025 Orthopedic Research All-Star, placing him in the top 1% of researchers in the field.\"\n3c06a59f-2e77-494d-a272-55c1bd744cdb,Raul,Barco,\"Professional ProfileA dedicated shoulder and elbow surgeon since 2004, he currently serves as Head of the Upper Limb Unit at Hospital Universitario La Paz and Head of the Shoulder and Elbow Unit at Hospital Memoria Publio Cord\u00f3n in Madrid. He has trained at leading centers across Europe and the United States.Leadership & SocietiesHe is Past President of the Spanish Society of Shoulder and Elbow Surgery (SECHC) and Past Head of the Elbow and Forearm Group of the European Society for Sports Traumatology, Knee Surgery and Arthroscopy (ESSKA).In 2024 he co-founded the Global Elbow Network, organizing its inaugural congress in Miami (2025) and the second edition in Lisbon (2026). He is Co-President of the European Congress of the European Society for Surgery of the Shoulder and the Elbow (SECEC), to be held in Barcelona in September 2026.Education & TeachingDeeply committed to surgical education, he has authored multiple book chapters and textbooks. He is Co-President of two major international courses: the International Advanced Course on Elbow Surgery (IACES) and the Barcelona International Arthroscopic Shoulder Surgery Course (BIASS).Research & InnovationHis research activity spans both basic and clinical science and has been supported by competitive grants, in both shoulder and elbow, and has been awarded the Hawkins Award 2025 from the AAOS. He holds several patents for medical devices and has developed innovative surgical devices.\"\n3c2af328-78fb-42d3-aa5d-b92edd5a2551,Markus,Scheibel,\n3caffd73-77c6-4ffa-bb33-61754a0f8f38,Matthew,DiPaola,Dr. Matthew DiPaola is Clinical Associate Professor of Orthopedics and Sports Medicine at University at Buffalo. He is a full member of the American Shoulder and Elbow Surgeons (ASES). He is past chair of the ASES Technology Committee and current co chair of the Patient Centered Initiatives Committee. He has received the Charles Neer award from the ASES for excellence in basic science research and has active research focused on periprosthetic shoulder infection and physical therapy treatments of shoulder arthritis. He teaches residents at the University at Buffalo Department of Orthopedics and is Co-Director of the Arthroscopy Lab at the Jacobs School of Medicine.\n3cd45a8d-a396-4c28-b950-9355d358a30b,Raffaele,Grasso,\n3e10d006-2f84-4591-a6fe-e7394b2514ea,Aparna,Viswanath,\"I am a consultant trauma and orthopaedic surgeon with a specialist interest in shoulder and elbows. Having completed my training from the East of England deanery in 2018, I pursued advanced international and national fellowships before starting my practice. I have been a consultant at a major trauma centre in Middlesbrough, United Kingdom for 5 years and have a high volume arthroplasty practice with have a heavy trauma based practice. I am a member of the British Elbow and Shoulder Society and currently sit on council as the Equity, Diversity and Inclusion representative. I am deeply invested in fostering an environment where surgeons are evaluated solely on merit, and where theatre designs, instrumentation and specialty organisations allow access and equitable opportunities for all surgeons.\"\n3e2f6b80-2f28-4d32-a888-14b9e27bc6e8,Armodios,Hatzidakis,\n3e43397d-2354-4b47-bbe5-3fe4dfe9491f,Jose,Garcia,\"Head of Shoulder and Elbow NAEON Institute S\u00e3o Paulo-Brazil Master of Science (MSc) in Health Sciences: University of Liverpool, England.Doctor of Philosophy (PhD) in Health Sciences: University of S\u00e3o Paulo (USP).\"\n3e444c40-5547-4817-b9c7-efc19f92d7ad,Frank,Gohlke,\"1973-1979 Study of Human Medicine at the University of W\u00fcrzburgMilitary Service:1980-1981 German Air ForceThesis:15.12.1981 Department of Internal Medicine, University of W\u00fcrzburg, Thesis: \u201eInteractions between Saline uptake and autonomous nerve system in different forms of experimental hypertension\u201c(magna cum laude)1983: Resident at the Department of Ortho\u00acpaedics, University of W\u00fcrzburg, K\u00f6nig-Ludwig-Haus (Head: Prof. Dr. A. R\u00fctt)1.10.1983 - 31.3.1984: Fellowship in Trauma Surgery in UKH Linz, Austria (Primarius Dr. R. Streli).1984 Resident at the Department of Ortho\u00acpaedics, University of W\u00fcrzburg, K\u00f6nig-Ludwig-Haus (Chairman: Prof. Dr. J. Eulert)1.1.1988 Senior Surgeon (Oberarzt) Department of Orthopaedics, K\u00f6nig-Ludwig-Haus1.9.1988 Head of the Unit for Rheumatoid Surgery in the Department of Orthopaedics, University of W\u00fcrzburg, K\u00f6nig-Ludwig-Haus (KLH)1.4.1990 Head of the Clinic for Shoulder and Elbow Surgery in the KLH19.12.1994 PhD qualification at the University of W\u00fcrzburg,Associate Professor for Orthopaedic SurgeryPostdoctoral Thesis: \u201cCapsulo-ligamenteous protection of the glenohumeral joint and its surgical repair \u2013an anatomical and biomechanical study.\u201d2002 Clinical Professor of Orthopaedics of the University of W\u00fcrzburg2010 Head of the Clinic for Shoulder&Elbow Surgery, Rhoen Clinic Bad Neustadt and member of the faculty of the University of W\u00fcrzburg as Associate ProfessorInternational Scientific Societies\u20221989 Ordinary Member of the European Society for Shoulder and Elbow Surgery (SECEC); Research and Development Committee 1994-1998, National Delegate of Germany 1996-2002, since 2004 nochensubstanz\"\")\u20222019 Neer Lecture: \u201eThe glenoid in shoulder arthroplasty \u2013 still the weak link?\u201c, 14th. ICSES (International Congress for Shoulder and Elbow Surgery) Buenos Aires\u20222023 OBEX-Award of the DVSE for the most cited/ downloaded paper in 2022: \u201cRevision of reverse shoulder arthroplasty \u2013 a point of no return\u201d\u20222024 ICSES Congress in Rome, \u201cPioneer of Shoulder Surgery\u201d\"\n3e5569ad-e6e6-439f-8196-8682752c79b0,Yingtong,Gao,\n3f35d328-029e-47e5-98e4-4c9bf5fe78e1,Moritz,Kraus,\n3f526ca2-7c5e-4e55-9f9d-b6b3f881cfbe,Johnlevi,Lazaro,\"Johnlevi Scott Lazaro, DO, is a Chief Orthopaedic Surgery Resident at Jefferson Health New Jersey and an incoming Shoulder and Elbow Fellow at Brown University. He received his medical degree from Rowan University School of Osteopathic Medicine. His academic interests include shoulder and elbow surgery, clinical outcomes research, and resident education. He has authored and presented research on shoulder arthroplasty and upper extremity surgery at regional and national meetings.\"\n3fe50305-4a4e-4878-9028-a27c19bd2066,Michael,Kucharik,\"I am an orthopaedic surgery resident at the University of South Florida-Florida Orthopaedic Institute, where I have developed a strong interest in shoulder and elbow surgery. I have contributed to multiple research projects aimed at improving surgical decision-making and patient outcomes in shoulder reconstruction. I will be pursuing a dedicated Shoulder and Elbow Fellowship at the Rothman Orthopaedic Institute during the 2027\u20132028 academic year. My long-term career goals include an academic practice with a focus on resident and fellow education, mentorship, and continued contributions to shoulder and elbow research.\"\n40474db2-9080-4750-91eb-8870b2dd4242,Fay,Leung,\n407251df-f326-42cb-9f95-30742affc08a,Brian,Werner,\"Dr. Werner is a Professor in the Department of Orthopaedic Surgery and Director of the UVA Sports Medicine fellowship. He completed a fellowship in Sports Medicine and Shoulder Surgery at the Hospital for Special Surgery, where he was a team physician for the New York Giants and the New York Red Bulls. Dr. Werner currently serves as the Head Orthopaedic Team Physician for James Madison University athletics. Dr. Werner has a significant interest in both clinical and basic science research, has published over 400 peer-reviewed papers on a wide variety of orthopaedic topics and has presented his research both regionally and nationally over 500 times. He has won numerous national awards for his research. His current research interests include clinical outcomes after knee and shoulder surgery, biomechanical studies in the knee and shoulder, shoulder arthroplasty and cartilage injury and repair.\"\n40a22629-fade-4cb0-9a6a-e61997c4ba8b,Fernando,Hiramuro-Shoji,\"Medical School, University of Guadalajara, Orthopedic Training, Hospital Civil de Guadalajara, Mexican Board Certified, 2001, Founder Shoulder Clinic, Hospital Civil de Guadalajara \"\"Fray Antonio Alcalde\"\" 2001, Past President Mexican Shoulder and Elbow Surgeons society 2013-2014, Chief of the Arthoscopy and Sports Medicine Department Hospital Civil de Guadalajara \"\"Fray Antonio Alcalde\"\",\"\n41bc7574-8153-4e2a-be40-f0e13d2faee3,Diane,Nam,\"Diane Nam, MSc MD FRCSC, is Professor at the University of Toronto. She is an orthopaedic trauma surgeon at Sunnybrook Health Sciences Centre with subspecialty expertise in polytraumatic conditions of the upper limb and complex reconstruction. She is the Upper Extremity Trauma Fellowship Director and a clinician scientist at the Sunnybrook Research Institute investigating the molecular and cellular mechanisms in bone regeneration focusing on translational research.\"\n4208b406-3263-4dc1-9abb-3b1d38db4c61,Ziyad,El Qirem,\n4230fb89-03d7-4040-8302-82d94f7849a5,Jaesoo,Kim,\n426f46b1-8b16-4465-ad95-e408b3b07187,Jarret,Woodmass,\n428ec6f5-7b79-4a1b-8cec-606a0aef2d85,Michael,Amini,\n42d408a4-40dd-4b Phil candidate at the University of Cambridge and a medical student at Lancaster University. He has authored multiple peer-reviewed publications spanning shoulder arthroplasty, rotator cuff repair, and shoulder instability, with work published in the American Journal of Sports Medicine, Arthroscopy, and the Journal of Shoulder and Elbow Surgery. His research has been presented at international meetings including AANA, SECEC, and the London Shoulder Meeting, and he is the founder of glen.ai.d, an AI-powered clinical decision support platform for shoulder instability surgery. He has undertaken visiting fellowships with leading shoulder surgeons across the UK (Wrightington), France (Lyon, Marseille, Grenoble), Switzerland (Geneva, Bern), and the United States (San Antonio, TX). He is a keen cyclist and rower, sitting in the bow seat of the Trinity Hall 2V for their successful Lent's and May Bumps campaign.\"\n4726b2eb-d3ee-4e18-8285-92fb43330570,Patrick,Chin,\"Patrick Chin, MD, FRCSC is a fellowship-trained orthopaedic surgeon specializing in shoulder and elbow surgery, sports medicine, and advanced arthroscopic and reconstructive procedures. He is a Clinical Associate Professor in the Department of Orthopaedic Surgery at the University of British Columbia and currently serves as Head of the Upper Extremity Division. Dr. Chin completed his medical degree and orthopaedic residency at Queen\u2019s University, followed by advanced fellowship training in Sports Medicine and Arthroscopy at Western University and Adult Shoulder and Elbow Reconstruction at the Mayo Clinic. He also holds an Executive MBA, reflecting a strong interest in innovation, healthcare delivery, and practice excellence.With more than two decades of clinical experience, Dr. Chin is internationally recognized for his expertise in shoulder and elbow reconstruction, including complex arthroplasty, revision surgery, and minimally invasive techniques. He has authored numerous peer-reviewed publications, led multi centre clinical trials, and is frequently invited to teach and lecture worldwide. Dr. Chin has served as President of the Canadian Shoulder and Elbow Society and continues to play an active leadership role in orthopaedics at provincial and national levels. Known for his thoughtful, patient-centred approach, he is trusted by professional athletes, referring physicians, and patients alike to deliver precise, evidence-based surgical care with a focus on durable outcomes and safe return to function.\"\n47652a22-0556-4962-8419-9cdaddb15337,Christian,Gerber,\"Prof. and Chairman at University of Z\u00fcrich for 22 Years. Physician scientist particular interests rotator cuff, basic science, biomechanics\"\n47d52490-60a5-44af-8771-449ec14f4f69,Christian,Rosenow,\n48df79ca-af0e-4a5f-a63f-e65d5758775f,Jungmin,Jo,\"Resident in the Department of Orthopedic Surgery at Pusan National University Hospital, Busan, South Korea\"\n49aa9ba8-fb75-4418-8924-3b3c65754263,Anthony,Finocchiaro,\n49f0b004-64e8-47bd-8e03-18ba224d7160,Peter,MacDonald,\"Professor, Department of Surgery, University of Manitoba. Medical Director Pan am Clinic Winnipeg. Past President ASES and COA, HEad Team Physician, Winnipeg Jets, Head Orthopedic Surgeon, Winnipeg Blue Bombers\"\n4a82dffc-9a56-41c1-a12c-2710e366c70f,Paul,Sethi,\"Paul Sethi, MD, is a board-certified orthopedic surgeon who specializes in sports medicine conditions of the elbow, knee and shoulder. He performs a range of shoulder replacement procedures, including total shoulder replacement, reverse shoulder replacement, and partial shoulder replacement. Dr. Sethi is a leading research physician who speaks at academic and instructional medical conferences in the US and abroad. His research on surgical advances in his specialty is regularly published in leading medical journals, including the Journal for Shoulder and Elbow Surgery, Arthroscopy, and the Journal of American Academy for Orthopaedic Surgery. He also collaborates with outside companies for education and research purposes and to develop medical procedures on the shoulder, elbow and knee. Dr. Sethi is a member of the prestigious American Shoulder and Elbow Society and American Academy of Orthopedic Surgeons. He is President of the ONS Foundation for Clinical Research and Education (ONSF).Dr. Sethi completed a sports medicine fellowship at the Kerlan Jobe Orthopaedic Institute in Los Angeles, CA. His research on athletic performance while a resident surgeon at Yale, his studies of professional basketball players, and his experience as a college varsity athlete have provided Dr. Sethi with an informed perspective of sports-related injuries and conditions.Dr. Sethi served as an orthopedic consultant to the Los Angeles Dodgers and was a former assistant team physician for the Los Angeles Lakers, Los Angeles Kings, and Los Angeles Dodgers. He is also a former assistant team physician for the University of Southern California football team.Currently, Dr. Sethi serves as team physician to Greenwich High School, and Brunswick High School. He is a former team physician for Iona Preparatory High School. He is the Chief Medical Officer for the Premier Lacrosse League (PLL) and the Women\u2019s Lacrosse League (WLL), where he provides world-class medical expertise, injury prevention strategies, and rehabilitation support to PLL and WLL athletes.\"\n4aead3a7-b69c-472b-a757-756b737e4b05,Xiali,Xue,\n4aec50c8-50e3-4f08-82f6-eed3b52caeb9,Andrea,Amura,\n4c128970-57f5-43c4-84ce-c07a9142d42a,Sameer,Khawaja,Baylor College of Medicine Orthopaedic Surgery Resident\n4cb3e2d5-0dce-41f9-8ab9-fa12ab3c70c8,Anneluuk,Lindenhovius,\n4cb5dc85-a30e-4845-a585-40c74a557ba3,Derek,Papp,\"Derek Papp, M.D., is a board-certified orthopedic sports medicine physician and orthopedic surgeon with Baptist Health Orthopedic Care. He has a specific interest in treating the shoulder and elbow of throwing athletes, but he enjoys caring for patients young and old. During his career, Dr. Papp has served as a course director at a multitude of international adventure orthopedic educational conferences (including in Antarctica, scheduled to return in 2027)\"\n4ce768f5-a77b-4166-b51b-d18222f467d7,Jorge,Rojas,\n4cef3e0e-095a-466a-b421-889dc9f30ab4,Jonathan,Ticker,\n4d5726dc-832b-4104-b4bf-bd839db9b87f,Pedro,Pel\u00e1ez,\n4e37a2a0-6e14-4876-88a3-18ae439aa2ae,Joseph,Sliepka,\n4e39a9c4-789a-4a8a-a671-a4b021f2f044,Shogo,Sugawara,\n4e3cd711-f983-4662-b6b4-92e1ff020156,Jorge,Orbay,\"Jorge L. Orbay, M.D. is a board-certified Orthopedic Surgeon specializing in hand and the upper extremities. He received his training and residency at the Hospital for Joint Diseases Orthopedic Institute of New York and completed his fellowship in hand and microsurgery at the University of Miami/ Jackson Memorial Hospital. As a dedicated innovator in his field, he has developed implant systems and techniques that continue to improve patient quality of life. He has proudly served patients at the Miami Bone & Joint Institute, formerly Miami Hand & Upper Extremity Institute for over forty years.\"\n4e41fd92-d9cb-499d-9950-42f490199fc3,Taro,Akiyama,\n4e45f561-36f4-4497-af1b-8a45d88eecfc,Sungyoon,Cho,\n4e87d30b-ffd2-4b82-9bb2-6562d79590e6,Mathieu,FERRAND,\"Shoulder and Elbow Surgeon - Rennes - FrancePast fellow of Paris Hospital, FrancePast Fellow of Capetown Shoulder Institute, South Africa\"\n4eaaf207-0894-4c07-b598-4ad5a2d22b63,Kevin,Khoo,From the PNWUW Orthopedic Surgery ResidencyCleveland Clinic Shoulder & Elbow Fellowship\n4ebb9f95-6d99-416b-b9ce-23c44df6a78e,derek,cuff,\n4f836c3b-4295-4028-93fc-696d185adada,Christopher,Chuinard,\"Dr. Chuinard is board certified by the American Board of Orthopedic Surgery, specializing in shoulder and elbow surgery, and has a Certificate of Added Qualification (CAQ) in Sports Medicine. His advanced training includes a shoulder fellowship with professor Pascal Boileau in Nice, France, traveling fellowships to other shoulder centers in Europe and the United States, and a Visiting Clinician in Elbow Surgery at Mayo Clinic. In 2010, he was awarded the AANA Travelling Fellowship.\"\n4fc103c3-cd4d-41e1-aa64-5ade34de85d3,Michell,Ruiz-Suarez,\"Born and raised in Mexico City. I am a fellowship-trained orthopedic surgeon specializing in Sports Medicine and Shoulder, Elbow, and Knee Surgery. I earned his medical degree from the National Autonomous University of Mexico (UNAM) and completed my Orthopedic Surgery residency at the National Institute of Rehabilitation (INR). Subsequently completed advanced fellowship training in Arthroscopy, Shoulder & Elbow Surgery, and Sports Medicine, including an international fellowship at the Plano Orthopedic & Sports Medicine Center in Dallas, Texas. He was also selected as a Traveling Fellow of the Arthroscopy Association of North America (AANA).I have previously served on the faculty of the Shoulder and Elbow Surgery Department and later the Shoulder and Elbow Clinic within the Trauma Department at the National Institute of Rehabilitation, where I specialized in the treatment of complex shoulder and elbow disorders and the education of orthopedic residents.I currently serve as faculty for the UNAM-affiliated Fellowship in Sports Medicine and Arthroscopy at Hospital \u00c1ngeles Metropolitano. I am also a consultant for professional sports teams, providing specialized care in shoulder, elbow, and knee surgery for elite athletes.I am Past President of the Mexican Society of Shoulder and Elbow Surgeons. Current member on the editorial boards of several international peer-reviewed orthopedic journals and is a consultant and faculty speaker for leading multinational medical technology companies. My academic and clinical interests include sports injuries, arthroscopic surgery, complex shoulder reconstruction, biologic augmentation, and innovation in orthopedic education.In addition to my surgical career, I am currently pursuing advanced training in existential psychotherapy and coaching, with a particular interest in integrating phenomenological and existential principles into patient care, physician well-being, and medical education.\"\n500d4a64-b732-43cc-9758-a98b12b9422c,Yasser,El Safoury,\"Yasser EL Safoury Professor of Orthopedics Cairo University . A consultant for Hand \u2013 Upper Limb and Microsurgery . Received advanced training in Upper Limb surgery at Massachusetts General Hospital (MGH) and Southern Illinois University in the United states . Pursued an AO fellowship at the University of Bern, Switzerland . Founder and Former President of the Egyptian Society for Surgery of the Hand and Microsurgery ESSHM , and the Founder and Honorary President of the Egyptian Shoulder Surgery Association EGSSA . President elect for the African Shoulder and Elbow Society AFSES . Member of the organizing Board for the coming ICSES Cairo 2029 .\"\n50b2dfb7-a90f-4a9b-9ff7-aa83f3616bc2,Naoya,Nishinaka,\n50b437d2-5c51-4c22-869e-f3b71ea969a7,Erick,Marigi,\n50d67b8a-291c-49e2-9f85-439723332da7,Erica,Kholinne,\"Erica Kholinne, MD, PhD is an Indonesian board-certified orthopaedic surgeon specializing in shoulder and elbow surgery and an Assistant Professor at the Faculty of Medicine, Universitas Trisakti. She completed her PhD at the University of Ulsan, South Korea, and international fellowships in South Korea, Singapore, and the Netherlands. She has authored more than 150 publications (H-index 21), serves on several international journal editorial boards, and is actively involved in JSES International and AJSM.\"\n5108470e-0d5b-4c52-b331-584838286bd6,Franz,Kralinger,\n5148179d-e9cb-43aa-91a5-3d0f01304056,Ryan,Simovitch,Director - Shoulder Division - HSS FLMedical Director - HSS FLHospital for Special Surgery FL\n514a26b2-1ee9-4c46-836e-78391612d782,Matthew,Schultz,\"PGY5 orthopaedic surgery resident at Jefferson Health - New Jersey. Future clinical fellow in Shoulder & Elbow surgery at MedStar Union Memorial Hospital. Professional interests include complex shoulder and elbow reconstruction, shoulder arthroscopy, sports-related upper extremity pathology, and academic orthopaedics.\"\n5167b85b-1df2-4b77-af75-483eb7b970c2,Guillermo,Araujo Espinoza,\"Guillermo Araujo is an orthopedic surgeon from Lima-Peru with specialized training and technical expertise in cartilage/meniscus restoration, including knee and shoulder arthroscopy. Honored to be a SLARD/AOSSM Traveling Fellow in 2022. Sports Medicine Research Fellow at UCLA and CU Denver. Classical music enthusiast and amateur tennis player.\"\n5204884e-f566-407d-98df-3dad0faa4ede,Ali,Maqdes,\"Ali Maqdes is an orthopedic surgeon specialized in the shoulder. His work includes treating shoulder pathologies starting with acute fractures, chronic sport related injuries and shoulder replacement surgeries. He is currently practicing medicine in Kuwait city, Kuwait where he works in the government sector (Kuwait oil comapy hospital) and the private sector. Before coming to Kuwait, Dr Ali Maqdes did his residency and fellowship in France. He was mentored by many prominent shoulder surgeons. He has participated and published many scientific articles concerning the shoulder and other orthopedic problems.\"\n52378e74-2ca3-489e-b1fc-73f319edc47c,Jonah,Hebert-Davies,\n52b4aaed-3f24-4da6-9b68-470a1d11af80,Carlos,Torrens,\n534cee8d-411f-4787-8c0f-5c8c4f35e320,Brendan,Sheehan,\n53576384-0f65-4cbe-a59b-16e46c87931a,Richard,Dallalana,\"Shoulder and Elbow surgeon practicing in Melbourne, Australia. Fields of expertise include management of sports injuries and use of advanced technologies in shoulder arthroplasty. Fellowship supervisor and executive member of the Australian shoulder and elbow society.\"\n5372b812-1c13-43ac-a2f2-18d7873f22b9,Ashraf,Hantouly,\n537b5d33-3bd7-4df9-bbeb-8907ead844e7,Andrew,Collins,Orthopaedic Surgery Resident at the University of Washington\n538fe0e5-e0cf-4aa9-95a8-2ccf0b6d2ea8,Bancha,Chernchujit,\n53c32a7e-f142-4525-808e-58eafbdf1eb5,Ariel,De la Rosa Guerrero,\n54710266-460e-450c-a629-e9e212c1619f,Sharrieff,Shah,\n5487b179-c52d-4fba-9a5e-a041d1535fbf,Antonella,Henson-Vendrell,Class of 2027 MD Candidate from Wake Forest University School of Medicine who will be applying into Orthopaedic Surgery.\n54923eb1-1c21-4062-8a85-e507d4948515,Susan,Sulzer,\"-Residency Program in Orthopedic and Trauma Surgery at the \u201cUniversidad de Chile\u201d (University of Chile), Santiago - Chile (2012-2015).-Fellowship Program in Shoulder and Elbow Surgery at the \u201cUniversidad de Chile\u201d (San Jos\u00e9 Hospital and Teaching Hospital University of Chile), Santiago - Chile (2016-2017). -Fellowship Program in Shoulder Surgery at \u201cDeutsches Gelenkzentrum, ATOS Klinik Heidelberg\u201d, Heidelberg - Germany (2017-2018). Currently acting as:-Head of the Shoulder Surgery Division, Orthopedics and Traumatology Department , Hospital San Jos\u00e9. Santiago -Staff member - Shoulder Surgery Divisi\u00f3n, Orthopedics and Traumatology Department, Hospital del Trabajador. Santiago -Staff member - Shoulder Surgery Divisi\u00f3n, Orthopedics and Traumatology Department, Cl\u00ednica las Condes. Santiago -Adjunct Professor - Orthopedics and Traumatology Department, Universidad de Chile. Santiago.\"\n55057add-d761-4c69-b689-2579a52f0938,Joseph,Coory,\"Dr Joe Coory is a highly experienced orthopaedic surgeon with subspecialty fellowship training and a special interest in surgery of the shoulder and upper limb. He was an early MAKO robotic user for Reverse Total Shoulder Replacement. His expertise also includes minimally invasive arthroscopic rotator cuff repair and shoulder stabilisation. He contributes to innovation in healthcare and medical technology through being a founder and director of Panacea AI, Fortius hospitals, Fortius allied health and RTW Queensland.With a strong foundation in research, Dr Coory has authored award-winning studies in both non-operative and surgical management of shoulder conditions. He remains committed to advancing orthopaedic care through ongoing research in partnership with the University of the Sunshine Coast.\"\n551fe17a-e4e6-40be-98f2-7467e4ef8049,Seth,Gamradt,\n552f7179-806c-4f60-9e92-044b81cdfba0,Andrew,Davies,\"Mr Andrew Davies is a Trauma and Orthopaedic surgery trainee (ST8) in London, U.K., with a PhD from Imperial College London and FRCS (Tr Orth). His main research focus is shoulder arthroplasty and outcomes of the National Joint Registry. He represented the Great Britain Age Group Triathlon Team in 2022.\"\n56d8c96d-e2c9-4c43-9d20-565ece4eedd2,Kyosun,Hwang,\n573cfff2-db12-4189-aaed-57c792bf523b,Eric,Black,\n577ef6eb-a8ff-4418-b8ee-960ef86be7aa,Igor,Shirinskiy,\n57b4ec9c-8593-4f8f-b801-f59ece576e9c,Zaid,Hamoodi,\n57c6b463-444f-4de0-a9d1-2d3645763b43,Scott,Trenhaile,\n58219f58-2e0c-40da-8619-561fbce0ce5c,Takashi,Inoue,\"Dr. Takashi Inoue is an orthopedic surgeon specializing in shoulder surgery and sports medicine at Tokyo Sports & Orthopedic Clinic (TSOC), Japan. TSOC is a leading center for shoulder surgery and sports medicine directed by Dr. Hiroyuki Sugaya, an internationally recognized expert in shoulder disorders.Dr. Inoue\u2019s clinical and research interests include shoulder instability, rotator cuff disorders, and osteochondral lesions in young athletes. He is actively involved in clinical research and has authored peer-reviewed publications in the field of orthopedic sports medicine. He regularly presents his work at national and international scientific meetings.\"\n5830f3f6-b774-4bd6-832f-a662f8c30eda,Joideep,Phadnis,\"Professor Joideep Phadnis, MBChB, FRCS(Tr&Orth), PhD, is a leading Elbow Surgeon based at University Hospitals Sussex, Brighton in the UK and at Fortius clinic in London. He is a recipient of a National Clinical Excellence Award and has a tertiary referral clinical practice encompassing all aspects of elbow surgery including primary and revision arthroplasty, elite sports and complex trauma making him one of the UK\u2019s most influential elbow surgeons.Joideep is an honorary Professor at Brighton & Sussex Medical School for his contribution to research and is actively engaged in multidisciplinary teaching, global surgical education, leadership roles. His contribution to research is extensive with over 100 peer reviewed publications encompassing elbow arthroplasty, tendon reconstruction, sports injuries, trauma, and patient safety.He is currently director of the Brighton Shoulder & Elbow Fellowship, clinical lead of the Shoulder & Elbow department and lead for research in the British Elbow & Shoulder Society (BESS).\"\n5841a0f4-ba34-4a2c-af00-da97b5e5ec69,Philipp,Vetter,\n58529752-ab2c-4b39-8b61-b2122cbcdd07,Diego,Lima,\"Dr. Diego Lima is a highly skilled and accomplished orthopedic surgeon with expertise in various subspecialties, including shoulder and elbow surgery, adult reconstruction surgery, and sports medicine. With extensive training and experience, he performs a wide range of surgeries, including shoulder and elbow arthroplasty and arthroscopy, primary and complex cases, and sports-related injuries.Dr. Lima is a member of the esteemed American Association of Orthopedic Surgeons (AAOS) and ASES, further highlighting his commitment to professional excellence and staying at the forefront of advancements in orthopedic surgery.In addition to his clinical work, Dr. Lima serves as an assistant professor at both the University of Central Florida, Nova Southeastern University and the University of Miami, actively involved in the orthopedic residency programs of both institutions. Through teaching and mentorship, he contributes to the education and training of future orthopedic surgeons, fostering the growth of the field.\"\n58bcd4d5-afc0-41a0-bc87-321b699fd2f3,Seung Jin,Yoo,\n59bbfaef-e014-41d5-a477-7b34f928fe7d,Sara,Edwards,\n5a88ba2d-9938-419e-81f4-531790c0882e,KOZO,FURUSHIMA,\n5ab698fb-19b6-4762-aa67-78ac075b2a0b,Kunihiro,Suzuki,\n5b54c4a9-5c09-446f-8476-4f72fc949bb3,Philippe,Collin,\"I am an orthopedic shoulder surgeon based in Paris, France. My clinical practice and research focus on all aspects of shoulder surgery, with particular interests in shoulder arthroplasty and innovative surgical techniques. I am also committed to clinical research and the training of international fellows.\"\n5b5ae5e8-fa0d-4bfd-b6cb-f0f2f289b73e,Antti,Launonen,\n5ca40ee8-a256-4368-bd7f-688bbf5f2023,Jon,Warner,\"Dr. Warner completed his medical degree and surgical residency at the University of Rochester School of Medicine NY (1982), followed by the Harvard Combined Orthopedic Residency (1984-1987). He subsequently completed multiple research and clinical fellowships in Shoulder and Sports Medicine in Europe (Bern, Switzerland, Paris, France, Linkoping, Sweden-1988) and New York City (Hospital for Special Surgery-1989-1990). From 1990-1998 the University of Pittsburgh Medical Center, Dr. Warner was Associate Professor of Orthopedics at the University of Pittsburgh Medical Center and Director of the Shoulder Biomechanics Laboratory. He was also the Chief of the Shoulder Service as well as Associate Director of the Sports Medicine. Since coming to Harvard in 1998, he created the Shoulder Biomechanics Group and founded the Boston Shoulder Institute, New England Shoulder and Elbow Society and the Codman Shoulder Society. He is a graduate of Harvard Business School (Executive Program). The focus of his work has been in the areas of Value-Based Healthcare, cost analysis, and clinical outcome studies. This includes ongoing collaboration with colleagues at Harvard Business School. He is also a successful innovator and entrepreneur with successful ventures in both digital healthcare innovations and hardware product development including implants for for sports medicine, arthroscopy, and arthroplasty. Dr. Warner is Currently Professor of Orthopedics at Harvard Medical School, Founder and Emeritus Chief of The MGH Shoulder Service, and Emeritus Vice-Chair for Quality and Safety for MGH Orthopedics. He is also the founder of the MGH Shoulder Fellowship. He is also Past-President of the American Shoulder and Elbow Surgeons Organization and President of the San Diego Shoulder Institute, the longest running professional education program in the world for shoulder surgery.\"\n5d50bab7-c036-4535-8b3e-e4505638ac09,Yoneda,Masahiro,\n5d57359a-87df-41f1-83c1-a5fe8d9cd8d6,Shahbaz,Malik,\n5d97511a-bd19-488d-9190-70f545318f9e,Antonio,Tenor Junior,\"Medical degree from the State University of Campinas (UNICAMP).Medical Residency in Orthopedics and Traumatology and Fellowship in Shoulder and Elbow Surgery at Hospital do Servidor P\u00fablico Estadual (HSPE-SP), S\u00e3o Paulo, Brazil.PhD in Sciences from the Faculty of Medicine, University of S\u00e3o Paulo (FMUSP).Full Member of the Brazilian Society of Orthopedics and Traumatology (SBOT) and the Brazilian Society of Shoulder and Elbow Surgery (SBCOC), where he also serves on the Continuing Education Committee.Head of the Shoulder and Elbow Group, Department of Orthopedics and Traumatology, Hospital do Servidor P\u00fablico Estadual (HSPE-SP), S\u00e3o Paulo, Brazil.\"\n5dc65c08-60d3-4f4d-b76c-76694667b036,Mathangi,Sridharan,Resident physician at UCLA\n5e3ed234-3802-43b5-871c-8c20763712e0,Andrew,Jawa,\"Dr. Andrew Jawa is the open shoulder specialist at the Boston Bone and Joint Institute, a large private academic practice. As the open shoulder specialist, Dr. Jawa performs over 300 shoulder arthroplasties a year at both the New England Baptist Hospital and Boston Outpatient Surgical Suites. Through rigorous surgical and academic efforts, Dr. Jawa has become a regional and national leader in shoulder arthroplasty. He is the head of the shoulder section of the New England Shoulder and Elbow Society, and an active member of the prestigious American Shoulder and Elbow Society (ASES) and the Association of Clinical Elbow and Shoulder Surgeons (ACESS). Within ASES, he chairs the Complications of RSA Research group that aims to elucidate the etiologies of major complications following RSA. As an associate professor at Tufts University School of Medicine and co-director of the Harvard Shoulder Fellowship Program, Dr. Jawa has won numerous resident and fellow teaching awards for best instruction by an attending surgeon. He has been voted into \u201cBoston\u2019s Top Doctors\u201d every year from 2017 to present. Additionally, has published over 100 peer-reviewed articles and book chapters, regularly presents at national conferences, and is an associate editor for the Journal of Shoulder and Elbow Surgery.Dr. Jawa also pushes the field of upper extremity arthroplasty forward through his insight as a designer. He holds 3 patents, and is the lead designer for Ignite Orthopedics and Depuy Synthes on multiple projects including a radial head replacement and stemless total shoulder replacement.\"\n5e773b32-6385-4b5d-a8ac-53e5b054fe56,Justin,Anderson,\n5f320900-9aea-420b-9e50-55ec5595fa8d,Mariano,Menendez,\n5fcaf15a-77e2-490e-8680-7b0f3f479760,ALAN,HIRAHARA,\n605f35ba-89c6-4f8b-9017-fd753de13814,Fernando,Santana,\"Dr. Fernando Santana is an orthopaedic surgeon specializing in shoulder and elbow surgery in Barcelona, Spain. He has been a member of the Shoulder and Elbow Unit at Hospital del Mar since 2009 and also practices at Move Trauma and Move Traumatolog\u00eda in Barcelona.He received his MD from the University of M\u00e1laga, completed his residency in Orthopaedic Surgery and Traumatology at Institut Universitari Dexeus in Barcelona, and obtained his PhD from the Universitat Aut\u00f2noma de Barcelona.His clinical practice focuses on arthroscopic and open surgery for complex shoulder and elbow conditions, with particular interests in shoulder arthroplasty, rotator cuff disorders, instability, and proximal humeral fractures. His research focuses on clinical outcomes, evidence-based treatment, and innovation in shoulder surgery.Dr. Santana has authored more than 30 peer-reviewed scientific publications and has been an examiner for the European Board of Orthopaedics and Traumatology (EBOT) since 2016. He served as President of the Spanish Shoulder and Elbow Society (SECHC) from 2024 to 2026 and is actively involved in international education, research, and scientific meetings in shoulder and elbow surgery.\"\n60fa1a71-daf8-4000-a36c-7e967abe97eb,Bryan,Adams,\n61fd412e-511e-4f40-95b0-1344263cf2db,Hsien-Hao,Chang,\n624f4f50-7617-4bf6-b8f3-895e4e3c8965,Hussain,Selmi,\"Mr Hussain Selmi is currently an Upper Limb Fellow at the Royal National Orthopaedic Hospital, Stanmore. Prior to this, he completed a fellowship in Upper Extremity Trauma at Imperial College Healthcare NHS Trust. Outside of work, he enjoys playing sports with his son and is an active member of his local cricket team.\"\n62e2fa53-ed7d-488d-84b5-5dcc6325d7c3,Daniela,Guti\u00e9rrez Z\u00fa\u00f1iga,Orthopedic surgeon. Fellowship trained shoulder and elbow surgeon at the Fundaci\u00f3n Jim\u00e9nez D\u00edaz - Madrid. Attending shoulder and elbow surgeon at Cl\u00ednica del Country in Bogot\u00e1 Colombia. Actively involved in clinical research and surgical education.\n6389c56a-db0e-444a-a3ae-8e17d497ceb4,Michael,Khazzam,\n63a722b0-b557-4f2f-bf85-6c30a171456c,Heckroodt,Laubscher,\"Dr Heckroodt Laubscher is an orthopaedic surgeon based in Johannesburg, South Africa, with a dedicated subspecialist focus on the shoulder. He practises at the Centre for Sports Medicine and Orthopaedics.He qualified MBChB at the University of the Free State in 1998 and completed his orthopaedic training at the University of Pretoria, obtaining his FCS (Ortho) SA and M.Med (Ortho) in 2007. Immediately thereafter he undertook a shoulder fellowship working alongside Dr Philippe Collin, and visited internationally renowned shoulder surgeons across Europe. He has continued to pursue advanced training at the various international Shoulder Course and Symposia.Dr Laubscher serves as the appointed shoulder specialist consultant to the Golden Lions and Blue Bulls Rugby Unions (since 2018). He is a full member of the South African Orthopaedic Association and the South African Shoulder and Elbow Surgeons (SASES), a corresponding member of the European Society for Surgery of the Shoulder and Elbow (SECEC). He served on the SASES executive committee from 2021 to 2023 and currently holds the office of SASES President for 2025\u20132026. He has also been appointed to the scientific committee of the 16th International Congress on Shoulder and Elbow Surgery in 2026.He has published in the South African Orthopaedic Journal and the Bone and Joint Journal, and lectures regularly at national and international meetings, including ICSES, ESSSE, ISAKOS. He has acted as international faculty member at courses in India, Singapore, Istanbul, Doha and the United Kingdom, and runs ongoing CPD programmes for South African GPs, physiotherapists and orthopaedic registrars.\"\n63f48494-5db5-4ddd-95ab-184881c1e1d3,Ahmad,Hany,\n646b0b97-d6c2-41a1-9bc3-397c0a08c5b5,Hiroki,Okada,\n64c1e196-4816-48d2-a22b-aafec13dbb07,Tyler,Brolin,\"Shoulder & Elbow SurgeonDirector, Shoulder & Elbow DivisionAssociate ProfessorMedical Director, Campbell Clinic Ambulatory Surgery CentersCampbell Clinic\"\n64d188d6-811f-491b-8dbc-a8727dce1c0e,Fabio,BRANDAO DE ALMEIDA,\"Member of Brazilian Shoulder and Elbow Society (SBCOC), Brazilian Arthroscopy and Sports Medicine Society (SBRATE), Latin American Shoulder and Elbow Society (SLAHOC) and Arthroscopy Academy of North America (AANA).Chief of the Shoulder and Elbow Department - Royal Portuguese Hospital and Arthro Clinica Recife. Member of the Education and Trainig Comitee - SBCOC.Former President of Brazilian Shoulder and Elbow Society for North and Northeast Regions.\"\n65d943ed-1e48-46af-a8e2-05d0de74b890,Jonathan,Barlow,\n65f297bf-4cc7-40db-b2c2-dca4f65fe9b5,Rodrigo,Liendo,\n665184d9-54d3-4711-977d-8d11f4f42a6d,Francisco,Soza,\n66adb805-8ac5-41db-b2fc-2cc057f891e4,Jos\u00e9,Rojas,\n66ef78dc-fec2-43ee-85bc-2ee6d4e09271,Micah,Nieboer,\n66fc7ff7-0826-4513-9b6f-a1b55e278406,Vittorio,Candela,\n67501ad1-d89a-45ea-a4bf-ae0df63ab01b,Jae Sung,Yee,\"Jae-Sung Yee, MD, MS, is a Clinical Assistant Professor in the Department of Orthopaedic Surgery at Hallym University Sacred Heart Hospital, Republic of Korea, and a PhD candidate in Orthopaedic Surgery at Seoul National University College of Medicine. His clinical practice and research focus on shoulder and elbow surgery and sports medicine. His research interests include musculoskeletal imaging, artificial intelligence, and machine learning applications in orthopaedics, particularly for the diagnosis and treatment of shoulder disorders. He is actively engaged in clinical and translational research aimed at advancing evidence-based orthopaedic practice.\"\n6754dc3b-f7cf-4dc5-94e8-6a5a15a0d387,Sophie,Chuinard,\"Graduated from the University of Michigan with a BA in Biopsychology, Cognition, and Neuroscience. Applying to Medical School for the Fall of 2027\"\n67aa2a09-87c2-4186-a846-ff331dfbb891,Augustus,Mazzocca,\n67da57a8-4cd0-42b6-877c-59a90aaebda1,Andrew,Stokes,Orthopaedic Surgeon working in Regional New Zealand Centre with interests in Shoulder and Knee Surgery. Current President New Zealand Shoulder and Elbow Society. Senior Lecturer University of Auckland Medical School.\n67ea9c64-bae8-449d-b2cd-71640e447468,Su Cheol,Kim,\n6827700c-743c-48ee-b745-801cf994e7fe,Junta,Kikuchi,An orthopedic surgeon in Japan specializing in shoulder and upper extremity surgery\n682ccf97-3ccc-45dd-ac47-fb3ae51a7757,Shoib,Mahmood,\n6845a308-18af-4d82-be0b-80ec0dc75c55,Adriano,Mendes Jr.,\"Adriano Mendes Jr. is an Adjunct Professor in the Department of Surgery at the Federal University of Juiz de Fora (UFJF), Brazil, where he also serves as Head of the Department. He holds a PhD in Translational Surgery from UNIFESP and a Master\u2019s degree in Medical Sciences from UFF. As a member of the Brazilian Society of Orthopedics and Traumatology (SBOT), with an extensive background in Orthopedics and Traumatology, he completed his residency at FAMERP. He specialized in Shoulder and Elbow Surgery at Santa Casa de Misericordia - SP. His international experience includes visiting fellowships at the Mayo Clinic and the Shoulder Center of Kentucky. Currently, he is a member of the SBOT - National Continuing Education Committee (2026-2028) and the physician responsible for the Sports Trauma Clinic at HU-UFJF/EBSERH. He is an active member of ISAKOS and an international member of the AAOS.\"\n68c18c2d-3808-4580-acf8-9b0a1a559721,Nobuyasu,Ochiai,\n68ed49aa-4a23-4141-b2c2-6c6d8744c8fe,Saima,Waseem,\n6902f2c1-dc72-40a8-8458-82433014b763,Michael,Howell,\"Dr. Howell is a Professor of Neurology and Division Head of Sleep Medicine at the University of Minnesota and dedicated to developing novel strategies to improve brain function and sleep health. Dr. Howell's research interests include characterizing the relationship between poor sleep and neurological disorders, and determining whether improving sleep can prevent neurodegenerative disorders such as Parkinson's and Alzheimer's disease. His research is funded by the National Institutes of Health, industry and the Department of Defense. Additionally, he co-founded the Sleep Performance Institute to assist Professional, Olympic and Collegiate sports teams improve their performance through sleep coaching and circadian training.\"\n693769a0-9a62-45de-9770-0c5964857e8b,Rodrigo,Beraldo,\"Specialist in Shoulder and Elbow Surgery from IOT-HCFMUSP. Master's and Doctorate degrees from IOT-HCFMUSP. Currently an attending physician in the Shoulder and Elbow Group at IOT-HCFMUSP and the Shoulder and Elbow Group at IJOT. Has experience in the field of Medicine, with an emphasis on Shoulder and Elbow Surgery.\"\n6a3249e7-d6e5-4c8e-a7e3-ff2ed108caf9,Joan,Miquel,\n6a3ebe60-ac84-4874-a965-b7f58f45f20a,Jae-Sung,Park,\n6a53f15d-e307-4eb9-adbc-3e3cba37a20d,DongKi,Lee,\n6a8a1ac7-896a-4fb5-975e-872503f9f38d,JUNG-YOUN,KIM,\n6ad7e777-c08d-462b-8f98-5a6af5858ee7,Olivia,Blaber,\n6aee51e6-d4c1-44ec-8268-2963af88d1b7,JeongWoo,KIM,\"President, Korean Shoulder and Elbow Society (KSES)Professor, Department of Orthopaedic Surgery, Wonkwang University Hospital (2005\u2013Present)\"\n6b1f71a2-26d3-4233-9fae-5537eb06ac06,Vahid,Entezari,\n6b2dd1c4-29c8-42e6-a569-203ab6f197b6,Eugene,Brabston,\n6b508777-9350-452f-be94-38071cd29370,Sierra,Levene,Sierra is is a PGY3 orthopedic surgery resident at the University of Utah. She earned her medical degree from the University of Washington School of Medicine and completed her undergraduate studies at Dartmouth College.\n6b9682de-0e9a-44b9-beab-09e191ae8acf,David,Endell,\n6bb55470-d2b6-451d-ae01-ff47bc329354,Nadia,Gill,\n6bff6f6e-77cd-44e1-8de8-e0304a4f931d,Derrick,Guo,\n6c7fb1ea-143b-46a7-8342-a0ec3d683dd0,Sae Hoon,Kim,\n6d87f6b2-48ea-410e-85ad-ac6b0a1cbf7f,SEOW HUI,TEO,\n6d8cf0dc-b439-4207-a95d-2db48d52b5a6,Kevin,Hildebrand,\"Department Head, Surgery University of Calgary. Specializing in disorders of the elbow and wrist. Research interests in post-traumatic joint contractures from preclinical to randomized clinical trials.\"\n6d9b078b-8c82-4dc2-b627-5a0d68a7f5e2,Sanghyeon,Lee,Orthopedic surgeon\n6dacce32-e2e1-4fb5-9c6a-c141a6158b40,Jules-Nikolaus,Rippke,\n6db0b29a-e289-46d0-9537-c87ee41a1f5a,Maika,Yamamoto,phisician\n6e039833-0e7c-484e-902d-97e55a4d02c7,Ahmed,Abdelaziz,\n6e1bf2fe-4b22-477a-8b64-ad7ee4265d34,Joo-Han,Oh,\n6ed83fa4-17af-43d6-9226-c960665d5afc,Yasuhiro,Mitsui,\n6ef4d607-93b6-45f7-98f1-e2e7992801cf,JuanJose,Lecaros,\n6f2bdef5-b479-4b34-b538-f1f8bc470562,Heedong,Lee,\n6f3063a2-563e-4535-8efa-07276ad71207,Mark,Dillon,\n70fade58-4252-4780-9103-77c11c1d5fa7,deepthi nandan,adla,\n719540a7-3f1d-46a8-84e6-88bcd762ee66,Andrea,Celli,\n71f4169b-4614-47ac-b17b-dc5c4c81931e,Ausberto,Velasquez Garcia,\n721f10c1-5464-4856-83b0-68405ae9f325,Kemble,Wang,\"Kemble Wang is a pediatric and adult upper extremity surgeon based in Melbourne, Australia. He works at the Royal Children's Hospital and Box Hill Hospital. He has particular subspecialty interest in pediatric elbow and shoulder reconstruction for congenital and post-traumatic sequelae\"\n723441c8-34f1-45b0-ba08-fd8786f8ca16,Jeffrey,Pike,\"Dr. Jeffrey Pike is an orthopaedic surgeon with subspecialty training in wrist, elbow, and shoulder surgery- adult and pediatric. He is a Clinical Professor in the Department of Orthopaedics at the University of British Columbia, and on active medical staff at St. Paul\u2019s Hospital and BC Children's Hospital.Dr. Pike completed both his medical degree and orthopedic surgery residency at the University of British Columbia. He subsequently completed a Master of Public Health degree at Harvard University and two clinical fellowships in upper extremity surgery at the Hand and Upper Limb Center in London, Ontario and Washington University in St. Louis. Most recently he completed an MBA in Health Care and Life Sciences at the Rotman School, University of Toronto.\"\n7343e2a6-5f9e-4c38-b199-4345fc6019fa,Federico,Alfano,\n73873c6f-e1e6-4db7-be9c-66381c9f022d,Yota,Kin,\n73cec5bd-deb2-4651-aa5d-0ad88d4f14ee,Joo Han,Oh,\"Professor, Dept. of Orthopedic Surg, Seoul National University College of MedicineFormer Chairman, Dept. of Orthopedic Surg, Seoul National University Bundang Hospital Chairman, Board of the Directors, The Korean Orthopaedic AssociationPresident, The Korean Orthopaedic Ultrasound SocietyFormer President, The Korean Shoulder and Elbow Society (2019. 4 ~ 2021. 3) Former President, The Korean Arthroscopy Association (2024. 10 ~ 2025. 10)Secretary General, 2016 13th International Congress of Shoulder Elbow SurgeonsNational Academy of Medicine of Korea, Active member since 2020. 1. 10Chairman of Medical Advisory CommitteeKorean Baseball OrganizationKorean Skating Organization Corresponding member of the Development Commission, FIMS (F\u00e9d\u00e9ration Internationale de M\u00e9decine du Sport, International Federation of Sports Medicine) since 2019Vice President and Executive member, AFSM (Asian Federation of Sports Medicine) since 2023. 01Board Member, APKASS (Asia-Pacific Knee, Arthroscopy and Sports Medicine Society since 2023. 06Basic Science Editor of JSESEditorial Board of AJSM Winner of 2013 & 2025 Charles S Neer Award by American Shoulder Elbow Surgeons NIRA Winner in 2016 Orthopaedic Research Society Award Winners for Excellence in Basic Science Research by Arthroscopy: The Journal of Arthroscopic and Related Surgery More than 240 SCI papers as a first / corresponding author17 Books as a main author or co-author or chapter author\"\n73faba7d-4b7b-42a5-8665-dd5e35c79918,Nicholas,Morriss,\n7448d926-522f-4931-af5f-ddfa42b6f3a1,Paul,Favorito,\"Dr. Favorito is the Division Chief of the Shoulder and Upper Extremity Service at The Christ Hospital in Cincinnati, Ohio USA. He also serves as a co-director at the ASES accredited Cincinnati Shoulder and Elbow fellowship.A native of Buffalo, NY, he completed an orthopedic surgery residency at the State University of New York at Buffalo. In 1999, he moved to Cincinnati, Ohio where he completed a sports medicine fellowship at Wellington Orthopaedic and Sports Medicine and the University of Cincinnati. Dr. Favorito\u2019s practice is limited to the treatment of all shoulder disorders. He has a special interest in the diagnosis and treatment of rotator cuff disorders, proximal humerus fractures, shoulder replacements and bone loss associated with glenohumeral instability and arthritis.\"\n746ad9a9-074f-48cc-b7d7-7360415b26a7,Christopher,Brusalis,\n7497301c-8d92-4ee5-bec2-abed370a0628,Ivan,Encalada,\n76da1269-d14b-486e-bbff-fdc83ba10cbf,Joey,Pipicelli,\"Joey Pipicelli is a Hand Therapist at the Roth | McFarlane Hand and Upper Limb Centre in London, Ontario, Canada. He is the Coordinator of the Chinchalkar Hand Therapy Fellowship, a lecturer at Western University, and the current President of the Canadian Society of Hand Therapists. Joey is dedicated to advancing hand therapy through clinical practice, education, mentorship, and interdisciplinary training of future healthcare professionals.\"\n775479af-9014-45d5-bac2-7eb10fdea659,Joseph,Galvin,\"Dr. Galvin is a shoulder and elbow surgeon at the University of Iowa Hospitals and Clinics in Iowa City, IA. He is an active member of the American Shoulder and Elbow Surgeons (ASES).\"\n77c21448-df91-44aa-a005-b4a2ed42694e,Matthew,Nakouzi,\n78292691-6517-4576-b60d-407741db5d01,Leon,Rajah,\"1. President, African Shoulder & Elbow Society2. Orthopaedic Surgeon, Durban, South Africa\"\n78833cc4-fff8-4ced-af79-b30343f552ce,Joao,Bonadiman,\"Shoulder and Elbow Surgeon based on Passo Fundo, Brazil\"\n788b5e43-e89a-4225-bf7f-91958ce72ff4,Nicolas,Moran,Orthopedic SurgeonShoulder and Elbow Surgeries\n79280563-446b-4e77-906b-0582ffeca464,Burhan,Mirza,\n79d913f5-3bd9-403e-bf0c-35d3ff9e7871,Josue Giovanni,Escutia-Garcia,Shoulder and elbow surgeonMexico\n7ad094d3-f1f8-4919-9158-e8a7d568828d,Juan,Aguilar,\n7b38c8d6-6079-4abc-99d2-2729b5155ec3,Osvandre,Lech,\"Chief, Shoulder and Elbow Service, IOT-HSVP-UFFS, Passo Fundo, Brazil5th Chair, IBSES\"\n7bb830e6-296d-406b-9630-aa43e8213d68,Jong hun,Ji,Catholic university of Korea. professor\n7c15f573-af0f-44cd-89d5-f584d4588f69,Jagwant,Singh,\"Mr. Jagwant Singh is a fellowship-trained shoulder and elbow surgeon and holds clinical appointment at the Lewisham and Greenwich NHS Trust, London UK . Alongside his clinical practice, he is actively involved in medical education and clinical research, serving as an honorary nenior lecturer at King\u2019s College London.Jagwant contributes to the development of surgical standards and education through his work with the European Society for Surgery of the Shoulder and the Elbow (SECEC). He is an elected member of the SECEC Executive Council, Chair of the SECEC Healthcare Delivery Committee, and serves as an examiner for the SECEC European Board Exams. He is also an elected member of the American Shoulder and Elbow Surgeons (ASES).His academic contributions have been recognized with the John Charnley Gold Medal, Freeman Prize and the British Shoulder and Elbow Society (BESS) North American Travelling Fellowship.\"\n7c26a907-9af9-44cc-b8dc-da441a842e65,Francisco,Cruz Lopez,\n7c960594-f797-4684-83df-40fa78516f70,Patrick,Connor,\n7cb80f87-9339-46f9-93e1-e48c0bcc4dbf,Bradford,Parsons,\n7d1e62ce-de17-4c4f-a8da-7e4301a2779c,James,Fitzsimmons,\"Jim Fitzsimmons is an Assistant Professor of Orthopedics and manages both the Elbow and Shoulder Research Program under the Direction of Shawn W. O'Driscoll, M.D., Ph.D. and the Biomechanics Core Facility under the direction of Chunfeng Zhao, M.D respectively. He has focused the latter half of his 3-decade career on Elbow and Biomechanics research. He serves as co-principal investigator on numerous clinical research studies alongside Dr. O\u2019Driscoll which have included a prospective clinical randomized trial comparing the success of the post-operative application of continuous passive motion versus physical therapy following elbow contracture release surgery. Jim has developed new methods for data acquisition and analysis for ongoing laboratory studies, and presents his team\u2019s research findings both nationally and internationally. He has co-authored more than 90 peer-reviewed publications and 220 abstracts, and mentors research fellows, trainees and students in the lab. He serves on the editorial board of Clinics in Shoulder and Elbow and has serves as a peer reviewer on numerous other journals. Jim received a Bachelor of Science degree from the University of Toronto in 1991, his Mayo Clinic College of Medicine and Medical Science Assistant Professor appointment in 2010 and was appointed as an Associate in the Mayo Clinic Department of Orthopedics in 2017. He is an Associate Member of the Global Elbow Network and serves as the Deputy Chair of their Logistics Committee.\"\n7d6cd665-bd3e-42c3-bb76-b71df2c4ce6c,Jiong,Yu,\n7d795283-3ae1-4d21-99bd-b04842820d78,Mohammad,Haddara,\"Dr. Mohammad Haddara is a biomedical engineer and Senior Research Fellow at the Macquarie University Translational Orthopaedic Research (TOR) Laboratory in Sydney, Australia. His research focuses on orthopaedic biomechanics, particularly shoulder joint mechanics, muscle loading, implant stability, and cadaveric simulation. He specializes in the development and use of advanced ex vivo simulators to investigate the effects of surgical interventions, implant positioning, and soft tissue deficiencies on joint kinematics and biomechanics. His work integrates motion tracking, muscle force analysis, strain measurement, and computational modelling to improve surgical planning and patient outcomes in orthopaedics.\"\n7d95a45a-dc99-444a-b53b-b3a607e6f277,Chang Hee,Baek,\"EDUCATION1985 \u2013 1991M.D., Chonbuk National University Medical School, Jeonju-si, Republic of Korea1991 \u2013 1995Orthopaedic Surgery, Kyung Hee University Medical Center, Seoul, Republic of Korea2008Seoul National University Hospital Advanced Healthcare Management ProgramLICENSURE / BOARD CERTIFICATION1992Medical License, Republic of Korea1996The Korean Orthopaedic Association Board Certification, Republic of KoreaPROFESSIONAL EXPERIENCES1999 \u2013 2005Orthopaedic Surgeon, Baek Chang Hee Clinic, Yeosu-si, Republic of Korea2005 \u2013 presentDirector, Yeosu Baek Hospital, Yeosu-si, Republic of KoreaPROFESSIONAL MEMBERSHIP1996The Korean Orthopaedic Association1996Korean Arthroscopy Society1996The Korean Society of Sports Medicine2006The Korean Shoulder & Elbow Society\"\n7dfb8425-f4ab-4731-9209-41ac2e59abcc,Georgios,Eleftherakis,\"10/2014 to 06/2021: Medical Studies at Faculty of Medicine at Ulm University 09/2021 to 09/2024: Resident Physician for Orthopedic/Trauma Surgery at University Hospital T\u00fcbingen 01/2023: Obtaining a doctoral degree09/2024 until today: Resident Physician for Orthopedic/Trauma Surgery at Orthopedic Department Paulinenhilfe, Diakonie Klinikum Stuttgart\"\n7e5cc7cb-faa0-4704-8bc2-11bcf9dc143a,Simon,MacLean,\"Mr Simon MacLean is a Consultant Orthopaedic and Upper Limb Surgeon based in Tauranga, New Zealand, and holds an Honorary Senior Lectureship at the University of Auckland. His clinical expertise includes elbow trauma, wrist instability, advanced arthroscopy, and complex reconstructive procedures. He has a research interest and is an active contributor to international orthopaedic societies, serving in leadership roles within Asia-Pacific organisations and as a founding member of the Global Elbow Network.\"\n7ee1e615-7b71-4e4b-b652-35fdedc16178,Michael,Knudsen,\n7fe01d05-dec5-4c6f-b3a0-29216ac895b8,Matthijs,Jacxsens,\n8048799d-316c-4561-9e1a-5da5d7c46ab0,J. Whitcomb,Pollock,\n80757d16-f4d1-48ae-8286-1c08e1de05ed,Yusuke,Kobayashi,\n80c1efcb-f53f-47b4-9521-ec443ecfd0db,Sang Yun,Oh,\n80d3a495-3f4a-4131-bd4a-75601d1f06e8,Alan,Reynolds,\n821cc904-58b6-40c4-b5b2-2a0025b7c1b8,Michael,Caughey,Michael Caughey is a New Zealand trained shoulder surgeon who undertook fellowship training at the Orthopaedic and Arthritic Hospital in Toronto and the Nuffield Orthopaedic Centre in Oxford. He has practised as a consultant in Auckland for 35 years initially at Middlemore and in the private sector and subsequently in private practice retaining a teaching role with Auckland University. He is a past president of the New Zealand Shoulder and Elbow Society and was instrumental in setting up the NZ Rotator Cuff Registry\n823d1d30-dc5c-4116-b0f9-35cb08670b97,William,Aibinder,\"William Aibinder is an associate professor of orthopedic surgery at the University of Michigan. He specializes in shoulder & elbow surgery. He completed his residency training at the Mayo Clinic, followed by fellowship at the Roth|McFarlane Hand and Upper Limb Center at the University of Western Ontario in London, Ontario. He is extensive involved in research and education, serving as the co-director of the Sports Medicine & Shoulder Surgery Fellowships as well as the Medical Student Clerkship director.\"\n833f5b77-2efe-4bbb-9fab-3536d8ea9c06,Natalie,Loewen,\n834b72dc-b040-462d-a6bd-53a892be2ef9,Raman,Aggarwal,\n835af4d6-7ed2-45af-9bab-d607464eb3fc,Shawn,O'Driscoll,\"Shawn O\u2019Driscoll is Professor of Orthopedic Surgery at the Mayo Clinic in Rochester, Minnesota, USA and President & Founding Member of the Global Elbow Network, a professional organization of over 800 elbow professionals from over 70 countries dedicated to advancing elbow care worldwide. He was the Founder and Course Director of the Mayo Clinic, \u201cTeach the Teachers\u201d Advanced Surgical Skills Elbow Course for 23 years, and continues to direct his elbow-focused basic science and clinical research program.\"\n8399c1fb-5a6a-45d1-b16f-da4eeb2d75bb,jieun,kwon,\n83bb1149-f20e-47e4-bc56-b90a462d26b2,Takeshi,Imai,\n83f547cf-ea39-4392-802b-72bfa82e529e,Emilio,Calvo,\n84c23df8-3a0a-4db6-aae1-62162c5c2882,Benjamin,Cass,\n853cedee-e0c8-4da2-9a90-a89718e439b7,Peter,Domos,\"He is a double-fellowship trained (United Kingdom and France) Consultant Trauma and Orthopaedic Surgeon at the Royal Free London NHS Foundation Trust in London, providing full comprehensive shoulder and elbow services for degenerative disorders, sport injuries and complex trauma. He also works within an award-winning group structure at Total Orthopaedics London and at Fortius Clinic London, that exists to provide a multi-specialty service, with the benefits of collaborative and innovative working.He is an active British Elbow and Shoulder Society (BESS), European Society for Shoulder and Elbow Surgery (SECEC/ESSSE-including elected Committee member) and American Shoulder and Elbow Society (ASES) member. He regularly attends and teaches (as Faculty member) at national and international courses, to keep his knowledge and skills up-to-date and has several publications in peer-review journals, book chapters and annual presentations at various scientific meetings.He is one of the founding members of the new Bankart Shoulder Society (BSS), which aims to champion the innovation, expertise, and contributions of British shoulder surgeons on the international stage.\"\n8548fd9c-2afd-45dc-b7c8-29f91bf45822,Lewis,Shi,\n85df7641-7509-4bac-8664-7064524a6805,Fraser,Taylor,\n86288a69-b993-4444-9e96-19acad0d4302,Georgios,Mamarelis,\n8658de9f-f6bc-444f-ac4a-030ce1059444,Jan-Philipp,Imiolczyk,\n86a208a0-018c-4492-9a5e-4c9a36287b62,Christian,Lozano,\n87057891-8c3a-45ee-aef0-127ca4ba2891,Russell,Edafetanure-Ibeh,\n871a1263-7324-4af5-83ad-0a848d041e8b,Hanseok,Ko,\n8746c590-38cc-4fff-8f71-a318df98faf0,Ram,Chidambaram,\n8847c9ab-a53c-4c48-bcdb-9f99c8f9c624,John,Itamura,\n884acbef-7094-4c7f-b34f-a034bd5007b5,Eric,Cal,\n889c04dd-d099-4a23-b5ce-f27c13c8fe21,Michael,O'Brien,\"Dr. Michael O\u2019Brien is a Professor of Clinical Orthopaedics at Tulane University, and the Residency Program Director for the Tulane Orthopaedic Surgery Residency Program. He joined the Tulane Department of Orthopaedics in 2009, after completing his Orthopaedic Surgery residency at the University of Maryland in Baltimore, MD, and Shoulder & Elbow fellowship at the Rothman Institute at Thomas Jefferson University in Philadelphia, PA.He is an Active Member of the American Shoulder & Elbow Surgeons (ASES), the Arthroscopy Association of North America (AANA), the American Orthopaedic Society for Sports Medicine (AOSSM), and the Association of Clinical Elbow and Shoulder Surgeons (ACESS). He serves on the Board of Directors for AANA and the Southern Orthopaedic Association. He is a team physician for Tulane University athletics and Brother Martin high school in New Orleans. He treats all conditions in the shoulder and elbow. He lectures and teaches courses nationally and internationally and has published numerous articles on shoulder and elbow topics. He lives in New Orleans with his wife and two daughters.\"\n88cb8517-767c-48fd-987b-28fafcb79859,Yoichi,Ito,\n89cb8b54-616b-418d-9343-043cc65c2686,Alberto,Rivera Rosado,\"Fellow 2009-2010 Plancher Orthopedics and Sports Medicine, Past President Puerto Rico Orthopedic Society, Founder and Past President Puerto Rico Shoulder and Elbow Society, Associate Professor Ponce School of Medicine, 1st Vice- President Latin American Shoulder and Elbow Society\"\n8a1782f9-f1ac-40d0-a82e-5d4155ce0ff0,Hui,Zhang,\n8a1daf0c-fb6f-4bb1-9bdb-a650ef33ec60,William,Mallon,\n8a6a5b3f-8271-498a-a912-a7edd44046f8,Saad,Alqahtani,\n8a810f37-7489-4907-b140-c1fce7d0f385,Jun,Kawakami,\n8afb1153-95fc-41e0-9e59-3242d41b2ae8,Evan,Bailey,PGY-4 Orthopaedic surgery resident at Emory University School of Medicine\n8b252652-c3a0-450b-81a1-2e3d108d4cf2,Marc,Hirner,Shoulder surgeon with special interest in biomechanics and artificial intelligence\n8c328ea7-1ff8-4191-a376-bdcbcc0f90ec,Grace,Knoer,\n8c4161cd-c2d8-42cd-881f-3dd24a5b9e83,Nobuyuki,Yamamoto,\"He graduated Sapporo Medical University School of Medicine in 1995. Clinical fellow in Akita Univ in 2002-2006. Research fellow in Mayo clinic in 2007-2009. Professor in Department of Sports Medicine and Reconstruction of Motion Function, Tohoku University School of Medicine since 2025. Specialty: shoulder joint and Musculoskeletal Ultrasound. He has won numerous awards (25 awards) including JSS Takagishi award (2006), AAOS best poster (2009), SECEC best poster (2009), JSES Neviaser award (2021). Publication: 158 original articles, 75 books/book chapters, 125 forum/lecture. Committee appointment: JOSKAS delegate, APKASS board of director, ASEA secretary general, ASES corresponding member, East Japan Orthopaedic Association delegate, Shoulder arthroscopic meeting delegate, Sendai shoulder association secretariat\"\n8c63dc66-7cd5-43d2-8b42-135fe33d303b,Andrew,Valiquette,\n8cbed412-3f68-4e92-9ad7-347e494ab7ce,Kerem,Bilsel,\n8d375b90-2f16-48b5-8a94-59149f68bd53,Ashish,Gupta,\n8d8d2511-fe94-47d1-8f13-cbeae2fa210d,Akash,Singh,\n8e0bf49c-3902-4930-9b85-1c8b347cfe54,Dries,Boulidam,\n8e236a2f-e4f1-4a81-a638-f44e2a949b5e,Emilio,Calvo,\"Emilio Calvo is the Director of the Department of Orthopedic Surgery and Traumatology and Professor of Orthopedics at the Fundaci\u00f3n Jimenez Diaz, a teaching hospital affiliated to the Aut\u00f3noma University of Madrid (Spain). He is also the director of the Shoulder and Elbow Felloship Program. After terminating his residency, he completed a fellowship in Sports Medicine at Beth Israel Medical Center in New York. Currently, and since 1998, he is in charge of the Shoulder and Elbow Reconstructive Surgery Unit. During his tenure, new and innovated techniques have been introduced, like complex prosthetic procedures and arthroscopic Latarjet or arthroscopic treatment of proximal humeral malunions. In addition, a number of research projects in shoulder surgery have been initiated and developed. The main topics his research is focused to are shoulder instability, rotator cuff tear repair, shoulder arthroplasty, and reconstruction of complex proximal fractures and their complications. Numerous communications to national and international meetings have been presented, more than 40 books and book chapters, and more than 150 publications in peer-reviewed journals have been published. He has also been part of the faculty of prestigious shoulder meetings in Europe and America.Emilio Calvo is also an active member of national and international scientific societies, like the European Society for Surgery of the Shoulder and Elbow (ESSSE), the American Shoulder and Elbow Surgeons (ASES), the European Society for Sports, Knee and Arthroscopy (ESSKA), and the International Society of Arthroscopy, Knee Surgery and Orthopaedic Sports Medicine (ISAKOS). He has been President of the European Society for Surgery of the Shoulder and Elbow (ESSSE) and is currently the Past Deputy Chair of the Shoulder Committee of the International Society of Arthroscopy, Knee Surgery and Orthopaedic Sports Medicine (ISAKOS). He has been the President of the 22nd Meeting of the European Society for Surgery of the Shoulder and Elbow, and the President of the 2013 European Society for Surgery of the Shoulder and Elbow Closed Meeting hold in Madrid on September 2009 and 2013.\"\n8e415980-fb17-40c3-9622-9f0791dfce4f,Brian,Feeley,\n8e537865-2525-460a-9784-b37257b136ce,Kengo,Kirimura,\n8e593333-0d4a-41b1-b59e-f4501740d46a,Gavin,Ward,\"Gavin H. Ward received his Bachelor of Arts in Chemistry from Vanderbilt University in 2020 and earned his Doctor of Medicine degree with Distinction in Research from St. George\u2019s University School of Medicine in 2026. He completed a one-year Orthopaedic Sports Medicine Research Fellowship at Mayo Clinic from 2024-2025 and is currently an Orthopaedic Spine Surgery Research Fellow at Emory University for 2026-2027. Since 2023, he has also conducted research on musculoskeletal injuries in astronauts in collaboration with Space Medicine Operations, NASA Johnson Space Center.\"\n8e6e5954-738d-416a-ab1c-d4b10ca4f7ce,Moataz,El Deeb,I am lecturer and consultant of orthopedic surgery in faculty of medicine azhar university\n8e8dad91-d86f-4ee8-a982-ded19717e78f,Danny,Goel,\n8f182f4c-7a51-4590-93ed-8ff211da8a07,Naoko,Mizuno,\n8f60b863-6428-40cd-a954-738c8b6d4f0a,Samuel,Mircoff,\n8fea2933-5b57-4c6b-8723-e93ccb884197,Frances,Cuomo,\n90072c15-449c-4ffc-b121-698fc0c8481b,Amir,Kachooei,\"Amir R. Kachooei, MD, PhD, is an orthopedic elbow, and hand surgeon. After completing his orthopedic residency at Mashhad University of Medical Sciences in Iran, he served as a research fellow in hand and elbow surgery at Massachusetts General Hospital, Harvard Medical School. He earned a clinical PhD in Elbow Surgery at the University of Amsterdam, The Netherlands where he also mastered in Elbow Arthroscopy and Arthroplasty Surgery. Dr. Kachooei is the Associate Director of Hand and Elbow Research at Rothman Orthopaedics Florida and is an Associate Professor at the University of Central Florida. His extensive research has led to nine patents, more than 180 peer-reviewed articles, five books and book chapters and more than 200 oral and poster presentations. He has served as the Deputy Editor-in-Chief of the Archives of Bone and Joint Surgery since 2013, and Editor-in-Chief of SurgiColl Journal.\"\n9025b94d-adb0-4347-aaf7-2f48fc52a752,Yoichi,Horike,\n9031facc-d065-4baf-ab28-9ed50d0ce3c0,Yi,Lu,Shoulder and elbow surgeon working in Beijing\n907a3616-b9da-4908-93ee-9f9da724c3ff,Xunqi,Cheow,\"Dr Cheow Xunqi is a Consultant Orthopaedic Surgeon and the Sports Surgery Service Lead at the Department of Orthopaedic Surgery, Sengkang General Hospital. Dr Cheow graduated from the NUS Yong Loo Lin School of Medicine with an MBBS in 2011 and was awarded the Meritorious House Officer Award in 2012 for his outstanding performance. He commenced his Orthopaedic Surgery specialist training in 2016 and was awarded the Outstanding Resident Award in 2018 for exemplary academic and clinical performance. He was appointed Chief Resident in 2021 and completed the Singapore Chief Residency Programme in 2022, subsequently attaining the FRCSEd (Ortho) in the same year. In 2025, Dr Cheow completed his fellowship in Sports Surgery and Upper Limb Trauma at the renowned Sporthopaedicum Regensburg, Germany \u2013 a FIFA Medical Centre of Excellence \u2013 under the SingHealth Health Manpower Development Plan scholarship. During his fellowship, he specialised in shoulder, elbow, and knee surgery and trained under world-renowned surgeons, including Prof. Andreas Voss, Prof. Stefan Greiner, Prof. Peter Angele, and Prof. Johannes Zellner. Committed to both undergraduate and postgraduate education, Dr Cheow contributes actively as faculty in surgical training courses, imparting his expertise in shoulder and knee arthroscopy to junior surgeons. He also serves as a Clinical Core Faculty Member for the SingHealth Postgraduate Year 1 Programme and as an Assistant Convenor for the NUS Yong Loo Lin
