<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#8C191B">
  <title>Scientific Program | ICSES 2026</title>
  <meta name="description" content="Scientific program for the 16th International Congress on Shoulder and Elbow Surgery, September 22–25, 2026, Vancouver.">
  <style>
:root {
  --earth: #a74424;
  --mint: #67c18c;
  --teal: #4bb3a6;
  --burgundy: #8c191b;
  --ink: #231f20;
  --blue: #2f628c;
  --yellow: #e3b54a;
  --paper: #f6f1eb;
  --card: #ffffff;
  --line: #e3d6cc;
  --muted: #6a5d57;
  --soft: #fbf8f5;
  --focus: #4bb3a6;
  --danger: #8c191b;
  --radius: 6px;
  --header-offset: 0px;
  --max: 1080px;
}

*,
*::before,
*::after { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  color: var(--ink);
  background: var(--paper);
  font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
  font-size: 16px;
  line-height: 1.45;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

img { max-width: 100%; height: auto; }

button,
input,
select {
  font: inherit;
  color: inherit;
}

a {
  color: var(--burgundy);
}

a:hover { color: var(--earth); }

:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 2px;
}

.skip-link {
  position: absolute;
  left: 12px;
  top: -40px;
  z-index: 30;
  background: var(--ink);
  color: #fff;
  padding: 8px 12px;
}

.skip-link:focus { top: 12px; }

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.wrap {
  width: min(100% - 32px, var(--max));
  margin-inline: auto;
}

.site-header {
  background: var(--card);
}

.header-inner {
  display: grid;
  gap: 16px;
  padding: 18px 0 16px;
}

.logo-link {
  display: block;
  max-width: 520px;
}

.logo {
  display: block;
  width: min(100%, 520px);
  height: auto;
}

.header-copy h1 {
  margin: 0;
  font-size: clamp(1.45rem, 4vw, 2rem);
  font-weight: 650;
  letter-spacing: -0.02em;
  line-height: 1.15;
}

.eyebrow,
.subhead,
.site-link {
  margin: 0;
  color: var(--muted);
  font-size: 0.92rem;
}

.eyebrow {
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-size: 0.72rem;
  font-weight: 700;
  color: var(--burgundy);
  margin-bottom: 6px;
}

.subhead { margin-top: 4px; }

.site-link {
  display: inline-block;
  margin-top: 10px;
  font-weight: 600;
  text-underline-offset: 3px;
}

.brand-bar {
  display: grid;
  grid-template-columns: 18% 22% 20% 20% 20%;
  height: 6px;
}

.brand-bar span:nth-child(1) { background: var(--ink); }
.brand-bar span:nth-child(2) { background: var(--burgundy); }
.brand-bar span:nth-child(3) { background: var(--earth); }
.brand-bar span:nth-child(4) { background: var(--teal); }
.brand-bar span:nth-child(5) { background: var(--mint); }

.toolbar {
  position: sticky;
  top: 0;
  z-index: 8;
  background: rgba(246, 241, 235, 0.94);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
  padding: 12px 0 10px;
}

.search-form input {
  width: 100%;
  min-height: 48px;
  padding: 12px 14px;
  border: 1px solid #cbbfb4;
  border-radius: var(--radius);
  background: var(--card);
}

.filter-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px 14px;
  margin-top: 10px;
}

.filter-label,
.filter-label select {
  min-height: 44px;
}

.filter-label select {
  min-width: min(100%, 180px);
  max-width: 100%;
  padding: 8px 12px;
  border: 1px solid #cbbfb4;
  border-radius: var(--radius);
  background: var(--card);
}

.text-btn,
.ghost-btn,
.primary-btn,
.icon-btn,
.abs-btn,
.cal-menu button,
.cal-menu a {
  min-height: 44px;
  min-width: 44px;
}

.text-btn {
  border: 0;
  background: none;
  color: var(--burgundy);
  font-weight: 700;
  padding: 8px 4px;
  cursor: pointer;
  text-decoration: underline;
  text-underline-offset: 3px;
}

.load-status {
  margin: 0 0 0 auto;
  color: var(--muted);
  font-size: 0.82rem;
}

.days {
  display: flex;
  flex-wrap: wrap;
  gap: 0;
  margin-top: 8px;
  overflow: visible;
}

.day {
  appearance: none;
  flex: 0 0 auto;
  border: 0;
  background: transparent;
  border-bottom: 3px solid transparent;
  padding: 10px 12px;
  min-height: 44px;
  cursor: pointer;
  font-weight: 650;
  color: var(--muted);
  white-space: nowrap;
}

.day.active {
  color: var(--ink);
  border-bottom-color: var(--burgundy);
}

.day[aria-pressed="true"] {
  color: var(--ink);
  border-bottom-color: var(--burgundy);
}

.programme { padding: 18px 0 64px; }

.backup-note,
.view-note,
.summary,
.empty {
  color: var(--muted);
}

.backup-note {
  background: #f4ebe3;
  border: 1px solid var(--line);
  padding: 10px 12px;
  border-radius: var(--radius);
  margin-bottom: 14px;
  color: var(--ink);
  font-size: 0.92rem;
}

.view-note {
  margin: 0 0 12px;
  font-size: 0.92rem;
}

.summary { margin: 0 0 14px; font-size: 0.92rem; }

.loading {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  padding: 64px 16px;
  color: var(--muted);
}

.loading[hidden] {
  display: none !important;
}

.loading-mark {
  width: 42px;
  height: 42px;
  border: 3px solid var(--line);
  border-top-color: var(--burgundy);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

.session {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 8px;
  margin: 0 0 12px;
}

.session-feature-opening {
  border-color: #d4a8a3;
  box-shadow: inset 5px 0 0 var(--burgundy);
  background: linear-gradient(90deg, #efd0cd 0%, #f7e8e5 42%, #ffffff 100%);
}

.session-feature-closing {
  border-color: #d9b49f;
  box-shadow: inset 5px 0 0 var(--earth);
  background: linear-gradient(90deg, #f0d3c4 0%, #f8ebe3 42%, #ffffff 100%);
}

.session-feature-lecture {
  border-color: #d4a8a3;
  box-shadow: inset 5px 0 0 var(--burgundy);
  background: linear-gradient(90deg, #edd4cc 0%, #f7ebe6 42%, #ffffff 100%);
}

.session-feature-symposium {
  border-color: #9dcdc6;
  box-shadow: inset 5px 0 0 var(--teal);
  background: linear-gradient(90deg, #cceae4 0%, #e7f5f2 42%, #ffffff 100%);
}

.session-feature-opening h2,
.session-feature-closing h2,
.session-feature-lecture h2,
.session-feature-symposium h2 {
  font-weight: 750;
}

.feature-badge {
  display: inline-block;
  max-width: 100%;
  margin: 0;
  padding: 2px 8px;
  border-radius: 3px;
  font-size: 0.62rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  overflow-wrap: anywhere;
}

.session-feature-opening .feature-badge {
  background: var(--burgundy);
  color: #fff;
}

.session-feature-closing .feature-badge {
  background: var(--earth);
  color: #fff;
}

.session-feature-lecture .feature-badge {
  background: transparent;
  color: var(--burgundy);
  border: 1px solid var(--burgundy);
}

.session-feature-symposium .feature-badge {
  background: var(--teal);
  color: #231f20;
}

.session-head {
  width: 100%;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 8px 12px;
  padding: 16px;
  border: 0;
  background: transparent;
  text-align: left;
  cursor: pointer;
}

.session-time {
  font-weight: 750;
  font-size: 0.98rem;
  letter-spacing: 0.01em;
}

.session-when {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 2px;
}

.session-room {
  margin: 0;
  font-size: 0.82rem;
  font-weight: 650;
  color: var(--muted);
  line-height: 1.3;
}

.day-heading {
  margin: 22px 0 10px;
  font-size: 0.95rem;
  font-weight: 750;
  color: var(--ink);
}

.day-heading:first-child { margin-top: 4px; }

.session-kicker {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 4px;
  margin: 0 0 6px;
}

.session-type {
  display: block;
  margin: 0;
  font-size: 0.7rem;
  font-weight: 750;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--teal);
}

.session-type.type-icl { color: var(--burgundy); }
.session-type.type-symposium { color: var(--earth); }
.session-type.type-eposter { color: #2f7a58; }
.session-type.type-education { color: var(--teal); }
.session-type.type-break { color: var(--muted); }
.session-type.type-ceremony { color: var(--burgundy); }
.session-type.type-industry {
  display: inline-block;
  padding: 2px 7px;
  border-radius: 3px;
  background: var(--yellow);
  color: var(--ink);
  letter-spacing: 0.04em;
}
.session-type.type-special { color: var(--teal); }

.session-track {
  display: inline-block;
  margin: 0;
  padding: 2px 7px;
  border-radius: 3px;
  font-size: 0.65rem;
  font-weight: 750;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: #fff;
}

.track-elbow { background: var(--mint); color: var(--ink); }
.track-cuff,
.track-arthroplasty,
.track-instability,
.track-trauma,
.track-nerve,
.track-shoulder { background: var(--earth); color: #fff; }
.track-international { background: var(--blue); color: #fff; }
.track-basic { background: #231f20; }
.track-other { background: #231f20; }

.session h2 {
  margin: 0;
  font-size: 1.05rem;
  font-weight: 700;
  line-height: 1.3;
  overflow-wrap: anywhere;
}

.session-meta,
.chairs {
  margin: 6px 0 0;
  color: var(--muted);
  font-size: 0.9rem;
}

.session-desc-full {
  margin: 12px 0 0;
  color: var(--muted);
  font-size: 0.9rem;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

.session-desc-full p {
  margin: 0 0 0.55em;
}

.session-desc-full p:last-child {
  margin-bottom: 0;
}

.badges {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 8px;
}

.status-badge {
  display: inline-block;
  padding: 2px 7px;
  border-radius: 3px;
  font-size: 0.68rem;
  font-weight: 800;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  background: #efe6df;
  color: var(--earth);
}

.status-badge.now {
  background: var(--burgundy);
  color: #fff;
}

.chev {
  color: var(--muted);
  font-size: 1.2rem;
  line-height: 1;
  align-self: center;
  transition: transform 0.15s ease;
}

.session.open .chev { transform: rotate(180deg); }

.session-body {
  display: none;
  border-top: 1px solid var(--line);
  padding: 4px 16px 16px;
}

.session.open .session-body { display: block; }

.session-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 12px 0 8px;
}

.ghost-btn,
.primary-btn,
.abs-btn,
.cal-menu > button {
  appearance: none;
  border-radius: var(--radius);
  padding: 8px 12px;
  cursor: pointer;
  font-weight: 700;
}

.ghost-btn,
.cal-menu > button {
  border: 1px solid var(--burgundy);
  background: #fff;
  color: var(--burgundy);
}

.ghost-btn[aria-pressed="true"] {
  background: var(--burgundy);
  color: #fff;
}

.primary-btn {
  border: 1px solid var(--burgundy);
  background: var(--burgundy);
  color: #fff;
}

.abs-btn {
  border: 1px solid var(--teal);
  background: #fff;
  color: #1f6f66;
  white-space: nowrap;
}

.cal-menu {
  position: relative;
}

.cal-pop {
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  z-index: 4;
  min-width: 220px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 6px;
  display: none;
}

.cal-menu.open .cal-pop { display: grid; }

.cal-pop a,
.cal-pop button {
  display: block;
  width: 100%;
  text-align: left;
  border: 0;
  background: transparent;
  padding: 10px 12px;
  cursor: pointer;
  color: var(--ink);
  text-decoration: none;
  font-weight: 650;
}

.cal-pop a:hover,
.cal-pop button:hover { background: var(--soft); }

.presentation {
  display: grid;
  gap: 4px;
  padding: 14px 0;
  border-bottom: 1px solid #efe7e0;
}

.presentation:last-child { border-bottom: 0; }

.pres-time {
  font-weight: 750;
  font-size: 0.92rem;
}

.pres-title {
  font-weight: 700;
  font-size: 1.02rem;
  line-height: 1.35;
  overflow-wrap: anywhere;
}

.pres-num {
  font-weight: 750;
  white-space: nowrap;
}

.pres-code {
  color: var(--muted);
  font-size: 0.82rem;
}

.faculty {
  list-style: none;
  margin: 8px 0 0;
  padding: 0;
}

.faculty li {
  color: var(--muted);
  font-size: 0.95rem;
  line-height: 1.45;
  overflow-wrap: anywhere;
}

.person-link {
  appearance: none;
  border: 0;
  background: none;
  padding: 0;
  margin: 0;
  font: inherit;
  color: var(--burgundy);
  cursor: pointer;
  text-align: left;
  text-decoration: none;
  overflow-wrap: anywhere;
}

.person-link:hover,
.person-link:focus-visible {
  color: var(--earth);
  text-decoration: underline;
}

.chairs .person-link {
  color: var(--burgundy);
}

.role-label {
  display: block;
  margin-top: 8px;
  margin-bottom: 2px;
  font-size: 0.78rem;
  font-weight: 750;
  color: var(--burgundy);
}

.role-label:first-child { margin-top: 0; }

.pres-foot {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 8px;
}

.empty {
  text-align: center;
  padding: 48px 16px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 8px;
}

.empty h2 {
  margin: 0 0 8px;
  color: var(--ink);
}

.mark {
  background: #f3e0c8;
  color: inherit;
  padding: 0 0.1em;
}

.modal[hidden],
.lightbox[hidden] {
  display: none !important;
}

.modal,
.lightbox {
  position: fixed;
  inset: 0;
  z-index: 20;
  background: rgba(35, 31, 32, 0.55);
  overflow: auto;
  padding: 16px;
}

.modal-card {
  width: min(100%, 820px);
  margin: 24px auto;
  background: #fff;
  border-radius: 8px;
  padding: 24px 20px 28px;
  position: relative;
}

.modal-close {
  appearance: none;
  border: 0;
  background: transparent;
  position: absolute;
  top: 10px;
  right: 10px;
  min-height: 44px;
  min-width: 44px;
  cursor: pointer;
  font-weight: 700;
  color: var(--ink);
}

.abstract h2 {
  margin: 0 48px 10px 0;
  font-size: 1.35rem;
  line-height: 1.3;
}

.abstract-authors {
  color: var(--ink);
  margin: 0 0 14px;
  font-size: 0.95rem;
  line-height: 1.55;
  overflow-wrap: anywhere;
}

.abstract-authors b,
.abstract-authors strong {
  display: inline;
  font-size: inherit;
  margin: 0;
  font-weight: 700;
}

.abstract-authors p {
  margin: 0 0 0.35em;
}

.abstract-authors p:last-child {
  margin-bottom: 0;
}

.abstract-meta {
  color: var(--muted);
  margin-bottom: 18px;
}

.abstract-body { line-height: 1.6; }

.abstract-body b,
.abstract-body strong {
  display: block;
  margin-top: 1.2rem;
  margin-bottom: 0.3rem;
  font-size: 0.76rem;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--burgundy);
}

.abstract-body p { margin: 0 0 0.75rem; }

.abstract-body img {
  display: block;
  max-width: 100%;
  height: auto;
  margin: 16px auto;
  border: 1px solid var(--line);
  cursor: zoom-in;
}

.abstract-body table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.9rem;
}

.profile-top {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  align-items: flex-start;
  margin: 0 48px 8px 0;
}

.profile h2 {
  margin: 0;
  font-size: 1.35rem;
  line-height: 1.3;
  flex: 1 1 180px;
}

.profile-photo {
  display: block;
  width: min(100%, 160px);
  height: auto;
  object-fit: contain;
  object-position: top center;
  border-radius: 6px;
  background: var(--soft);
  border: 1px solid var(--line);
}

.profile-heading {
  margin: 18px 0 8px;
  font-size: 0.78rem;
  font-weight: 750;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--burgundy);
}

.profile-bio {
  color: var(--ink);
  font-size: 0.95rem;
  line-height: 1.55;
  overflow-wrap: anywhere;
}

.profile-appearances {
  list-style: none;
  margin: 0;
  padding: 0;
}

.profile-appearances li {
  margin: 0 0 8px;
}

.profile-appearance {
  appearance: none;
  width: 100%;
  display: grid;
  gap: 2px;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--soft);
  text-align: left;
  cursor: pointer;
  color: inherit;
}

.profile-appearance:hover,
.profile-appearance:focus-visible {
  border-color: var(--teal);
}

.profile-app-day,
.profile-app-time {
  color: var(--muted);
  font-size: 0.82rem;
  font-weight: 650;
}

.profile-app-session {
  font-weight: 700;
  overflow-wrap: anywhere;
}

.profile-app-talk {
  color: var(--muted);
  font-size: 0.92rem;
  overflow-wrap: anywhere;
}

.profile-app-role {
  margin-top: 4px;
  font-size: 0.72rem;
  font-weight: 750;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--burgundy);
}

.table-wrap { overflow-x: auto; }

.lightbox {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 48px 16px;
}

.lightbox img {
  max-width: min(100%, 1100px);
  max-height: 82vh;
  width: auto;
  height: auto;
  object-fit: contain;
  background: #fff;
}

.lightbox-caption {
  color: #fff;
  margin: 12px 0 0;
}

@media (min-width: 800px) {
  .header-inner {
    grid-template-columns: minmax(240px, 420px) 1fr;
    align-items: center;
    gap: 28px;
    padding: 22px 0 18px;
  }

  .session-head {
    grid-template-columns: 150px 1fr auto;
    align-items: start;
  }

  .session-when { grid-row: 1 / span 2; }

  .session h2 { font-size: 1.18rem; }

  .faculty-inline {
    display: block;
  }

  .faculty-inline li { display: inline; }
  .faculty-inline li:not(:last-child)::after {
    content: " · ";
    color: #b3a49a;
  }

  .presentation {
    grid-template-columns: 150px 1fr auto;
    gap: 8px 16px;
    align-items: start;
  }

  .pres-time { grid-row: 1 / span 3; }
}

@media (max-width: 430px) {
  .wrap { width: min(100% - 24px, var(--max)); }
  .header-copy h1 { font-size: 1.4rem; }
}

</style>
</head>
<body>
  <a class="skip-link" href="#programme">Skip to program</a>

  <header class="site-header">
    <div class="wrap header-inner">
      <a class="logo-link" href="https://icses2026.org/" rel="noopener noreferrer">

  <script>window.ICSES_BACKUP_SPEAKERS_CSV="PersonKey,Account.FirstName,Account.LastName,Account.Biography\n0076ad07-a6c1-4825-8695-dc623cadb5d9,Katarina,Sim,\n00b398e2-21b6-4c17-9739-880ffbc9d83c,HYUN SEOK,SONG,\n00b79fb6-0714-450d-a8cc-9e57826100cc,Alberto,Guevara,\"Dr. Alberto Guevara \u00c1lvarez is an orthopedic surgeon specializing exclusively in shoulder surgery, with over 10 years of experience in the diagnosis and treatment of complex shoulder disorders. He is the founder and director of the Instituto de Hombro (IDH)? in Quer\u00e9taro, Mexico, a center dedicated to advanced patient care, education, and research in shoulder pathology.Dr. Guevara completed advanced fellowship training in shoulder surgery at Klinikum rechts der Isar and further international training in France and Switzerland. His clinical practice focuses on shoulder instability, rotator cuff disorders, shoulder arthroplasty, revision surgery, and sports-related injuries.In addition to his surgical practice, he is actively involved in clinical research, surgical innovation, and postgraduate education. He has contributed to the development and evaluation of novel techniques for shoulder stabilization and arthroplasty, and frequently serves as faculty and invited speaker at international orthopedic meetings across Europe, North America, and Latin America.His professional mission is to advance shoulder surgery through evidence-based practice, innovation, and the education of future specialists.\"\n00f75f7e-86f7-4892-b3c2-95dab065dc82,Neal,Kapoor,\n010f8a81-7372-4571-90a3-9b848495af2c,Anthony,Miniaci,\n01e70903-737a-4e12-b73c-7825273da904,George,Murrell,\"George Murrell is a shoulder surgeon based on the St George Hospital Campus, UNSW, Sydney where he is Professor and Director of the Orthopaedic Research Institute. He was an Adelaide University medical school graduate and 1984 South Australian Rhodes Scholar, completed a DPhil at Oxford\u2014where he also gained blues in athletics then taught anatomy and rowed in Cambridge before Orthopaedic Residency Training at Duke University. He then undertook a two-year fellowship in sports medicine, shoulder surgery, and research at the Hospital for Special Surgery in New York, with an NIH First Award, and an American Orthopaedic Association North American Travelling Fellowship. He returned to Australia in 1995 to establish the Orthopaedic Research Institute and a clinical practice focussing on arthroscopic shoulder surgery.\"\n021a579a-dc95-4c16-b35a-667d9aa841b6,Alex,Malone,Shoulder Surgeon with a research interest in ACJ injury\n02263c17-9ff8-4701-ba91-b6c3e60a37d7,Bradley,Schoch,\n0229d9cb-bd9d-4f72-a9b7-577f3e171478,Sarah,Larson,\n02900ea9-5fce-49ab-af8e-6561f9435430,Matthew,Ramsey,\"Dr. Ramsey began his career as a faculty member at the University of Pennsylvania where he was an Associate Professor of Orthopaedic Surgery and the Chief of the Shoulder and Elbow Service. In 2007, he joined the world-renowned Rothman Orthopaedic Institute. He has held several leadership positions at Rothman including being a member of the Board of Directors, Chief of the Shoulder and Elbow Service and Vice Chairman of the Department of Orthopaedic Surgery. Dr. Ramsey is a Professor of Orthopaedic Surgery at the Sidney Kimmel Medical College at Thomas Jefferson University. He is currently on the Board of Directors at Physicians Care Surgical Hospital.Dr. Ramsey specializes in reconstructive surgery of the shoulder and elbow. He is committed to a holistic approach to patient care. The only way to treat a patient effectively is to understand the unique circumstances that prompt them to seek medical care. In addition to his clinical interests, he is particularly passionate about the preservation of private practice and physician leadership in healthcare. In recent years, Dr. Ramsey has focused on broader issues in healthcare. He began a podcast entitled \u201c43cc-The truth about healthcare with a shot to dull the pain\u201d. The podcast explores the current state of healthcare in the hope of raising awareness of the of the challenges we face and determining solutions to the myriad issues that threaten our ability to deliver exceptional care to our patients.\"\n02a02a2a-3ad7-4674-acd9-4601bf0f27e5,Jeremy,Hall,\n02f18215-2c09-4cf6-bf08-5314e1e85f5a,Youngseo,Park,\n038fc02b-0b2a-45c8-88a1-56035baa6ab8,Jose,Aroca,\n03fe0616-40e7-49db-8818-64b9172bc10c,Sadaaki,Tsutsui,\n04428e7b-2e18-4abb-94e4-9984e29e1cdf,Christopher,Camp,\n0451f9af-9f33-462c-b302-2cde79485775,Rebecca,Mak,\"Medical Student and Clinical Researcher at the Orthopaedic Research Institute, University of New South Wales\"\n049b69a2-42b1-4c5b-8dfa-4a4f5001d337,Cameron,Guy,\"Resident physician at the University of Utah orthopaedic surgery program, going to fellowship for Shoulder and Elbow Surgery at Washington University for 2027-2028\"\n04ca701e-3c4d-47ea-aee2-936d35b582a2,Humberto,Arrue,\"President of the Latin American Shoulder and Elbow Society.Abstract Reviewer for ICSES, Rome 2023 and Vancouver 2026Abstract Reviewer for SICOT 2025Founding President of the Panamanian Association of Shoulder and Elbow SurgeonsShoulder Fellow at UTHSCSA, with Dr. Rockwood \u2013 2001Instructor and Consultant for Arthrex since 2010 to presentInstructor for the Arthroscopy Association of North American AANA - 2016Scientific and Education Committee - SLAHOC \u2013 2021Speaker for the SLAHOC Latin American Shoulder and Elbow Congresses since 2016.Committee on Consensus on Massive Rotator Cuff tears for SLARD 2021 and speaker since 2023 to the present.Speaker at the ICSES, Rome 2023 and multiple Latin American countries and Webinars. Speaker for the American Academy of Orthopedics Surgerons AAOS, at the Spanish Symposium 2024, 2025 and 2026Prosecutor of the Panamanian Society of Orthopedics and Traumatology.Creator and Direrctor of the Fellowship in Shoulder and Elbow Surgery, endorsed by The University of Panama, since 2018. Head of the Orthopedics Deparment of the Hospital -The Panama Clinic - Panama\"\n050f130e-b925-4b0a-a911-d794077c4603,Blaise,Cochard,\n058ac76d-5b3b-4b34-85b4-8e62a9a5f737,Olof,Wolf,\"I work as a consultant orthopaedic trauma surgeon at Uppsala University Hospital, Uppsala, Sweden. I completed a fellowship in Upper Extremity Trauma at Royal Infirmary in Edinburgh in 2012-13. I treat upper and lower extremity fractures including pelvi-acetabular fractures. Complex shoulder and elbow trauma is of special interest with primary and revision elbow arthroplasty being intersting and demanding. I also act as Director of the Swedish Fracture Register.\"\n059689ad-1cdd-4eda-a8f8-8b321ea12bcb,Lisa,Lattanza,\"Dr. Lisa Lattanza is the Ensign Chair of the Department of Orthopaedics and Rehabilitation at Yale School of Medicine. She earned her medical degree from the Medical College of Ohio, completed her orthopaedic surgery residency at the University of Missouri Kansas City, and fellowships in hand surgery at Columbia/Roosevelt Hospital and pediatric upper extremity surgery at Texas Scottish Rite Hospital for Children.Lattanza specializes in post-traumatic and congenital reconstruction of pediatric and adult elbow conditions and is a world-renowned leader in patient-specific 3D surgical planning for deformity correction. In 2016, she led the world's first elbow-to-elbow transplant and pioneered a new classification system for Chronic Monteggia Fracture Dislocations in children. She also regularly travels to Nicaragua and other countries to perform hand surgery on mission trips.Her research focuses on 3D surgical planning, elbow instability, post-traumatic elbow conditions, and the underrepresentation of women in orthopaedics. When she joined Yale in 2019, she became one of only two female orthopaedic chairs in the U.S. In 2009, she co-founded what is now the Perry Initiative \u2014 named after pioneering surgeon Jacquelin Perry, MD \u2014 which has grown from 18 high school girls in San Francisco to over 17,000 students nationwide, with participants matching into orthopaedic residencies at nearly double the national average.Lattanza has received numerous honors, including UCSF's Compassionate Physician (2013) and Exceptional Physician (2014) awards, the Jefferson Award for Community Service (2014), the AAOS Diversity Award (2021), and the Medical University of Ohio Distinguished Alumni award (2024). She served as president of the Ruth Jackson Orthopaedic Society in 2017 and remains active in major orthopaedic professional organizations.\"\n05b01432-fa2b-4f54-aceb-ef600f5602ac,PABLO,CA\u00d1ETE,\n05edce98-9af8-4118-b029-05c77e3f4f01,Aron,Kuroiwa,\n0610b0d5-9e69-41a5-88a6-7a5fd348dbb3,Cole,Fleet,\n063ebc26-9cd0-401c-ac0c-2e3b22668ebe,Parham,Daneshvar,\n06d649c0-a1b2-4bb2-af44-78c3afa999c7,Greg,Hoy,\n070e87f1-4953-4f62-9775-57ae0c91bded,Christopher,Klifto,\n07581076-7f2f-4006-9c79-51caa66cab59,Giuseppe,Bonsignore,\n075839d6-a267-401a-953c-906b3c5d43a9,Hugo,Barros,\n07662034-070e-4855-96cc-a0ccdeb0ad6c,George,Athwal,\n07a3f69c-e59a-4654-b838-47925cd90b79,Julio,Contreras,\"Julio Contreras Fern\u00e1ndez is an orthopedic surgeon specialized in shoulder and elbow surgery. He graduated from the University of Chile, where he also completed his residency in Orthopedics and Traumatology at the Instituto Traumatol\u00f3gico. He further subspecialized through a fellowship in shoulder and elbow surgery at Hospital Cl\u00ednico San Carlos in Madrid, Spain.He has completed international training experiences, including clinical observerships at Mayo Clinic and participation in the American Shoulder and Elbow Surgeons (ASES) Travelling Fellowship, gaining exposure to advanced surgical techniques and global best practices.Dr. Contreras combines clinical practice with academic and research activities. He holds advanced training in biostatistics and clinical research methodology and has contributed to multiple scientific publications in the field of shoulder and elbow surgery.He is actively involved in teaching and is affiliated with leading academic institutions in Chile. His clinical focus includes arthroscopic and minimally invasive surgery, shoulder instability, rotator cuff pathology, and joint replacement of the shoulder and elbow.\"\n08335c34-6325-43ca-95a3-3d43c983ba0b,Tatsumi,Tanaka,\n086d2625-1fbd-43b3-8bf8-08f578b82e2d,Christine,Silva,\"Christine Maria Muniz Silva, MD, MSc, PhD*- Medical Doctor, Federal University of Cear\u00e1 - Residency in Orthopedics and Traumatology, Dr. Jos\u00e9 Frota Institute - Board-Certified Specialist in Orthopedics and Traumatology, Brazilian Society of Orthopedics and Traumatology - Board-Certified Specialist in Shoulder and Elbow Surgery, Brazilian Society of Shoulder and Elbow Surgery - MSc in Medical-Surgical Sciences, Federal University of Cear\u00e1 - PhD in Medical-Surgical Sciences, Federal University of Cear\u00e1 - Residency Supervisor, Orthopedics and Traumatology, General Hospital of Fortaleza\"\n0880b021-1279-4482-b4ad-edb9fc474fde,Peter,Lapner,\n093edd57-9cd8-4bb1-ab0d-7daacb9ccd2d,David,Dines,\"David Dines MDUnited StatesDavid M. Dines (MD)s an internationally recognized orthopedic shoulder surgeon and Clinical Professor of Orthopedic Surgery at the Weill Cornell College of Medicine (WCMC) and The Hospital for Special Surgery in New York. He is program Director of the Shoulder Fellowship at HSS. He served as Chairman and Professor of Orthopedic Surgery at the Albert Einstein College of Medicine at Long Island Jewish from 1997-2007 and is the author of over 300 peer-reviewed articles and, 8 texts and numerous chapters related to surgery of the shoulder and sports injuries to the upper extremity. He has given more than 1000 presentations on Shoulder Surgery around the world, including many \u201clive\u201d surgical demonstrations as well.Since 2023 he has served as Medical Director of the HSS Education Institute and more recently as HSS DIO. He served as President of the American Shoulder and Elbow Society 2005-6 and has been given a lifetime achievement award by the American Academy of Orthopedic Surgeons In 2017. He has been honored to receive the Sir John Charnley Award for excellence in Joint Replacement research (1996), Americas Best Doctors, Whos Who in Medicine , Best Doctors in NY and Americas Best Orthopedists since 1996. He was honored by US News and World Reports as one of the top 1% of Orthopedic Surgeons in the US. Dr Dines and his co-workers won the prestigious Neer Award for Shoulder Research in 2005 for their work on genetic engineering for improvement of rotator cuff tendon healing in a rat model. Dr. Dines has been the principle designer of a number of orthopedic devices including both the Biomet Biomodular Shoulder and the Zimmer-Biomet Comprehensive Anatomic and Reverse Total Shoulder Replacement System, one of the most popular systems used around the world. He has served as Team Physician for the New York Mets Baseball team from 1991-nd New York Arrows Soccer team from 1985-88. He is a consultant to the New Jersey Devils Hockey Team (NHL) and has served as a Medical Director and member of the ATP Medical Services Committee for the ATP World Tour since 2004. He has been United States Davis Cup Tennis team Physician since 2000 and Orthopedic consultant to the US Open from 2003 until 2013. He is married (Judith) and proud father of two children, Josh and Alison and 2 grandchildren. Josh is presently an Attending Orthopedic Surgeon and Associate Professor (WCMC) at Hospital for Special Surgery. He is also world-renowned Sports Medicine Surgeon.\"\n0958e153-0804-4cc6-b21c-c990b34d3b92,Edward,Perera,\"Edward is a third-year Orthopaedic Resident at Queen's University in Kingston, Ontario with aspirations of pursuing a career in Upper Extremity Orthopaedics.\"\n098d772e-6cda-4a50-8975-ce99de81afa5,ABDULILAH,HACHEM,\"Dr.HACHEM, Abdulilah, MD, PhDAssociate Professor of Orthopaedic Surgery, University of Barcelona- Spain.Head Shoulder Unit of Hospital Universitari Bellvitge and Teknon Medical CentreDirector of the Master Fellowship program of the University of Barcelona President of the Spanish Society of Shoulder and Elbow-SECHC- Presidency 2026-2028Chairman of BIASS, the Barcelona International Arthro Shoulder Surgeries Course SECEC Congress co-chair Barcelona 2026 AEA Congress President 2024 (Arthroscopic Spanish Association)Past member of the executive committee of the Spanish Arthroscopy Society- AEA More than 40 Publications in the field of the shoulder in a high-impact factor journalSpecial Research activities in the cutting-edge treatment of shoulder instability I have had the privilege of participating in over 150 presentations as an organizer, moderator, and speaker at national and international courses and conferences.Reviewer JSES, AJSM, and other Journals\"\n0ab41b29-2949-42f4-a3f2-7380ac562597,Manuela,Angulo,\n0ad6098d-1ad9-4047-bc9c-36b6040d1222,Lionel,Neyton,\"Lionel Neyton, is specialized in shoulder surgery. After completing his residency program in Nancy, he ran a one-year shoulder fellowship with Gilles Walch in 2003. He then joined Pascal Boileau\u2019s department in Nice, France for three years of junior practice.He joined Gilles Walch at Centre Orthop\u00e9dique Santy in Lyon in November 2006. His practice is fully dedicated to shoulder surgery with specific interest in arthroplasty (surgery and design), clinical research and education. He is Corresponding member of the American Shoulder and Elbow Surgeons society (ASES), German language shoulder and Elbow Society (DVSE), Shoulder and Elbow Society Australia (SESA) and Honorary member of the Korean Shoulder and Elbow Society (KSES).He was selected for the Travelling fellowship SECEC/ASES in 2014 and is the 2018 winner of the Grammont Award of SECEC. He is member of the French Shoulder and Elbow Society (SOFEC), French Orthopaedic Society (SOFCOT), French Arthroscopic Society (SFA) and European Shoulder and Elbow Society (SECEC) and Member of the Coll\u00e8ge Fran\u00e7ais des Chirurgiens Orthop\u00e9distes et Traumatologues. He was part of the Executive Committee of the SECEC and served as Treasurer until September 2025.\"\n0aec6901-7b2b-429d-ba51-be80103edf74,Aaron,Bois,\n0c286ee5-d25e-4274-bf46-23e8f17ab126,Tomoyuki,Matsuba,\n0c47f4bf-3d5b-4765-b9e6-f4574cb141b3,Sean,Clark,\n0d41e06e-a142-4bcf-b1b7-12497217c259,Surena,Namdari,\n0d7e8217-27ad-425c-b128-89b424227c46,Carl,Basamania,\n0df6c5fc-b07a-4e11-8d77-32148796cf75,Armando Tonatiuh,Mondragon-Rodriguez,\n0e849a47-7858-4ffb-be0d-b60fb7851fa2,ARNALDO,FERREIRA,\n0f0bb4c6-f635-47e8-813a-a9d8d0b61722,Hideki,Kamijo,\"Hideki Kamijo, MD, PhD, is an orthopaedic surgeon specializing in shoulder and elbow surgery at Funabashi Orthopaedic Hospital, Chiba, Japan.\"\n0f26a049-501f-42c0-9fa0-44cddbe65273,Juan David,Lacouture,\n0f4728fb-edbf-43c5-94ec-2d5ba6f9e44f,Jean-David,Werthel,\n0fd6b930-358f-416b-979c-f54df4070dc9,Gabriella,Ode,\n11000cee-768b-4100-9b58-c74c34185490,Carlos,Prada,\n11e46018-5301-4832-aee6-abcd9dbe9998,Caitlin,Kacena,\"I am a second-year medical student at Loyola University Chicago Stritch School of Medicine. I earned a Bachelor of Science in Biochemistry from Boston College and a Master of Science from Brown University. Prior to medical school, I worked for one year as a Medical Assistant at Brigham and Women's Hospital in the Neurosciences Center, where I cared for patients in neurosurgery, neuromuscular medicine, and multiple sclerosis clinics. My academic interests include clinical research, orthopedic surgery and health disparities. I am actively involved in orthopedic research and community outreach initiatives and am committed to advancing patient-centered care through research and service.\"\n1320b844-6857-4a9d-af9e-de50a6563497,Nadia,Leamy,\n13763fae-4074-4b5f-b582-904f918660fb,Ty,Langford,\n137fc93b-82a4-4d58-8ddb-fb813d2fac76,Jenna,Somberg,\"I am a second-year medical student at Loyola University Chicago Stritch School of Medicine, where I am part of the MD/MPH dual-degree program, pursuing a Master of Public Health in Epidemiology in addition to a Doctor of Medicine. I attended the University of Washington in Seattle, where I earned a Bachelor of Science in Biology in 2023. Before medical school, I worked as a research scientist at the University of Washington, where I studied neurodegenerative diseases in the departments of Medical Genetics and Neuropathology. My academic interests include orthopedic surgery, patient outcomes, sports medicine, and public health. I am currently involved in orthopedic research at Loyola and Hines VA, as well as community engagement programs and public health research.\"\n13f82d5f-bee7-4502-a0a6-9b02dd718e23,Graham,King,\"Dr. King is an elbow and forearm surgeon at the Hand and Upper Limb Centre at Western University. He has a special interest and elbow arthroplasty, elbow instability as well as elbow biomechanics.\"\n13fa1e97-dba9-444e-ad2a-191fed7acfb3,Ritwik,Kejriwal,\"Dr Ritwik Kejriwal is an orthopaedic surgeon in New Zealand with a specialist practice in shoulder and knee surgery. His shoulder expertise includes advanced arthroscopic rotator cuff repair, shoulder stabilisation procedures, and primary and revision shoulder arthroplasty. He combines clinical experience with a strong commitment to education and research, with a special interest in rotator cuff repair outcomes and shoulder replacement planning and execution.\"\n14444867-467a-4534-86d9-b91676b207c5,Ryan,Gao,Shoulder & Elbow Surgeon in Auckland New Zealand\n14649f70-b922-4fe7-a37a-a9a513fc0010,Matthias,Zumstein,\"Matthias Zumstein is a renowned specialist in surgical orthopedics and traumatology. He completed his medical training at the University of Bern, obtaining his doctorate degree. In 2017, he was appointed as a professor.Currently, Matthias Zumstein leads the team for shoulder, elbow, and sports orthopedics at Orthop\u00e4die Sonnenhof in Bern and at Sportclinic #1. In addition to his role as a professor at the University of Bern, he also serves as an Honorary Professor at Macquarie University in Sydney, Australia.He underwent specialized training in shoulder, elbow, and sports orthopedics in Zurich and Bern. Furthermore, he completed clinical and scientific fellowships in shoulder orthopedics and sports orthopedics at the University Hospital in Nice, France, as well as in elbow and wrist surgery at the University Hospital in Adelaide, Australia.Matthias Zumstein is an active member of the Swiss Society of Orthopedics and Traumatology (swiss orthopaedics) and has chaired this organisation as a president from July 2024 to June 2026. Additionally, he served as a board member of the European Society for Shoulder and Elbow Surgery (SECEC/ESSSE) for many years.His impressive scientific portfolio includes over 90 peer-reviewed publications, 25 review articles, and 21 book chapters. Moreover, he has delivered over 300 presentations at national and international conferences, including more than 150 invited lectures. Matthias Zumstein has been recognized for his research with various awards, including twice receiving the highest-funded scientific award in shoulder surgery, the Neer Award from the American Shoulder and Elbow Surgeons (ASES), as well as additional awards from DVSE, swiss orthopaedics, the Soci\u00e9t\u00e9 Francophone d\u2019Arthroscopie, and the Lipmann-Kessel Prize from the British Elbow and Shoulder Society.\"\n14a57e9c-d9d2-4f25-b7bb-2ae5c4c30cb2,Clara,Campos Azevedo,\"CLARA DE CAMPOS AZEVEDO is a Consultant in Orthopedics and Traumatology and the Co-Head of Shoulder and Elbow unit at Joaquim Chaves Sa\u00fade and the Head of the Shoulder and Elbow Unit at the Department of Orthopedics and Traumatology of SAMS Hospital in Lisbon, Portugal.She completed her medical degree in 1999 at the Faculty of Medicine of the University of Lisbon and her residency in Orthopedics and Traumatology in 2008 at the Western Lisbon Hospital Center (CHLO). She concluded her shoulder fellowship in France with Dr. Thierry Joudet in 2007. From 2009 to 2014, she was Assistant Professor of Orthopedics at NOVA Medical School.She has been a consultant in Orthopedics and Traumatology since 2017 and was the Coordinator of the Shoulder Surgery Unit at the Department of Orthopedics and Traumatology at CHLO from 2018 to 2021.In 2022, she obtained her Ph.D. in Medicine from the School of Medicine at the University of Minho, focusing on arthroscopic superior capsular reconstruction (ASCR) using a minimally invasive autograft of fascia lata harvested from the mid-thigh for the treatment of irreparable rotator cuff tears.She has published several peer-reviewed articles on shoulder surgery in national and international journals, has been an invited speaker, and has authored numerous original presentations on ASCR. She has presented more than a hundred papers on orthopedics at national and international shoulder meetings and cadaver lab courses.She was a Board Member of the European Shoulder Associates of the European Society for Sports Traumatology, Knee Surgery, and Arthroscopy (ESA \u2013 ESSKA) for the 2025-2026term. She is Chair of the Communication Committee and Deputy Chair of the Shoulder Committee of the International Society of Arthroscopy, Knee Surgery, and Orthopaedic Sports Medicine (ISAKOS) for the 2025-2027 term. She is a member of the Education Committee of the European Society for Shoulder and Elbow Surgery (SECEC) for the 2025-2026 biennium and was accredited as an ESSKA Teacher by ESSKA in September 2023. She is a Corresponding Member of the German, Austrian and Swiss Shoulder and Elbow Surgery Society (DVSE) since 2026.She serves as a reviewer for several journals (KSSTA, OJSM, JISAKOS, the HIVE, JEO), a principal reviewer for the American Journal of Sports Medicine (AJSM) since 2020, and a member of the editorial board of AJSM (Electronic Media Editorial Board, AJSM EMEB) since 2021, of The Hive Musculoskeletal Journal since 2024, and of the Journal of Experimental Orhtopaedics (JEO) since 2025.In 2021, she co-founded SHOULDER.PT, a brand and website dedicated to advancing medical education in the field of shoulder and elbow surgery.\"\n15231c82-5b5c-41fb-9b3d-73f36e99d9a9,Sunho,Cha,\n15718a8b-0250-41d7-aa97-c22708eb37d6,William,Aibinder,\"William Aibinder is an associate professor of orthopedic surgery at the University of Michigan. He specializes in shoulder & elbow surgery. He completed his residency training at the Mayo Clinic, followed by fellowship at the Roth|McFarlane Hand and Upper Limb Center at the University of Western Ontario in London, Ontario. He is extensive involved in research and education, serving as the co-director of the Sports Medicine & Shoulder Surgery Fellowships as well as the Medical Student Clerkship director.\"\n1575a4a1-4960-4aa6-aa5a-718165ed8de6,arnaud,walch,\n15a273c8-c981-4848-a69e-14e60e7d835e,Geoffroy,Nourissat,\n15fd1ea9-704d-4b6c-9f8a-48fcaf66aae2,April,Armstrong,\"Dr. April Armstrong is the C. McCollister Evarts Professor and endowed chair of the Department of Orthopaedics and Therapy Services, as well as Vice President Musculoskeletal Service Line, Penn State Health. Her primary research efforts have focused on the glenoid component failure mechanisms in total shoulder replacement. She ranks nationally as a top physician in her subspecialty, is listed among the Best Doctors in America and has been the recipient of several awards, including the Dean\u2019s Award for Excellence in Teaching, a Distinguished Educator Award from Penn State College of Medicine, the Michael B. Bongiovanni Award for creating an extraordinary patient experience, and the Steven and Sharon Baron Leadership Award. Previously, she has served as Vice Chair of Clinical Affairs and Quality for the department of Orthopaedics and Rehabilitation, and Associate Chief Medical Officer for Outpatient Surgical Care within the Penn State Health Medical Group. Armstrong\u2019s leadership experience in medical education includes associate designated institutional officer and director of health systems science for Graduate Medical Education (GME) in the GME Office and national course director of the Orthopaedic Educators Course for the American Academy of Orthopaedic Surgeons. She is in the tenth year of a 10-year term as a director of the American Board of Orthopaedic Surgery and served as board president. Dr Armstrong is associate editor of the Journal of Shoulder and Elbow Surgery. She is the President Elect for the American Shoulder and Elbow Society and the second president elect for the American Orthopaedic Association.Armstrong earned her medical degree from the University of Western Ontario in London, Ontario, where she also completed her residency in orthopaedic surgery and later earned a master\u2019s degree in medical biophysics. She is board-certified in orthopaedic surgery and a fellow of both the Royal College of Physicians and Surgeons in Canada and the American Board of Orthopaedic Surgery. She completed fellowships in upper extremity orthopaedic surgery at St. Joseph\u2019s Health Care London in Ontario, Canada and in shoulder and elbow orthopaedic surgery at Barnes-Jewish Hospital, Washington University School of Medicine, St. Louis. She is happily married to Mark and has 2 daughters, Grace and Claire.\"\n16dbe065-ae1a-4c38-bdbb-fa64a77b7334,Austin,Smith,\n173ba5df-0802-43d4-8cab-1d07b9b0aac1,Gregory,Nicholson,\n174868d6-59d2-4e67-95ac-4a9663ddf477,Richard,Page,\"Prof Page is Academic Chair of Orthopaedics at Deakin University, Barwon Health and St John of God Hospital. A specialist shoulder, upper limb and trauma surgeon and current President of the Shoulder and Elbow Society of Australia (SESA). Founder of the Barwon Centre for Orthopaedic Research and Education (B-CORE). He has authored and presented on over 300 referred journal articles and book chapters with >$20M in NHMRC and competitive grants. He has appeared in the media discussing shoulder and orthopaedic topics, with a focus on osteoarthritis. Research covers shoulder replacement surgery, biomaterials and biomechanics, orthopaedic trauma, with extensive clinical trial experience in surgery.\"\n182f2e64-54d0-4542-9b20-0e95da3aee0e,Steve,Papp,Dr. Steve Papp is an orthopedic surgeon that specializes in orthopedic trauma and upper extremity surgery. He is currently head of orthopedics at the University of Ottawa.\n1929982c-eb38-4f7d-8996-c07bd1784ba9,Jeff,Abrams,\n198a66b8-0203-4a0f-8ffa-55e27d225691,Dimitra,Leivadiotou,\n1a1494e3-cc96-43f4-9095-0b7bdeedd24c,Juan,Peralta Vera,\n1a1c91c4-500e-4f6e-8289-332e73772e39,Stephen,Roche,shoulder and elbow surgeon Cape Town South Africa 0000-0002-5695-2751\n1a3d6d60-a550-4185-bd0a-6a449f44d3b4,Hugo,BARRET,\n1a9e0b28-b418-43f2-8ebf-fc88d63cd85c,Felipe,Toro,\n1ac655bc-e3b2-4faa-a7cb-1f904b085f51,Stefano,Gumina,\n1af75f51-61af-4835-8f7b-4331ba07cb31,Sandeep,Nayar,\n1b096c00-5004-4c93-9b3e-a040f536fae8,Naori,Akamine,\n1ba9804c-9a63-4510-bf59-39231703a12f,Eric,Ricchetti,\"Eric T. Ricchetti, MD is a staff surgeon in the Department of Orthopaedic Surgery at the Cleveland Clinic and is an Associate Professor at the Cleveland Clinic Lerner College of Medicine of Case Western Reserve University. He holds the Maynard Madden Endowed Professorship in Arthritis Research, and is also the Director of the Shoulder Center and the Director of the Shoulder and Elbow Surgery Fellowship Program in the Department of Orthopaedic Surgery at the Cleveland Clinic. Dr. Ricchetti\u2019s clinical practice is focused on the treatment of disorders of the shoulder, including management of primary and revision shoulder problems in joint arthroplasty and rotator cuff disease. His research interests have focused on examining clinical outcomes after total shoulder arthroplasty and rotator cuff repair. He has received grant funding from multiple sources related to these areas of research, including an R01 grant award from the National Institutes of Health (NIH), and he was recognized with the 2015 Charles S. Neer Award for Basic Science Research by the American Shoulder and Elbow Surgeons (ASES).\"\n1bdba0b6-8668-424f-8190-8f4d5c60da9b,Steven,Leary,\n1c2e1e47-7102-4376-8933-5413042c6ad0,Humood,Boqambar,\"Dr. Humood Boqambar is an Upper Extremity Clinical Fellow at the Western Hand & Upper Limb Facility (WULF) in Edmonton, Alberta. He completed his orthopaedic surgery residency training at the University of Toronto in Ontario. His clinical and research interests focus primarily on shoulder and elbow trauma. Outside the hospital, he is an avid runner and cyclist.\"\n1c498dac-2ad7-46e9-8a74-12a5ac8c025e,Raffaele,Garofalo,\n1c6d8d9d-65a2-4410-b7e9-aef9654e2a1b,Alaa,Elsenbsy,\n1d8e677c-21d9-49b6-9661-c9fb3b2bd3bf,Andr\u00e9s,Calvo,\n1da81924-aa50-41ae-b2df-b4a487aeda60,Favian,Su,\n1e62e0cd-9322-4db2-8bd3-8a12cfc162c9,Brendan,Patterson,\n1f0c4faa-29a6-47ec-bf07-b708edbed809,Mohamed,Kotb,\n1f63697a-fd03-44c7-9854-0c568e05ef73,Eva,Gusnowski,\"Shoulder Reconstruction and Sports Medicine in Saint John, NB, Canada\"\n1f97b053-1ca3-44ca-b1cd-f50b217083ca,Sarthak,Chakravarty,Hi! I am a medical student at NSU KPCOM interested in pursuing Orthopedic surgery as a career. I am excited to present my groups research and am looking forward to some amazing discussions at the conference.\n1fa1d28a-f43b-4154-9c7b-db759cf1aeae,Jay,Keener,Jay Keener is the Sam and Marilyn Fox Distinguished Professor and Chief of the Shoulder/Elbow Service at Washington University in St Louis\n2019f4e3-b07e-48c8-a127-cfd5f106d8b5,Michael,Moverman,\n204972f1-2dbc-44ce-a4eb-06e7620a563d,Justin,Givens,\n2065866f-2e3a-40a0-adc8-406d08e29eed,Mohamed,Nabil,\n20a065da-7832-41d0-981a-9e22b9003ced,Jason,Strelzow,\"Jason Strelzow, MD, is a fellowship-trained orthopaedic surgeon with subspecialty expertise in upper extremity surgery and orthopaedic trauma. He currently serves as Vice Chair of Faculty Affairs, leading faculty promotion, mentorship programs, and academic development across clinical care, education, and research at Washington University of St. Louis.Dr. Strelzow completed his undergraduate and medical degrees at the University of British Columbia, followed by an orthopaedic surgery residency. He pursued two fellowships: hand, wrist, microvascular, elbow, and shoulder surgery at the University of Western Ontario, and orthopaedic trauma at the Royal Infirmary of Edinburgh, Scotland.In 2017, he joined the University of Chicago to help establish a Level 1 trauma center on the city's south side \u2014 a community with significant socioeconomic disparities and limited access to trauma care. Through sustained collaboration across departments and hospital leadership, that program grew into the busiest trauma center in Chicago. His clinical experience there directed his research focus toward ballistic musculoskeletal injuries, an area in which he has developed a national reputation as an investigator and thought leader.Dr. Strelzow held several leadership roles at the University of Chicago, including Director of Orthopaedic Trauma, Residency Program Director, and Director of the Operative Performance Research Institute. He served on numerous institutional committees, including the Trauma Oversight Committee, Institutional Review Board, Peri-Operative Trauma Committee, Surgery Quality and Patient Safety Improvement Committee, and the MacLean Center for Medical Ethics.As Residency Program Director, he built a track record as an engaged educator and mentor to medical students, residents, fellows, and practicing surgeons, both locally and through national and international medical societies.He brings to this international community a perspective shaped by high-volume trauma care, health equity, surgical education, and faculty leadership \u2014 and a genuine interest in collaborative work across institutions and borders.\"\n20b2b265-d02e-45f3-9351-1c1899953532,Jens,Agneskirchner,\"SpecialistSince 07/2005Consultant of Orthopeadic Surgery in Henriettenstiftung Hannover, Deputy of Chief of Department,Head of Arthroscopy and Shoulder Surgery ServiceSince 10/2009Consultant and Partner of Sportsclinic Germany, HannoverConsultant, Partner and Chief of Service of Gelenkchirurgie Orthop\u00e4die Hannover, 1000-1100 shoulder operations personally performed per year (per year: more than 250 total shoulder arthroplasties / revision arthroplasties, more than 300 rotator cuff repairs, in total more than 1200 arthroscopic Latarjet procedures performed)Since 2006 Yearly listed as recommended shoulder specialist in \u201cFocus\u201d and \u201cStern\u201d list Frequent speaker and live surgery surgeon in international meetingsInternationally renowned shoulder surgeon\"\n211d0e6b-a7f0-4dab-8f02-e3766bbef222,Steven,Goldberg,Orthopedic Surgeon\n215447da-0e09-45a5-aad5-e483d4b2367d,Chunyan,Jiang,\n21c6848b-4558-45de-ab7c-ad4492ec5ddb,Nady,Hamid,\n234ec2cf-c605-42d0-baf3-06bb52ef1735,Ruth,Delaney,\n23625291-3dae-4f96-b634-54c1f4110e3a,Yousif,Atwan,\n24c9bf2b-034c-41ba-ae77-bd67fc110434,Adrian,Huang,\n253c623b-05c7-4d32-bb61-1221d57fe2a9,John,Tyler,Third-year medical student at Loyola Stritch School of Medicine.\n2568714d-1bbf-4672-8c87-95db6d697195,Jorge,Rojas Li\u00e9vano,\n258f8976-1d5c-476e-8bca-aff5c7797784,GUILHERME,STIRMA,\n25af3d8e-efdd-4b4b-ba4e-1ac66c4fb598,Jaynie,Criscione,\"Jaynie is an aspiring orthopaedic surgeon in her fourth year of medical school with interests in reconstruction, implant technology, and equitable care.\"\n25d24de6-c006-4b83-b921-4798197b12ba,Eugene,Ek,\n266a9e75-c2ed-4cc6-86a1-bc325138751b,Pinxue,Li,\n27090350-039d-4345-8770-b7737723abd2,Richard,Lloyd,\n27ae5775-0141-41e1-add6-d782c2c722b8,Eva,Grice,\n2809f90b-bb6c-4d91-93f6-381ce7532020,Ana Catarina,\u00c2ngelo,\"ANA CATARINA \u00c2NGELO is a Shoulder and Elbow Orthopedic surgeon based in Lisbon, Portugal. She is co-founder of SHOULDER.PT and member of the shoulder and elbow units of Hospital dos SAMS de Lisboa and Cl\u00ednica Cir\u00fargica Joaquim Chaves Sa\u00fade in Lisbon and Carcavelos, Portugal. Current ESSKA Vice-Education Secretary and member of the board.She completed her master\u2019s degree in Medicine at Faculdade de Medicina de Lisboa, Universidade de Lisboa, and her orthopedics and traumatology residency in Centro Hospitalar de Lisboa Ocidental. During residency she completed international fellowships in shoulder and in elbow surgery centers in France and Belgium. Between 2014 and 2019 she was actively involved in the academic training of medical students from NOVA medical school, in Lisbon. National and international lecturer, with several communications as invited faculty in national and international events, she has been devoted to clinical and biomechanical investigation in shoulder and elbow surgery, with several papers published in scientific peer reviewed national and international journals. She is currently member of the editorial board of the Orthopaedic Journal of Sports Medicine (OJSM), The Hive \u2013 MSK Journal and Journal or Experimental Orthopedics (JEO). Scientific reviewer for several international peer-reviewed Q1 papers including AJSM, OJSM, JSES, KSSTA, JEO.She is an active member of several national and international societies: the Portuguese Society of Shoulder and Elbow surgery (SPOC), the International Society of Arthroscopy, Knee Surgery and Orthopaedics Sport Medicine (ISAKOS), the European Society for Sports Traumatology, Knee Surgery and Arthroscopy (ESSKA), and of the European Shoulder and Elbow Society (SECEC-ESSSE). Active member of the Shoulder section of ESSKA, previously known as European Shoulder Associates of ESSKA (ESA) and current honorary member of the leadership committee of this section. Since 2021 Ana Catarina \u00c2ngelo has become an active member of the International Society of Arthroscopy Knee Surgery and Orthopedic Sports Medicine (ISAKOS) and is the current Deputy Chair of the ISAKOS Communication committee. Since 2022 she has also become an ordinary member of SECEC and was elected member of the SECEC membership committee in 2023. In 2024 Ana Catarina \u00c2ngelo was one of the 58 founding members of the Global Elbow Network (GEN) and in 2025 she was one of the founding members of the International Superior Capsule Reconstruction Association (ISCRA).\"\n2847072f-dc05-4134-9cba-e925c9d548ab,Seokho,Hong,\n29d6b391-68a6-4e1d-a445-b14b7e5ac806,Mark,Frankle,\"Director and PI for Shoulder and Elbow Research group, Dr. Mark A. Frankle has been with Florida Orthopaedic Institute since 1991. Dr. Frankle serves as the Director of the Phillip Spiegel Orthopaedic Research Laboratory at the Foundation for Orthopaedic Research and Education (FORE). Dr. Frankle also founded the Shoulder and Elbow fellowship training program, which he continues to direct. This program has facilitated the training of more than 75 Shoulder and Elbow surgeons practicing nationwide. Dr. Frankle has designed implants and instrumentation used in shoulder replacement for several different orthopaedic companies, resulting in an estimated volume to date of 60,000 individual shoulder prostheses implanted in patients worldwide. For his research, Dr. Frankle has twice received the prestigious Charles S. Neer Award for both Basic Science and Clinical Research from the American Shoulder and Elbow Surgeons and was nominated five additional times. He has published two books, numerous book chapters, and over 130 research articles. He served as a member for numerous committees (ASES, American Academy of Orthopaedic Surgeons, etc.) Dr. Frankle presently acts as a Journal Reviewer for five peer-reviewed journals and as course faculty in specialty meetings both nationally and internationally.\"\n2a6b3eaa-660e-4fe5-9cc1-473471603559,Robert,Tashjian,\n2b44bfd8-5ad6-41e2-a328-3a71a9da13c9,Jean-Pierre,Du Plessis,\n2bc2b3be-7f60-47fa-abc0-1cc410edb0a3,parag,shah,\n2c4c7bb0-ebec-4192-b83b-2cb2deba04b0,Albert,Lin,\"Albert Lin, MD, is Professor and Vice Chair of Education, Residency Program Director, Chief of Shoulder Surgery, Co-Director of the Pittsburgh Shoulder Institute, and Associate Chief of Sports Medicine at the University of Pittsburgh. He received his undergraduate degree with magna cum laude distinctions from Harvard University, medical degree from Harvard Medical School, and completed his residency in orthopaedic surgery at the Harvard Combined Orthopaedic Residency Program, followed by fellowships in sports medicine at UPMC and shoulder surgery at Harvard University and Centre Orthopedique Santy in Lyon, France.Dr. Lin specializes in the care of athletes and shoulder conditions, and has extensive experience with shoulder arthroscopy, shoulder arthroplasty, and complex reconstructive and open surgery of the shoulder. Dr. Lin is an active committee member of American Academy of Orthoaedic Surgery (AAOS), American Orthopaedics Society for Sports Medicine (AOSSM), American Shoulder and Elbow Surgeons (ASES), International Society Arthroscopy for Knee Trauma and Orthopaedic Sports Medicine (ISAKOS), American Orthopaedic Association (AOA), and was recently inducted to the prestigious Herodicus Society and ASES Neer Circle in 2022. He currently serves as the co-chair of the education committee of ASES, and on the scientific and shoulder committees of ISAKOS. He is a founding board member of the international Rotator Cuff Study Group and is a regular invited faculty member for AAOS, ASES, AOSSM, AANA, ISAKOS, and Mid Atlantic Shoulder and Elbow Surgery. He was the co-chair of the ASES Fellows\u2019 Day 2021 and 2022 and has been a co-chair of the shoulder and elbow program of the OSET Summit Meeting since 2022. In addition, he is an associate editor for JBJS Case Connector and editor-in-chief of Annals in Joint and is a member of the editorial boards of KSSTA and Arthroscopy. He is a regular reviewer for AJSM, Arthroscopy, JAAOS, JSES, KSSTA, JBJS, JOR, and several other journals. Dr. Lin has currently published over 190 peer-reviewed papers and over 500 abstracts and book chapters related to clinical and basic science research on shoulder instability, rotator cuff pathology, shoulder arthroplasty, and complex shoulder conditions, and regularly presents his research as invited faculty and visiting professor at international, national, and local conferences. His papers have received numerous awards from AAOS, ASES, AOSSM, AANA, and the Arthroscopy Journal. He recently completed two federally-funded NIH (R03, R21) grants as a Principal Investigator related to shoulder biomechanics research in addition to two additional current federally funded grants with the NIH (R01) and DoD as a Co-Investigator related to shoulder instability research. He is actively involved in medical school, residency, and fellowship education, serving as the Program Director of the Orthopaedic Residency since 2022 and was prior Associate Program Director of the UPMC Sports Medicine Fellowship. He has won multiple awards related to education and mentorship of medical students at the University of Pittsburgh School of Medicine. On a systems level, Dr. Lin holds several leadership roles within UPMC and currently serves on the executive committee of the orthopaedic departments, treasurer at UPMC East, and on the advisory boards for the VATS, RFP, UPMC Health Plan, and ambulatory surgery workgroups for shoulder. He is also the head orthopaedic team physician for Duquesne University and Pittsburgh Central Catholic High School.\"\n2c6c6a3f-7245-4dc6-9242-145151df88e0,Matias,Croxatto,\n2c76a2e0-f7ea-4e79-b43c-4559cd3e03b8,Sebastian,Wangler,\n2d7aefd2-4538-4302-bf15-ef2506af7239,Abdelsalam,Eid,\n2dbb4235-f0b5-451e-b500-4f903999df75,Katherine,Ferry,\n2e858e18-f5ef-4204-9731-919fec2fcf6f,Byron,Torres,Latin America shoulder and elbow surgery society (SLAHOC) past presidentEcuadorian shoulder and elbow surgery society founder and presidentHospital Metropolitano and Hospital Vozandes active shoulder and elbow surgeon Centro de Especialidades Ortop\u00e9dicas del Ecuador founder and shoulder and elbow unit director\n2eae9bc5-a0fb-4b4c-a2cf-cf52b14825e0,Mehmet,Demirhan,\n2f1e792a-cb54-4fae-99ec-e279474586a9,Andrew,Choo,\n2f643a27-cd53-4e7b-98fd-8ad42928509b,Michael,McKee,\n2f863dee-2b2b-4fc3-8de8-396832b1c3dc,Olawale,Sogbein,\n2fe9c587-b867-417f-a70e-3e0668cb1f8d,Eric R.,Wagner,\"Dr. Wagner is a Shoulder and Elbow Specialist at Emory University in Atlanta, Georgia. His specialties involve complex pathologies in the realm of shoulder and upper extremity surgery. includi complex rotator cuff pathologies, shoulder instability and labral pathologies, primary and revision shoulder and elbow arthroplasty, scapular pathologies, thoracic outlet syndrome, and the throwing shoulder and elbow. He has published over 350 peer-reviewed journal articles, delivered over 1000 presentations national and international meetings, authored over 25 book chapters, and edited 3 textbooks. He is the Shoulder and Elbow Editor for JAAOS, an Associate Editor for JHS GO, an Associate Editor for Handthology and the ASSH Hand.e, and serves on multiple committees at the AAOS, ASES and ASSH. Additionally, he has received numerous grants to support his clinical and basic science research interests and has received numerous national and international awards, including the 2022 ASES Neer Award.\"\n2feb9a69-6411-41da-8504-76766622e2aa,C. Benjamin,Ma,\n30279c93-38d2-4aa2-810a-b07dbe4f12ea,Thibault,Lafosse,\n3113ff8b-c7d9-48c5-851f-933649c1cb35,Yaiza,Lopiz,\"Yaiza Lopiz Morales, MD, PhD, is Full Professor of Orthopaedic Surgery at the Complutense University of Madrid and Consultant Orthopaedic Surgeon at Hospital Cl\u00ednico San Carlos, Madrid, Spain. She combines clinical practice with academic and research activities, with a particular interest in shoulder and elbow surgery, fractures, tendon repair, regenerative medicine, and advanced cell therapies.\"\n31abcd9b-2f88-49b9-9f8d-5484a685628a,Jennifer,Tangtiphaiboontana,\"Dr. Tangtiphaiboontana specializes in orthopaedic trauma and shoulder/elbow surgery. She completed her medical school training and orthopaedic residency at the University of California, San Francisco. She then completed a trauma fellowship at Harborview Medical Center in Seattle, WA and a fellowship in shoulder/elbow surgery at Mayo Clinic. She is currently faculty at Mayo Clinic in Rochester, MN and specializes in upper extremity trauma and shoulder/elbow surgery.\"\n31d438aa-51c8-4288-a96c-e18a95b5143d,Yong Tae,Kim,\"Assistant Professor, Department of Orthopaedic Surgery, Hallym University Dongtan Sacred Heart Hospital, KoreaVisiting Professor, Orthopaedic Technologies & Biomechanics Lab, Department of Mechanical Engineering, University of Victoria, Canada\"\n320bcac3-2be7-4a27-8a24-f47f475fcd91,Maristella Francesca,Saccomanno,\"Maristella F. Saccomanno, MD, PhD currently works at the Sports Traumatology and Joint Surgery Unit, Fondazione Policlinico Universitario A. Gemelli IRCCS, Rome, Italy.Her clinical practice and research activities are mainly focused on shoulder, with a particular interest in arthroscopic and reconstructive procedures.She graduated with honors in Medicine and Surgery in 2008 from the Universit\u00e0 Cattolica del Sacro Cuore in Rome, where she subsequently continued her postgraduate training. She completed her residency in Orthopaedics and Traumatology in 2014 and earned her PhD in 2017. Her training was primarily focused on sports traumatology, with a particular interest in knee and shoulder surgery, under the guidance of Prof. Giuseppe Milano.During the final year of her residency, she completed a research fellowship and clinical observership at Rush University Medical Center in Chicago, Illinois, where she had the opportunity to work alongside and observe Prof. Anthony Romeo, Nikhil N. Verma, Brian Cole, and Gregory Nicholson.In 2015, she was selected for the European Arthroscopy Fellowship (EAF).In 2022, she was selected for the ESSKA-AOSSM Travelling Fellowship. During the same year, she also had the opportunity to further develop her training in shoulder surgery with Dr. Philippe Collin, SECEC Past-President.In 2024, she was awarded the prestigious SECEC-ASES Travelling Fellowship, a highly selective international fellowship jointly promoted by the European Society for Surgery of the Shoulder and the Elbow (SECEC) and the American Shoulder and Elbow Surgeons (ASES), further strengthening her international experience and collaboration in the field of shoulder and elbow surgery.From December 2020 to April 2025, she worked at Spedali Civili di Brescia, where she combined clinical, research, and academic activities. In November 2024, she obtained the academic qualification of Associate Professor of Orthopaedics and Traumatology.She is actively involved in several national and international scientific societies, including the European Society for Surgery of the Shoulder and the Elbow (SECEC), the American Shoulder and Elbow Surgeons (ASES), the International Society of Arthroscopy, Knee Surgery and Orthopaedic Sports Medicine (ISAKOS), the European Society of Sports Traumatology, Knee Surgery and Arthroscopy (ESSKA), the European Shoulder Associates (ESA), the Italian Society of Knee Surgery, Arthroscopy, Sports Traumatology and Orthopaedic Technologies (SIAGASCOT), the Italian Society of Orthopaedics and Traumatology (SIOT), and the Italian Society of Shoulder and Elbow Surgery (SICSEG).Within her scientific society activities, she currently serves as Head of the Upper Limb Macroarea of SIAGASCOT and as Treasurer of the European Society for Surgery of the Shoulder and the Elbow (SECEC).\"\n32121068-4d6a-4714-a472-3322a81a84f3,George,Cross,ST7 Trauma & Orthopaedic Registrar on the prestigious Stanmore Rotation and incoming Stanmore Rotation President. Graduated with Distinction in Clinical Practice from Imperial College School of Medicine. Currently pursuing further subspecialty fellowship in Shoulder & Elbow Surgery.\n33055ac8-de24-4a86-b404-ee6c2ef00a8f,Andrea,Chan,\n33bc4f87-b902-46c3-a552-1899db83d42d,Julian,Hasler,\n34483f8e-6803-4129-b6f0-c64013b09941,Mark,Falworth,\"Mr Mark Falworth. MB BS, FRCS (Eng). FRCS (Orth)Royal National Orthopaedic Hospital, Stanmore, UK.Mr Falworth was appointed as Consultant Shoulder and Elbow Surgeon to the Royal National Orthopaedic Hospital (RNOH), Stanmore, UK in 2006 and is the current elected President of the British Elbow & Shoulder Society (BESS). His clinical practice at the RNOH deals mainly with complex and revision shoulder and elbow surgery, including the revision of infected shoulder and elbow arthroplasty, with the department acting as a tertiary referral centre for other orthopaedic surgeons throughout the UK. His research interests include shoulder and elbow arthroplasty and prosthetic joint injection, and he has published widely including co-authoring the BESS Best Practice guidelines for the provision of primary and revision elbow replacement surgery and also the management of Prosthetic Joint Infection (PJI). Mr Falworth is the BESS PJI Lead and participated in the ICM Philly meeting in 2018 and was privileged to be asked to be on the Shoulder Executive Committee for ICM Istanbul 2025.\"\n344c53eb-e3c8-4860-8ecc-a58b5b0f9a39,Manuel,Lobos,\n34d4a219-9ee5-4531-aa45-951411631fcd,Antonette Mariama,Bilog,\"Sports Medicine and Shoulder Surgery Fellow, Department of Orthopaedics, St. George Hospital, SydneyClinical Research Fellow, Orthopaedic Research Institute, University of New South Wales\"\n355239d4-d94e-42a4-97ae-ca052c707504,Ramon,Santos,Orthopaedic surgeon from the Federal University of S\u00e3o Paulo (UNIFESP). Fellowship in Shoulder and Elbow Surgery.\n35a59e8c-ae3f-4562-aed7-63f0b2bfe54e,Sang-Pil,So,\n35e027ee-421f-438b-ab4f-a61713cdd4aa,Radhakrishna,Kantanavar,\"I am a Postdoctoral Research Fellow in the Division of Shoulder Surgery at the Johns Hopkins University School of Medicine, Baltimore, USA. I completed my orthopaedic training at King Edward Memorial Hospital, Mumbai, followed by advanced fellowship training in shoulder and elbow surgery in South Korea and gained additional clinical and biomechanical research experience in Australia. My clinical practice and research focus on shoulder and elbow surgery, with particular interests in reverse shoulder arthroplasty, revision shoulder arthroplasty, complex reconstruction for glenoid bone loss, shoulder instability, and rotator cuff disorders. My goal is to integrate clinical practice with high-quality research to advance evidence-based shoulder and elbow surgery and improve patient outcomes.\"\n362ee29c-37f7-4202-9ea0-acdf56debb18,John,Sperling,\n363b4601-fe07-48a1-995d-0a105a30e5bf,PIERRE,METAIS,Shoulder surgery; education and researchPast-president of the French Society of Shoulder and Elbow Surgery (SoFEC)\n365aba37-99b5-4b71-b4b3-fb4fd3e0acf0,Erica,Lante,\n366741d3-d05f-4686-a5c3-88771d2550e9,Moin,Khan,\n36872020-3e4a-4a67-b43d-63f677e8734b,Lauren,Grobaty,\"Dr. Lauren Grobaty is a chief orthopaedic surgery resident at Cleveland Clinic in Cleveland, Ohio. She recently matched at the Rothman Orthopaedic Institute, where she will begin a Shoulder & Elbow Fellowship in 2027. She graduated from Harvard University in 2018 with a Bachelor of Arts in Cognitive Neuroscience & Evolutionary Psychology and a minor in History of Art & Architecture. She earned her medical degree from Case Western Reserve University School of Medicine, where she was actively involved in shoulder & elbow research and medical student education. Originally from Orange County, California, Dr. Grobaty is also a former competitive dancer and continues to enjoy dance recreationally.\"\n36a30520-df8b-4548-9b5b-efcf87442ad4,David,Ensor,\"David Ensor is a senior orthopaedic trainee on the Royal London Rotation, UK. He has an background in data science and machine learning and interest in upper limb surgery.\"\n36ae3d7f-36c3-4052-906d-8693df85772b,Stefan,Bauer,\"APPENDIX B: SHORT CURRICULUM VITAE Personal Details\u2022Name: Dr. med. Stefan Bauer, MD, PhD cand., Orthopaedic Shoulder and Elbow Surgeon\u2022Institutional Affiliations: Shoulder, Elbow and Upper Limb Centre of the Service d\u2019orthop\u00e9die et traumatology at Hospital, Ensemble Hospitalier de la C\u00f4te (EHC), Morges, Vaud, Switzerland. UWA research collaborator and PhD Student.\u2022Linkedin: https://www.linkedin.com/in/stefan-bauer-9055b46/\u2022Languages, surgical research network: Trilingual in German (C2 native), French (C1-C2), English (C1-C2); Germany, Austria, Switzerland, France, Europe, Australia, Canada and USA.Education and Training\u20222022-2026 PhD in Reverse Total Shoulder Arthroplasty, Shoulder Surgery, and Orthopaedics, University of Western Australia\u20222025 Clinical observership with Dr Mark Frankle \u20222019 Clinical observership with Dr George Athwal and Professor Graham King \u20222015-2017 Integrated fellowship with Prof. Markus Loew and Dr. Sven Lichtenberg \u20222012 Clinical observership with Dr Gilles Walch \u20222006-2015 Orthopaedic surgery training, Western Australia (Perth) \u2014 8.5 years of postgraduate surgical training, in orthopaedics, with focus on shoulder and elbow surgery\u20222005-2008 Basic Surgical Training in Edinburgh with MRCSEd exams \u20222005 Medical school and national exam, University of T\u00fcbingen and Heidelberg \u20222005 Doctorate (Dr. med.), University of Heidelberg and RWTH AachenCartilage research in clinical and basic scienceMentorshipI am grateful for the mentorship and guidance of recognised leaders in shoulder surgery:\u2022Dr Gilles Walch (Lyon, France) \u2013 mentorship in shoulder arthroplasty, shaping my early academic and clinical foundation.\u2022Prof. Markus Loew and Dr. Sven Lichtenberg (ATOS Clinic, Heidelberg, Germany) \u2013 fellowship mentors in advanced shoulder and elbow surgery, with a focus on arthroplasty and
